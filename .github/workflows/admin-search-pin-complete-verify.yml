name: Admin article search and 48h pin verification
on:
  push:
    branches: [fix/admin-search-pin-complete-20260930, main]
    paths:
      - '.github/workflows/admin-search-pin-complete-verify.yml'
      - 'scripts/admin-search-pin-*'
      - 'netlify/functions/_shared/article-admin-actions.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-search-pin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  branch-verification:
    if: github.ref != 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-search-pin-complete-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate known sources and run complete search and pin regressions
        run: |
          if ! test -f scripts/admin-search-pin-installation.json; then
            node scripts/admin-search-pin-integrate.mjs
          fi
          node --experimental-strip-types --test scripts/admin-search-pin-complete.test.mjs scripts/article-search.test.mjs
          node --check scripts/admin-search-pin-ui.e2e.mjs
          node --check scripts/admin-search-pin-live.mjs
      - name: Prepare isolated browser without user accounts
        run: |
          npm install --prefix /tmp/admin-browser --no-save playwright@1.51.1
          /tmp/admin-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check PC and phone search, confirmation and pinned filter
        run: node scripts/admin-search-pin-ui.e2e.mjs
      - name: Commit only tested integration to the feature branch
        run: |
          node --input-type=module <<'JS'
          import {existsSync,readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          if(existsSync('.admin-search-pin-apply.json')){
            const report=JSON.parse(readFileSync('.admin-search-pin-apply.json','utf8'));
            const marker='scripts/admin-search-pin-installation.json';
            writeFileSync(marker,JSON.stringify({...report,verification_run:process.env.GITHUB_RUN_ID},null,2)+'\n');
            execFileSync('git',['add','--',...report.changed_files,marker],{stdio:'inherit'});
            execFileSync('git',['diff','--cached','--check'],{stdio:'inherit'});
            execFileSync('git',['config','user.name','github-actions[bot]']);
            execFileSync('git',['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
            execFileSync('git',['commit','-m','fix(admin): activate bounded full-text search and confirmed 48-hour pin controls'],{stdio:'inherit'});
            execFileSync('git',['push','origin','HEAD:fix/admin-search-pin-complete-20260930'],{stdio:'inherit'});
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-search-pin-ui-verification
          path: artifacts/admin-search-pin-ui
          if-no-files-found: ignore
  production-acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only real article search and homepage acceptance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/admin-search-pin-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-search-pin-live-acceptance
          path: artifacts/admin-search-pin-live
          if-no-files-found: ignore
