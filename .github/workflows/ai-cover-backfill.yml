name: 新闻AI封面自动补全

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ai-cover-backfill.mjs"
      - ".github/workflows/ai-cover-backfill.yml"
  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: read

concurrency:
  group: trrb-ai-cover-backfill
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ARTICLE_COVER_BUCKET: "article-covers"
      AI_COVER_MAX_PER_RUN: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and persist missing article covers
        run: node scripts/ai-cover-backfill.mjs
