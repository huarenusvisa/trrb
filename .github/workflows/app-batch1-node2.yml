name: APP Batch 1 Node 2

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'apps/mobile/src/components/TrRbAvatar.tsx'
      - 'apps/mobile/app/article/[id].tsx'
      - 'scripts/audit-app-batch1-node2.mjs'
      - '.github/workflows/app-batch1-node2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit random nickname and avatar defaults
        run: node scripts/audit-app-batch1-node2.mjs
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npm run typecheck
