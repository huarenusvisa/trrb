name: APP Batch 1 Node 3

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/package.json'
      - 'apps/mobile/src/auth/**'
      - 'apps/mobile/app/auth.tsx'
      - 'apps/mobile/app/(tabs)/profile.tsx'
      - 'scripts/audit-app-batch1-node3.mjs'
      - '.github/workflows/app-batch1-node3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit auth and session requirements
        run: node scripts/audit-app-batch1-node3.mjs
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npm run typecheck
