name: APP Batch 1 Node 4

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/app/profile-settings.tsx'
      - 'apps/mobile/app/(tabs)/profile.tsx'
      - 'apps/mobile/src/components/TrRbAvatar.tsx'
      - 'supabase/migrations/20260816135000_trrb_profile_settings_constraints.sql'
      - 'scripts/audit-app-batch1-node4.mjs'
      - '.github/workflows/app-batch1-node4.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit profile settings requirements
        run: node scripts/audit-app-batch1-node4.mjs
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npm run typecheck
