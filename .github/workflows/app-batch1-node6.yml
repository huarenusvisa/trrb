name: APP Batch 1 Node 6

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260816114500_trrb_identity_and_community_foundation.sql'
      - 'supabase/migrations/20260816154500_trrb_comment_governance.sql'
      - 'apps/mobile/src/api/comments.ts'
      - 'apps/mobile/src/components/CommentThread.tsx'
      - 'scripts/audit-app-batch1-node6.mjs'
      - '.github/workflows/app-batch1-node6.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit comment governance requirements
        run: node scripts/audit-app-batch1-node6.mjs
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npm run typecheck
