name: APP Batch 2 Node 1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'netlify/functions/public-home-articles.js'
      - 'netlify/functions/public-articles.js'
      - 'netlify/functions/public-article.js'
      - 'scripts/audit-app-batch2-node1.mjs'
      - '.github/workflows/app-batch2-node1.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'netlify/functions/public-home-articles.js'
      - 'netlify/functions/public-articles.js'
      - 'netlify/functions/public-article.js'
      - 'scripts/audit-app-batch2-node1.mjs'
      - '.github/workflows/app-batch2-node1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/audit-app-batch2-node1.mjs
