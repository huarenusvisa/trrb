name: APP Batch 2 Node 2

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify node 2 category navigation and pagination
        run: node scripts/audit-app-batch2-node2.mjs
