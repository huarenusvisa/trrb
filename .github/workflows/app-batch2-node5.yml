name: APP Batch 2 Node 5

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Verify node 5 follow graph and user profiles
        run: node scripts/audit-app-batch2-node5.mjs
