name: APP Batch 2 Node 6

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'supabase/migrations/20260816220000_app_batch2_social_graph.sql'
      - 'supabase/migrations/20260817023000_app_batch2_notification_triggers.sql'
      - 'scripts/audit-app-batch2-node6.mjs'
      - '.github/workflows/app-batch2-node6.yml'
      - 'docs/APP-BATCH-2-NEWS-EXPERIENCE-AND-ENGAGEMENT.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Verify node 6 notification center
        run: node scripts/audit-app-batch2-node6.mjs
