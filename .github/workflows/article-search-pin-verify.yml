name: Article search and 48-hour pin verification
on:
  push:
    branches: [fix/article-search-pin-48h-20260930, main]
    paths:
      - '.github/workflows/article-search-pin-verify.yml'
      - 'scripts/article-search-*'
      - 'article-pin-policy.js'
      - 'netlify/functions/_shared/article-list-reader.js'
      - 'netlify/functions/_shared/article-partition-search.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: article-search-pin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/article-search-pin-48h-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate only reviewed versions without database access
        run: |
          if ! test -f scripts/article-search-pin-installation.json; then
            node scripts/article-search-pin-upgrade.mjs
            node scripts/article-search-pin-finish.mjs
          fi
          node scripts/article-search-pin-finalize.mjs
          node --check scripts/article-search-pin.e2e.mjs
          node --experimental-strip-types --test scripts/article-search-partition.test.mjs scripts/article-search-pin.test.mjs scripts/article-search.test.mjs scripts/article-editorial-policy.test.mjs
      - name: Prepare isolated browser
        run: |
          npm install --prefix /tmp/article-admin-browser --no-save playwright@1.51.1
          /tmp/article-admin-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test real admin UI with synthetic responses and no credentials
        run: node scripts/article-search-pin.e2e.mjs
      - name: Read-only acceptance against real data for both reported keywords
        env:
          SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/article-search-pin-live.mjs --backend
      - name: Commit only tested feature changes
        run: |
          node --input-type=module <<'JS'
          import {existsSync,readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          if(existsSync('.article-search-pin-change.json')){
            const receipt=JSON.parse(readFileSync('.article-search-pin-change.json','utf8'));
            const marker='scripts/article-search-pin-installation.json';
            const data=JSON.parse(readFileSync('artifacts/article-search-pin-live/backend.json','utf8'));
            writeFileSync(marker,JSON.stringify({...receipt,verification_run:process.env.GITHUB_RUN_ID,real_data_search:data,production_test_posts_created:0},null,2)+'\n');
            execFileSync('git',['add','--',...receipt.changed_files,marker],{stdio:'inherit'});
            execFileSync('git',['diff','--cached','--check'],{stdio:'inherit'});
            execFileSync('git',['config','user.name','github-actions[bot]']);
            execFileSync('git',['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
            execFileSync('git',['commit','-m','fix(articles): restore complete bounded search and expose expiring homepage pins'],{stdio:'inherit'});
            execFileSync('git',['push','origin','HEAD:fix/article-search-pin-48h-20260930'],{stdio:'inherit'});
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-search-pin-verification
          path: |
            artifacts/article-search-pin
            artifacts/article-search-pin-live
          if-no-files-found: ignore
  production-acceptance:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare read-only browser
        run: |
          npm install --prefix /tmp/article-admin-browser --no-save playwright@1.51.1
          /tmp/article-admin-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify deployed searches and expired homepage pins
        run: node scripts/article-search-pin-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-search-pin-production-acceptance
          path: artifacts/article-search-pin-live
          if-no-files-found: ignore
