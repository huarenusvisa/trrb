name: AsylumJudge 独立站部署

on:
  push:
    branches: [main]
    paths:
      - 'asylumjudge/**'
      - 'immigration-judge-approval-rate/**'
      - 'scripts/build-asylumjudge-site.mjs'
      - 'netlify.asylumjudge.toml'
      - '.github/workflows/asylumjudge-production-deploy.yml'
  workflow_dispatch:

concurrency:
  group: asylumjudge-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 7beb8b62-f7e3-49fc-b954-46699c9956b7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify deploy authorization
        run: test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo 'NETLIFY_AUTH_TOKEN is not configured'; exit 2; }
      - name: Build isolated AsylumJudge bundle
        run: node scripts/build-asylumjudge-site.mjs
      - name: Deploy AsylumJudge production site
        working-directory: .netlify/asylumjudge-bundle
        run: >-
          npx --yes netlify-cli@latest deploy
          --prod
          --no-build
          --site "$NETLIFY_SITE_ID"
          --dir public
          --functions netlify/functions
          --message "AsylumJudge ${GITHUB_SHA}"
      - name: Verify live chart assets
        run: |
          for attempt in $(seq 1 12); do
            html="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://asylumjudge.com/?deploy=${GITHUB_SHA}-${attempt}" || true)"
            if grep -q 'site.js?v=3' <<<"$html" && grep -q 'state-market-chart' <<<"$html"; then
              echo 'AsylumJudge production deploy verified.'
              exit 0
            fi
            sleep 10
          done
          echo 'AsylumJudge production did not expose the expected chart assets.' >&2
          exit 1
