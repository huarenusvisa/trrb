name: China Hot · Li Teacher Content Intake

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: china-hot-li-teacher-content-intake
  cancel-in-progress: true

jobs:
  collect-to-content-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      # 定时任务可能延迟；回看24小时并依靠原帖ID、旧闻检查和近30天语义查重补漏。
      LI_TEACHER_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '24' }}
      LI_TEACHER_MAX_FETCH: ${{ inputs.recover_archived && '200' || '100' }}
      LI_TEACHER_MAX_PUBLISH: ${{ inputs.recover_archived && '150' || '20' }}
      LI_TEACHER_PUBLISH_CONCURRENCY: "8"
      CHINA_HOT_REPAIR_SINCE: "2026-08-24T00:00:00Z"
      CHRT_INGEST_URL: "https://chinahumanrightstracker.org/api/ingest/trrb"
      CHRT_SYNC_LOOKBACK_HOURS: "72"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claim shared three-hour collection cadence
        id: due
        env:
          COLLECTION_PIPELINE: "china-hot"
          COLLECTION_CADENCE_ACTION: "claim"
          COLLECTION_CADENCE_MINUTES: "180"
          COLLECTION_FORCE: ${{ github.event_name != 'schedule' }}
        run: node scripts/collection-cadence-gate.mjs
      - name: Validate secrets
        if: steps.due.outputs.due == 'true'
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          if [[ "${{ inputs.recover_archived }}" != "true" && "${{ inputs.repair_today }}" != "true" ]]; then test -n "$X_BEARER_TOKEN"; fi
          test -n "$OPENAI_API_KEY"
      - name: Run collector tests
        if: steps.due.outputs.due == 'true'
        run: node --test scripts/china-hot-li-teacher-ingest.test.mjs
      - name: Collect China headlines and publish automatically
        if: steps.due.outputs.due == 'true'
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.repair_today }}" == "true" ]]; then
            args+=(--repair-today)
          elif [[ "${{ inputs.recover_archived }}" == "true" ]]; then
            args+=(--recover-archived)
          fi
          node scripts/china-hot-li-teacher-ingest.mjs "${args[@]}"
      - name: Complete cadence heartbeat
        if: success() && steps.due.outputs.due == 'true'
        env:
          COLLECTION_PIPELINE: "china-hot"
          COLLECTION_CADENCE_ACTION: "success"
        run: node scripts/collection-cadence-gate.mjs
      - name: Record cadence failure
        if: failure() && steps.due.outputs.due == 'true'
        env:
          COLLECTION_PIPELINE: "china-hot"
          COLLECTION_CADENCE_ACTION: "failure"
          COLLECTION_CADENCE_ERROR: "中国热门头条采集失败"
        run: node scripts/collection-cadence-gate.mjs || true
