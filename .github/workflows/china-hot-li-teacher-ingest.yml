name: China Hot · Li Teacher Content Intake

on:
  schedule:
    - cron: "27 */3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/china-hot-li-teacher-ingest.yml"
  workflow_call:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "抓取最近多少小时（默认24小时，用于补偿定时任务延迟）"
        required: false
        default: "24"
        type: string
      recover_archived:
        description: "补发时间范围内误归档的中国热门头条"
        required: false
        default: false
        type: boolean
      repair_today:
        description: "重写今天已发布的热门头条，使用原帖图片补充具体信息并清除套话"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: china-hot-li-teacher-content-intake
  cancel-in-progress: true

jobs:
  collect-to-content-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      # 定时任务可能延迟；回看24小时并依靠原帖ID、旧闻检查和近30天语义查重补漏。
      LI_TEACHER_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '24' }}
      LI_TEACHER_MAX_FETCH: ${{ inputs.recover_archived && '200' || '100' }}
      LI_TEACHER_MAX_PUBLISH: ${{ inputs.recover_archived && '150' || '20' }}
      LI_TEACHER_PUBLISH_CONCURRENCY: "8"
      CHINA_HOT_REPAIR_SINCE: "2026-08-24T00:00:00Z"
      CHRT_INGEST_URL: "https://chinahumanrightstracker.org/api/ingest/trrb"
      CHRT_SYNC_LOOKBACK_HOURS: "72"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          if [[ "${{ inputs.recover_archived }}" != "true" && "${{ inputs.repair_today }}" != "true" ]]; then test -n "$X_BEARER_TOKEN"; fi
          test -n "$OPENAI_API_KEY"
      - name: Run collector tests
        run: node --test scripts/china-hot-li-teacher-ingest.test.mjs
      - name: Collect China headlines and publish automatically
        shell: bash
        run: |
          args=()
          if [[ "${{ inputs.repair_today }}" == "true" ]]; then
            args+=(--repair-today)
          elif [[ "${{ inputs.recover_archived }}" == "true" ]]; then
            args+=(--recover-archived)
          fi
          node scripts/china-hot-li-teacher-ingest.mjs "${args[@]}"
