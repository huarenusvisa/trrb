name: 紧急文章跳转验收

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 等待Netlify回滚部署
        run: sleep 90
      - name: 检查最新20篇文章的新旧URL跳转
        run: node scripts/verify-live-navigation-emergency.mjs
