name: 历史文章路由兼容验收（只读）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "netlify/edge-functions/00-legacy-article-query-guard.ts"
      - "netlify/edge-functions/article-prerender.ts"
      - "article.html"
      - "articles-home-index.js"
      - ".github/workflows/fix-archived-article-route-compat.yml"

permissions:
  contents: read

concurrency:
  group: trrb-validate-archived-article-route-compat
  cancel-in-progress: true

jobs:
  verify-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 校验当前兼容规则
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'wordpress-prefix-to-static-archive' netlify/edge-functions/00-legacy-article-query-guard.ts
          grep -q 'archiveHasId' netlify/edge-functions/00-legacy-article-query-guard.ts
          grep -q 'article-edge-v4-archive-410-ice-safe' netlify/edge-functions/article-prerender.ts
          grep -q 'articles-home-index.js?v=20260819-archive' article.html

      - name: 等待生产部署并验证有效档案与无效WP链接
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 72); do
            stamp="${GITHUB_RUN_ID}-${attempt}"
            valid=$(curl -sS -o /tmp/valid.html -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/article.html?id=117382&archive-verify=$stamp" || true)
            missing=$(curl -sS -o /tmp/missing.html -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/article.html?id=wp-117123&archive-verify=$stamp" || true)
            wp_valid=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/article.html?id=wp-117382&archive-verify=$stamp" | tr -d '\r' || true)
            wp_redirect=$(printf '%s' "$wp_valid" | grep -c '^HTTP/.* 301' || true)
            wp_location=$(printf '%s' "$wp_valid" | grep -ci '^location: https://trrb.net/article.html?id=117382' || true)
            if [ "$valid" = "200" ] && [ "$missing" = "410" ] && [ "$wp_redirect" -ge 1 ] && [ "$wp_location" -ge 1 ]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo 'ARCHIVED_ARTICLE_ROUTE_COMPATIBILITY_PASS=true'
