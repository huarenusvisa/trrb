name: Category Live Order and Asylum Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify current category live-order architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fetchLivePublishedArticles(200, category)' listing.js
          grep -q 'articleTimestamp(b)-articleTimestamp(a)' listing.js
          grep -q 'query.category_name' netlify/functions/public-home-articles.js
          grep -q 'sparseCategories' netlify/functions/public-home-bundle.js
          grep -q 'database_queries' netlify/functions/public-home-bundle.js
          grep -q '4d-core-plus-category-supplements' homepage-refresh-guard.js
          grep -q 'data-seo-category-snapshot' netlify/edge-functions/category-prerender.ts
          grep -q 'prettyCategoryByPath' listing-seo.js
          echo 'CATEGORY_LIVE_ONLY=true'
          echo 'CATEGORY_SORT=published_at_desc'
          echo 'ASYLUM_SPARSE_SUPPLEMENT_SOURCE=public-home-bundle'

      - name: Production category smoke check
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            stamp="${GITHUB_RUN_ID}-${attempt}"
            important=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/important-news?category-verify=$stamp" || true)
            asylum=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/asylum?category-verify=$stamp" || true)
            bundle=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/.netlify/functions/public-home-bundle?category-verify=$stamp" || true)
            if printf '%s' "$important" | grep -q 'data-seo-category-snapshot="edge"' \
              && printf '%s' "$asylum" | grep -q 'data-seo-category-snapshot="edge"' \
              && printf '%s' "$bundle" | grep -q '"mode":"homepage"' \
              && printf '%s' "$bundle" | grep -q '"database_queries":'; then
              echo 'CATEGORY_PRODUCTION_VALIDATION_PASS=true'
              exit 0
            fi
            sleep 5
          done
          exit 1
