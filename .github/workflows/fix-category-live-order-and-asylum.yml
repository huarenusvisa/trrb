name: Fix Category Live Order and Asylum

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-listing-category-live-order-and-asylum.mjs'
      - '.github/workflows/fix-category-live-order-and-asylum.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply category live-order and asylum repair
        run: node scripts/fix-listing-category-live-order-and-asylum.mjs
      - name: Verify repair markers
        run: |
          grep -q 'fetchLivePublishedArticles(200, category)' listing.js
          grep -q 'sort((a,b) => articleTimestamp(b)-articleTimestamp(a))' listing.js
          grep -q 'query.category_name' netlify/functions/public-home-articles.js
          grep -q '"庇护百科"' articles-home.js
      - name: Commit repair
        run: |
          if git diff --quiet -- listing.js articles-home.js netlify/functions/public-home-articles.js; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add listing.js articles-home.js netlify/functions/public-home-articles.js
          git commit -m 'Fix category pages live ordering and asylum feed'
          git push
