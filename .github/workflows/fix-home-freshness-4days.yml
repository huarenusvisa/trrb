name: Homepage Freshness 4 Days Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'articles-home.js'
      - 'homepage-refresh-guard.js'
      - '.github/workflows/fix-home-freshness-4days.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify four-day freshness rule without rewriting source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const HOME_MAX_AGE_MS = 4 * 24 * 60 * 60 * 1000;' articles-home.js
          grep -F 'const HOME_MAX_AGE_MS = 4 * 24 * 60 * 60 * 1000;' homepage-refresh-guard.js
          ! grep -F 'const HOME_MAX_AGE_MS = 14 * 24 * 60 * 60 * 1000;' articles-home.js
          ! grep -F 'const HOME_MAX_AGE_MS = 14 * 24 * 60 * 60 * 1000;' homepage-refresh-guard.js
          echo 'HOME_FRESHNESS_DAYS=4'
          echo 'HOMEPAGE_OLDER_THAN_4_DAYS_BLOCKED=true'
