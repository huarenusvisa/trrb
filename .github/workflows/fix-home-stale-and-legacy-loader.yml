name: 首页实时源与历史文章兼容验收（只读）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-home-live-and-legacy-loader
  cancel-in-progress: true

jobs:
  verify-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 校验当前首页实时源与历史兼容架构
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fetchUnifiedHomeBundle' articles-home.js
          grep -q 'public-home-bundle' homepage-refresh-guard.js
          grep -q 'articles-home-index.js?v=20260819-archive' article.html
          grep -q 'article.js?v=29.8-legacy-archive-rescue' article.html
          grep -q 'archiveHasId' netlify/edge-functions/article-prerender.ts
          grep -q 'archiveHasId' netlify/edge-functions/00-legacy-article-query-guard.ts
          grep -q '20260819-single-bundle-2' scripts/optimize-homepage-performance.mjs
          grep -q '20260819-bundle-supplements-2' scripts/optimize-homepage-performance.mjs

      - name: 生产验收实时首页与历史文章
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 72); do
            stamp="${GITHUB_RUN_ID}-${attempt}"
            home=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/?home-legacy-verify=$stamp" || true)
            bundle=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/.netlify/functions/public-home-bundle?home-legacy-verify=$stamp" || true)
            archive_code=$(curl -sS -o /tmp/archive.html -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/article.html?id=117382&home-legacy-verify=$stamp" || true)
            gone_code=$(curl -sS -o /tmp/gone.html -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/article.html?id=wp-117123&home-legacy-verify=$stamp" || true)
            if printf '%s' "$home" | grep -q 'articles-home.js?v=20260819-single-bundle-2' \
              && printf '%s' "$home" | grep -q 'homepage-refresh-guard.js?v=20260819-bundle-supplements-2' \
              && printf '%s' "$bundle" | grep -q '"mode":"homepage"' \
              && [ "$archive_code" = "200" ] \
              && [ "$gone_code" = "410" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          echo 'HOME_LIVE_AND_LEGACY_ARCHIVE_VALIDATION_PASS=true'
