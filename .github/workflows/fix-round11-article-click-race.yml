name: 第十一轮文章跳转竞态验收（只读）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "article.html"
      - "article-live-neighbors.js"
      - "article-v31.js"
      - "articles-home.js"
      - "netlify/edge-functions/article-prerender.ts"
      - ".github/workflows/fix-round11-article-click-race.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: 校验当前文章路由不会被旧客户端覆盖
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'article-edge-v4-archive-410-ice-safe' netlify/edge-functions/article-prerender.ts
          grep -q 'data-prerendered' article-v31.js
          grep -q 'root?.dataset.articleId' article-live-neighbors.js
          grep -q 'articles-home-index.js?v=20260819-archive' article.html
          grep -q 'article.js?v=29.8-legacy-archive-rescue' article.html
          grep -q 'articles-home.js?v=20260819-seo-canonical-1' index.html
          echo 'ARTICLE_CLICK_RACE_CURRENT_ARCHITECTURE_PASS=true'
