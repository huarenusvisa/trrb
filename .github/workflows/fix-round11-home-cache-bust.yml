name: 第十一轮首页文章路由缓存验收（只读）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: 校验当前首页路由与缓存架构
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'fetchUnifiedHomeBundle' articles-home.js
          grep -q '4d-core-plus-category-supplements' homepage-refresh-guard.js
          grep -q '20260819-seo-v5' scripts/optimize-homepage-performance.mjs
          grep -q '20260819-single-bundle-2' scripts/optimize-homepage-performance.mjs
          grep -q '20260819-bundle-supplements-2' scripts/optimize-homepage-performance.mjs
          ! grep -q '30.5-r11-routefix' index.html
          ! grep -q '30.5-r11-routefix' scripts/optimize-homepage-performance.mjs
          echo 'ROUND11_STALE_CACHE_PATCHER_RETIRED=true'
