name: 第十一轮首页文章路由缓存验收（只读）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "articles-home.js"
      - "index.html"
      - "homepage-refresh-guard.js"
      - ".github/workflows/fix-round11-home-cache-bust.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: 校验当前首页路由与缓存版本
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'articles-home.js?v=20260819-seo-canonical-1' index.html
          grep -q 'homepage-refresh-guard.js?v=20260819-single-live-1' index.html
          grep -q 'article-route-runtime.js?v=20260819-seo-v4' index.html
          ! grep -q '30.5-r11-routefix' index.html
          ! grep -q '30.5-r11-routefix' scripts/optimize-homepage-performance.mjs
          echo 'ROUND11_STALE_CACHE_PATCHER_RETIRED=true'
