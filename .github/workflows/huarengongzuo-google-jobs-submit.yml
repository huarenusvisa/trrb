name: 华人工作网 SEO任务池（中央机器人接管）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huarengongzuo-seo-task-pool
  cancel-in-progress: true

jobs:
  validate-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify independent task manifest
        run: |
          node scripts/huarengongzuo-public-seo.test.mjs
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('huarengongzuo/seo/tasks.json', 'utf8'));
          if (manifest.origin !== 'https://huarengongzuo.com') throw new Error('origin mismatch');
          if (manifest.dispatch !== false) throw new Error('independent dispatch must remain false');
          if (!Array.isArray(manifest.tasks) || !manifest.tasks.length) throw new Error('task pool is empty');
          console.log(`Central handoff ready: ${manifest.tasks.length} tasks; no external submission.`);
          NODE
      - name: Save central handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: huarengongzuo-seo-task-pool
          path: |
            huarengongzuo/seo/tasks.json
            huarengongzuo/seo/current-snapshot.json
          retention-days: 30
