name: ICE持续采集线

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ice-collector-continuous.yml"
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"

permissions:
  contents: read

concurrency:
  group: trrb-ice-collector-continuous
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-http-header-size=65536"
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN || secrets.X_API_BEARER_TOKEN || secrets.TWITTER_BEARER_TOKEN }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  RUN_MODE: "process"
  ICE_PRIORITY_LOOKBACK_MINUTES: "720"
  ICE_EXTRA_LOOKBACK_MINUTES: "720"
  ICE_ADDED_SOURCE_LOOKBACK_HOURS: "12"
  ICE_ADDED_SOURCE_MAX_PAGES: "1"
  ICE_PRIORITY_MAX_PAGES: "2"
  ICE_PRIORITY_ROTATION_GROUPS: "4"
  ICE_ERO_ROTATION_GROUPS: "4"
  ICE_ERO_LOOKBACK_HOURS: "12"
  ICE_MAX_SOURCE_AGE_MINUTES: "720"
  ICE_RECENT_DUPLICATE_WINDOW_MINUTES: "720"
  ICE_ENGLISH_DEDUPE_WINDOW_HOURS: "720"
  ICE_ENGLISH_DEDUPE_CANDIDATE_MINUTES: "750"
  ICE_ENGLISH_DEDUPE_MAX: "1400"
  ICE_OFFICIAL_FILTER_MAX: "1400"
  ICE_PRECOLLECT_MAX: "600"
  ICE_FAST_INTAKE_MAX: "400"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check New York window
        id: window
        shell: bash
        run: |
          H=$(TZ=America/New_York date +%H)
          if [[ "${{ github.event_name }}" == "schedule" ]] && (( 10#$H >= 2 && 10#$H < 8 )); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: "22"
      - name: Validate secrets
        if: steps.window.outputs.allowed == 'true'
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$X_BEARER_TOKEN"
      - name: Write collection heartbeat
        if: steps.window.outputs.allowed == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-collection-start"
          ICE_HEARTBEAT_STATUS: "running"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
      - name: Collect with hard timeout
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          set +e
          ok=0
          for script in scripts/ice-priority-discovery.mjs scripts/ice-ero-official-discovery.mjs scripts/ice-extra-monitored-discovery.mjs scripts/ice-added-source-discovery.mjs; do
            timeout 75s node "$script" && ok=1
          done
          [[ "$ok" -eq 1 ]]
      - name: Intake only
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          timeout 90s node scripts/ice-official-source-only.mjs
          timeout 60s node scripts/ice-drop-stale-posts.mjs || true
          timeout 60s node scripts/ice-filter-replies.mjs || true
          timeout 90s node scripts/ice-english-pretranslation-dedupe.mjs
          timeout 90s node scripts/ice-precollect-published-dedupe.mjs
          timeout 90s node scripts/ice-fast-intake.mjs
          timeout 60s node scripts/ice-dedupe-v3.mjs || true
      - name: Write collection success
        if: success() && steps.window.outputs.allowed == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-collection-start"
          ICE_HEARTBEAT_STATUS: "success"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
      - name: Write collection failure
        if: failure() && steps.window.outputs.allowed == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-collection-start"
          ICE_HEARTBEAT_STATUS: "failure"
          ICE_HEARTBEAT_ERROR: "ICE持续采集线失败"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
