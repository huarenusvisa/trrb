name: ICE应急看门狗

# 正常采集由 operations-control-plane 与中国热门头条共用同一条每3小时调度。
# 本工作流仅用于人工触发的即时恢复；代码变更由ICE生产流水线自身补跑。

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trrb-ice-watchdog-singleton
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  ICE_RUN_DUE_MINUTES: "185"

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable 24-hour watchdog
        id: window
        shell: bash
        run: |
          now=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "纽约时间 $now，执行ICE全天候应急心跳检查。"

      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'

      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: "22"

      - name: Check stale heartbeat
        id: due
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "人工或代码变更触发，立即恢复生产流水线。"
          elif ! node scripts/ice-run-due.mjs; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "最近成功超过185分钟，启动应急恢复。"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "主流水线心跳正常。"
          fi

      - name: Dispatch unique production pipeline
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ice-unified-pipeline.yml/dispatches" \
            -d '{"ref":"main"}')
          cat /tmp/dispatch.json || true
          if [[ "$status" != "204" ]]; then
            echo "应急启动失败，HTTP $status" >&2
            exit 1
          fi
          echo "已启动ICE唯一生产流水线。"

      - name: Report no-op
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due != 'true'
        run: echo "主流水线最近成功不足185分钟，无需补跑。"


# recovery-touch: 2026-07-31 morning
