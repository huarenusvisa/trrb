name: ICE直接救援生产线

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trrb-ice-rescue-direct
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-http-header-size=65536"
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN || secrets.X_API_BEARER_TOKEN || secrets.TWITTER_BEARER_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  RUN_MODE: "process"
  ICE_PRIORITY_LOOKBACK_MINUTES: "720"
  ICE_EXTRA_LOOKBACK_MINUTES: "720"
  ICE_ADDED_SOURCE_LOOKBACK_HOURS: "12"
  ICE_ADDED_SOURCE_MAX_PAGES: "2"
  ICE_PRIORITY_MAX_PAGES: "4"
  ICE_PRIORITY_ROTATION_GROUPS: "4"
  ICE_ERO_ROTATION_GROUPS: "4"
  ICE_ERO_LOOKBACK_HOURS: "12"
  ICE_MAX_SOURCE_AGE_MINUTES: "720"
  ICE_RECENT_DUPLICATE_WINDOW_MINUTES: "720"
  ICE_PUBLISHED_DEDUPE_DAYS: "30"
  ICE_PUBLISHED_SIMILARITY_THRESHOLD: "0.92"
  ICE_REVIEW_DUPLICATE_THRESHOLD: "0.92"
  ICE_ENGLISH_DEDUPE_WINDOW_HOURS: "720"
  ICE_ENGLISH_DEDUPE_CANDIDATE_MINUTES: "750"
  ICE_ENGLISH_DEDUPE_MAX: "2200"
  ICE_ENGLISH_DEDUPE_THRESHOLD: "0.92"
  ICE_OFFICIAL_FILTER_MAX: "2200"
  ICE_PRECOLLECT_MAX: "900"
  ICE_FAST_INTAKE_MAX: "600"
  ICE_MAX_AI_POSTS_PER_RUN: "14"
  ICE_MAX_STORIES_PER_RUN: "10"
  ICE_NORMALIZE_MAX_STORIES: "14"
  ICE_TRANSLATE_MAX_STORIES: "14"
  ICE_CROSS_LANGUAGE_DEDUPE_MAX: "600"
  ICE_AUTO_PUBLISH_SCORE: "80"
  ICE_AI_CONFIDENCE: "80"
  ICE_TRUSTED_AUTO_CONFIDENCE: "0"
  ICE_TRUSTED_MAX_AGE_MINUTES: "720"
  ICE_UNREVIEWED_EXPIRE_HOURS: "24"
  ICE_DEDUPE_HOURS: "720"

jobs:
  automation-gate:
    name: 读取ICE机器人硬开关
    runs-on: ubuntu-24.04
    outputs:
      global: ${{ steps.gate.outputs.global }}
      ice: ${{ steps.gate.outputs.ice }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/automation-gate.mjs

  rescue:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.ice == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Check New York collection window
        id: window
        shell: bash
        run: |
          NY_HOUR=$(TZ=America/New_York date +%H)
          if [[ "${{ github.event_name }}" == "schedule" ]] && (( 10#$NY_HOUR >= 2 && 10#$NY_HOUR < 8 )); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: "22"
      - name: Validate secrets
        if: steps.window.outputs.allowed == 'true'
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$X_BEARER_TOKEN"
          test -n "$OPENAI_API_KEY"
      - name: Write start heartbeat
        if: steps.window.outputs.allowed == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-collection-start"
          ICE_HEARTBEAT_STATUS: "running"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
      - name: Collect sources
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          set +e
          ok=0
          for script in scripts/ice-priority-discovery.mjs scripts/ice-ero-official-discovery.mjs scripts/ice-extra-monitored-discovery.mjs scripts/ice-added-source-discovery.mjs; do
            timeout 150s node "$script" && ok=1
          done
          [[ "$ok" -eq 1 ]]
      - name: Intake and dedupe
        if: steps.window.outputs.allowed == 'true'
        run: |
          node scripts/ice-official-source-only.mjs
          node scripts/ice-drop-stale-posts.mjs || true
          node scripts/ice-filter-replies.mjs || true
          node scripts/ice-english-pretranslation-dedupe.mjs
          node scripts/ice-precollect-published-dedupe.mjs
          node scripts/ice-fast-intake.mjs
          node scripts/ice-dedupe-v3.mjs || true
      - name: AI process
        if: steps.window.outputs.allowed == 'true'
        run: |
          node scripts/ice-ai-process-only.mjs
          node scripts/ice-editorial-normalize.mjs
          node scripts/ice-translate-title-body.mjs
      - name: Publish
        if: steps.window.outputs.allowed == 'true'
        env:
          ICE_FORCE_FIRST_PUBLISH: "true"
          ICE_PUBLISH_MAX_PER_RUN: "12"
        run: |
          node scripts/ice-restore-human-approved.mjs || true
          node scripts/ice-cross-language-dedupe.mjs || true
          node scripts/ice-dedupe-v3.mjs || true
          node scripts/ice-clean-existing-review-duplicates.mjs || true
          node scripts/ice-trusted-source-promote.mjs
          node scripts/ice-publish-due.mjs
      - name: Write success heartbeat
        if: success() && steps.window.outputs.allowed == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-pipeline"
          ICE_HEARTBEAT_STATUS: "success"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
      - name: Write failure heartbeat
        if: failure() && steps.window.outputs.allowed == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-pipeline"
          ICE_HEARTBEAT_STATUS: "failure"
          ICE_HEARTBEAT_ERROR: "ICE直接救援生产线失败"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
