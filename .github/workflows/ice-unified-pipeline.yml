name: ICE唯一生产流水线

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ice-unified-pipeline.yml"
      - "scripts/ice-*.mjs"

permissions:
  contents: read

concurrency:
  group: trrb-ice-production-singleton
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-http-header-size=65536"
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN || secrets.X_API_BEARER_TOKEN || secrets.TWITTER_BEARER_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  RUN_MODE: "process"
  ICE_PRIORITY_LOOKBACK_MINUTES: "720"
  ICE_EXTRA_LOOKBACK_MINUTES: "720"
  ICE_ADDED_SOURCE_LOOKBACK_HOURS: "12"
  ICE_ADDED_SOURCE_MAX_PAGES: "3"
  ICE_PRIORITY_MAX_PAGES: "6"
  ICE_PRIORITY_ROTATION_GROUPS: "4"
  ICE_ERO_ROTATION_GROUPS: "4"
  ICE_ERO_LOOKBACK_HOURS: "12"
  ICE_MAX_SOURCE_AGE_MINUTES: "720"
  ICE_RECENT_DUPLICATE_WINDOW_MINUTES: "720"
  ICE_PUBLISHED_DEDUPE_DAYS: "30"
  ICE_PUBLISHED_SIMILARITY_THRESHOLD: "0.92"
  ICE_REVIEW_DUPLICATE_THRESHOLD: "0.92"
  ICE_ENGLISH_DEDUPE_WINDOW_HOURS: "720"
  ICE_ENGLISH_DEDUPE_CANDIDATE_MINUTES: "750"
  ICE_ENGLISH_DEDUPE_MAX: "4000"
  ICE_ENGLISH_DEDUPE_THRESHOLD: "0.92"
  ICE_OFFICIAL_FILTER_MAX: "4000"
  ICE_PRECOLLECT_MAX: "1600"
  ICE_FAST_INTAKE_MAX: "1000"
  ICE_MAX_AI_POSTS_PER_RUN: "24"
  ICE_MAX_STORIES_PER_RUN: "18"
  ICE_NORMALIZE_MAX_STORIES: "24"
  ICE_TRANSLATE_MAX_STORIES: "24"
  ICE_CROSS_LANGUAGE_DEDUPE_MAX: "1000"
  ICE_AUTO_PUBLISH_SCORE: "80"
  ICE_AI_CONFIDENCE: "80"
  ICE_TRUSTED_AUTO_CONFIDENCE: "0"
  ICE_TRUSTED_MAX_AGE_MINUTES: "720"
  ICE_UNREVIEWED_EXPIRE_HOURS: "24"
  ICE_DEDUPE_HOURS: "720"
  ICE_PUBLISH_INTERVAL_MINUTES: "10"

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Enable 24-hour ICE collection
        id: window
        shell: bash
        run: |
          NY_TIME=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "纽约时间 $NY_TIME，ICE全天候采集已启用。"

      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'

      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: "22"

      - name: Validate required secrets
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo "缺少SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "缺少SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$X_BEARER_TOKEN" || { echo "缺少X_BEARER_TOKEN"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "缺少OPENAI_API_KEY"; exit 1; }

      - name: Run every shared three-hour trigger
        id: due
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          echo "due=true" >> "$GITHUB_OUTPUT"
          echo "与中国热门头条共用每3小时调度，本轮执行完整ICE采集。"

      - name: Read ICE category switches with safe fallback
        id: category
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true'
        shell: bash
        run: |
          if ! node scripts/category-pipeline-gate.mjs ice; then
            echo "分类配置读取失败，采用安全默认值。"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "auto_fetch=true" >> "$GITHUB_OUTPUT"
            echo "ai_rewrite=true" >> "$GITHUB_OUTPUT"
            echo "auto_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when ICE category is disabled
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true' && steps.category.outputs.enabled != 'true'
        run: echo "ICE栏目已在后台关闭，本轮不执行。"

      - name: Write start heartbeat
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true' && steps.category.outputs.enabled == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-collection-start"
          ICE_HEARTBEAT_STATUS: "running"
        run: node scripts/ice-pipeline-heartbeat.mjs || true

      - name: Collect all ICE sources
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true' && steps.category.outputs.enabled == 'true' && steps.category.outputs.auto_fetch == 'true'
        shell: bash
        run: |
          set +e
          ok=0
          for script in \
            scripts/ice-priority-discovery.mjs \
            scripts/ice-ero-official-discovery.mjs \
            scripts/ice-extra-monitored-discovery.mjs \
            scripts/ice-added-source-discovery.mjs
          do
            node "$script" && ok=1
          done
          [[ "$ok" -eq 1 ]]

      - name: Filter, dedupe and intake
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true' && steps.category.outputs.enabled == 'true' && steps.category.outputs.auto_fetch == 'true'
        shell: bash
        run: |
          set -e
          node scripts/ice-official-source-only.mjs
          node scripts/ice-drop-stale-posts.mjs || true
          node scripts/ice-filter-replies.mjs || true
          node scripts/ice-english-pretranslation-dedupe.mjs
          node scripts/ice-precollect-published-dedupe.mjs
          node scripts/ice-fast-intake.mjs
          node scripts/ice-dedupe-v3.mjs || true

      - name: AI edit and translate
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true' && steps.category.outputs.enabled == 'true' && steps.category.outputs.ai_rewrite == 'true'
        shell: bash
        run: |
          set -e
          node scripts/ice-ai-process-only.mjs
          node scripts/ice-editorial-normalize.mjs
          node scripts/ice-translate-title-body.mjs

      - name: Publish
        # 发布器自身会再次核验：仅官方来源或真实管理员已批准的内容可以发布。
        # 不再让栏目级旧开关误伤官方来源自动发布。
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true' && steps.category.outputs.enabled == 'true'
        env:
          ICE_FORCE_FIRST_PUBLISH: "true"
          ICE_PUBLISH_MAX_PER_RUN: "12"
        shell: bash
        run: |
          set -e
          node scripts/ice-restore-human-approved.mjs || true
          node scripts/ice-cross-language-dedupe.mjs || true
          node scripts/ice-dedupe-v3.mjs || true
          node scripts/ice-clean-existing-review-duplicates.mjs || true
          node scripts/ice-trusted-source-promote.mjs
          node scripts/ice-publish-due.mjs

      - name: Write success heartbeat
        if: success() && steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true' && steps.category.outputs.enabled == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-pipeline"
          ICE_HEARTBEAT_STATUS: "success"
        run: node scripts/ice-pipeline-heartbeat.mjs || true

      - name: Write failure heartbeat
        if: failure() && steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-pipeline"
          ICE_HEARTBEAT_STATUS: "failure"
          ICE_HEARTBEAT_ERROR: "ICE唯一生产流水线失败"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
