name: ICE唯一生产流水线

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ice-unified-pipeline.yml"
      - "scripts/ice-*.mjs"
      - "scripts/category-pipeline-gate.mjs"
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: trrb-ice-production-singleton
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-http-header-size=65536"
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN || secrets.X_API_BEARER_TOKEN || secrets.TWITTER_BEARER_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  RUN_MODE: "process"
  ICE_PRIORITY_LOOKBACK_MINUTES: "720"
  ICE_EXTRA_LOOKBACK_MINUTES: "720"
  ICE_ADDED_SOURCE_LOOKBACK_HOURS: "12"
  ICE_ADDED_SOURCE_MAX_PAGES: "3"
  ICE_PRIORITY_MAX_PAGES: "6"
  ICE_PRIORITY_ROTATION_GROUPS: "4"
  ICE_ERO_ROTATION_GROUPS: "4"
  ICE_ERO_LOOKBACK_HOURS: "12"
  ICE_MAX_SOURCE_AGE_MINUTES: "720"
  ICE_RECENT_DUPLICATE_WINDOW_MINUTES: "720"
  ICE_PUBLISHED_DEDUPE_DAYS: "30"
  ICE_PUBLISHED_SIMILARITY_THRESHOLD: "0.92"
  ICE_REVIEW_DUPLICATE_THRESHOLD: "0.92"
  ICE_ENGLISH_DEDUPE_WINDOW_HOURS: "720"
  ICE_ENGLISH_DEDUPE_CANDIDATE_MINUTES: "750"
  ICE_ENGLISH_DEDUPE_MAX: "4000"
  ICE_ENGLISH_DEDUPE_THRESHOLD: "0.92"
  ICE_OFFICIAL_FILTER_MAX: "4000"
  ICE_PRECOLLECT_MAX: "1600"
  ICE_FAST_INTAKE_MAX: "1000"
  ICE_MAX_AI_POSTS_PER_RUN: "24"
  ICE_MAX_STORIES_PER_RUN: "18"
  ICE_NORMALIZE_MAX_STORIES: "24"
  ICE_TRANSLATE_MAX_STORIES: "24"
  ICE_CROSS_LANGUAGE_DEDUPE_MAX: "1000"
  ICE_AUTO_PUBLISH_SCORE: "80"
  ICE_AI_CONFIDENCE: "80"
  ICE_TRUSTED_AUTO_CONFIDENCE: "0"
  ICE_TRUSTED_MAX_AGE_MINUTES: "720"
  ICE_UNREVIEWED_EXPIRE_HOURS: "24"
  ICE_DEDUPE_HOURS: "720"
  ICE_PUBLISH_INTERVAL_MINUTES: "10"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.window.outputs.allowed }}
      enabled: ${{ steps.category.outputs.enabled }}
      auto_fetch: ${{ steps.category.outputs.auto_fetch }}
      ai_rewrite: ${{ steps.category.outputs.ai_rewrite }}
      auto_publish: ${{ steps.category.outputs.auto_publish }}
    steps:
      - name: Check New York production window
        id: window
        shell: bash
        run: |
          NY_HOUR=$(TZ=America/New_York date +%H)
          NY_TIME=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')
          if [[ "${{ github.event_name }}" == "schedule" ]] && (( 10#$NY_HOUR >= 2 && 10#$NY_HOUR < 8 )); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "纽约时间 $NY_TIME，处于02:00-08:00停采时段。"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "纽约时间 $NY_TIME，开始本轮采集。"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: "22"
      - name: Read ICE category switches
        id: category
        if: steps.window.outputs.allowed == 'true'
        run: node scripts/category-pipeline-gate.mjs ice
      - name: Write start heartbeat
        if: steps.window.outputs.allowed == 'true' && steps.category.outputs.enabled == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-collection-start"
          ICE_HEARTBEAT_STATUS: "running"
        run: node scripts/ice-pipeline-heartbeat.mjs || true

  collect-core:
    needs: gate
    if: needs.gate.outputs.allowed == 'true' && needs.gate.outputs.enabled == 'true' && needs.gate.outputs.auto_fetch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Collect core official sources
        run: |
          for attempt in 1 2 3; do
            node scripts/ice-priority-discovery.mjs && exit 0
            sleep $((attempt * 15))
          done
          exit 1

  collect-regional:
    needs: gate
    if: needs.gate.outputs.allowed == 'true' && needs.gate.outputs.enabled == 'true' && needs.gate.outputs.auto_fetch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Collect ERO regional sources
        run: |
          for attempt in 1 2 3; do
            node scripts/ice-ero-official-discovery.mjs && exit 0
            sleep $((attempt * 15))
          done
          exit 1

  collect-monitored:
    needs: gate
    if: needs.gate.outputs.allowed == 'true' && needs.gate.outputs.enabled == 'true' && needs.gate.outputs.auto_fetch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Collect monitored sources
        shell: bash
        run: |
          set +e
          ok=0
          node scripts/ice-extra-monitored-discovery.mjs && ok=1
          node scripts/ice-added-source-discovery.mjs && ok=1
          [[ "$ok" -eq 1 ]]

  process:
    needs: [gate, collect-core, collect-regional, collect-monitored]
    if: always() && needs.gate.outputs.allowed == 'true' && needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CORE_RESULT: ${{ needs.collect-core.result }}
      REGIONAL_RESULT: ${{ needs.collect-regional.result }}
      MONITORED_RESULT: ${{ needs.collect-monitored.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Require at least one collector
        shell: bash
        run: |
          echo "core=$CORE_RESULT regional=$REGIONAL_RESULT monitored=$MONITORED_RESULT"
          if [[ "$CORE_RESULT" != "success" && "$REGIONAL_RESULT" != "success" && "$MONITORED_RESULT" != "success" ]]; then
            exit 1
          fi
      - name: Filter, dedupe and intake
        if: needs.gate.outputs.auto_fetch == 'true'
        run: |
          set -e
          node scripts/ice-official-source-only.mjs
          node scripts/ice-drop-stale-posts.mjs || true
          node scripts/ice-filter-replies.mjs || true
          node scripts/ice-english-pretranslation-dedupe.mjs
          node scripts/ice-precollect-published-dedupe.mjs
          node scripts/ice-fast-intake.mjs
          node scripts/ice-dedupe-v3.mjs || true
      - name: AI edit and translate
        if: needs.gate.outputs.ai_rewrite == 'true'
        run: |
          set -e
          node scripts/ice-ai-process-only.mjs
          node scripts/ice-editorial-normalize.mjs
          node scripts/ice-translate-title-body.mjs
      - name: Publish
        if: needs.gate.outputs.auto_publish == 'true'
        env:
          ICE_FORCE_FIRST_PUBLISH: "true"
          ICE_PUBLISH_MAX_PER_RUN: "12"
        run: |
          set -e
          node scripts/ice-restore-human-approved.mjs || true
          node scripts/ice-cross-language-dedupe.mjs || true
          node scripts/ice-dedupe-v3.mjs || true
          node scripts/ice-clean-existing-review-duplicates.mjs || true
          node scripts/ice-trusted-source-promote.mjs
          node scripts/ice-publish-due.mjs
      - name: Write success heartbeat
        if: success()
        env:
          ICE_HEARTBEAT_STAGE: "parallel-pipeline"
          ICE_HEARTBEAT_STATUS: "success"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
      - name: Write failure heartbeat
        if: failure()
        env:
          ICE_HEARTBEAT_STAGE: "parallel-pipeline"
          ICE_HEARTBEAT_STATUS: "failure"
          ICE_HEARTBEAT_ERROR: "ICE唯一生产流水线失败"
        run: node scripts/ice-pipeline-heartbeat.mjs || true

  off-hours:
    needs: gate
    if: needs.gate.outputs.allowed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "ICE生产流水线处于纽约02:00-08:00停采窗口；08:07恢复，每30分钟运行一次。"
