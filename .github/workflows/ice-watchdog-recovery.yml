name: ICE心跳监控与自动恢复

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ice-watchdog-recovery.yml"
      - "scripts/ice-workflow-watchdog.mjs"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: trrb-ice-watchdog-recovery
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--max-http-header-size=65536"
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN || secrets.X_API_BEARER_TOKEN || secrets.TWITTER_BEARER_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUN_MODE: "process"
      ICE_WATCHDOG_MAX_AGE_MINUTES: "55"
      ICE_PRIORITY_LOOKBACK_MINUTES: "1440"
      ICE_EXTRA_LOOKBACK_MINUTES: "1440"
      ICE_ADDED_SOURCE_LOOKBACK_HOURS: "24"
      ICE_ADDED_SOURCE_MAX_PAGES: "3"
      ICE_PRIORITY_MAX_PAGES: "4"
      ICE_PRIORITY_ROTATION_GROUPS: "4"
      ICE_ERO_ROTATION_GROUPS: "4"
      ICE_ERO_LOOKBACK_HOURS: "24"
      ICE_MAX_SOURCE_AGE_MINUTES: "1440"
      ICE_RECENT_DUPLICATE_WINDOW_MINUTES: "1440"
      ICE_PUBLISHED_DEDUPE_DAYS: "30"
      ICE_PUBLISHED_SIMILARITY_THRESHOLD: "0.92"
      ICE_REVIEW_DUPLICATE_THRESHOLD: "0.92"
      ICE_ENGLISH_DEDUPE_WINDOW_HOURS: "720"
      ICE_ENGLISH_DEDUPE_CANDIDATE_MINUTES: "1440"
      ICE_ENGLISH_DEDUPE_MAX: "4000"
      ICE_ENGLISH_DEDUPE_THRESHOLD: "0.92"
      ICE_OFFICIAL_FILTER_MAX: "4000"
      ICE_PRECOLLECT_MAX: "1600"
      ICE_FAST_INTAKE_MAX: "1000"
      ICE_MAX_AI_POSTS_PER_RUN: "40"
      ICE_MAX_STORIES_PER_RUN: "30"
      ICE_NORMALIZE_MAX_STORIES: "40"
      ICE_TRANSLATE_MAX_STORIES: "40"
      ICE_CROSS_LANGUAGE_DEDUPE_MAX: "1000"
      ICE_AUTO_PUBLISH_SCORE: "80"
      ICE_AI_CONFIDENCE: "80"
      ICE_TRUSTED_AUTO_CONFIDENCE: "0"
      ICE_TRUSTED_MAX_AGE_MINUTES: "1440"
      ICE_UNREVIEWED_EXPIRE_HOURS: "24"
      ICE_DEDUPE_HOURS: "720"
      ICE_PUBLISH_INTERVAL_MINUTES: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Respect New York 02:00-08:00 pause
        id: window
        shell: bash
        run: |
          NY_HOUR=$(TZ=America/New_York date +%H)
          if [[ "${{ github.event_name }}" == "schedule" ]] && (( 10#$NY_HOUR >= 2 && 10#$NY_HOUR < 8 )); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "纽约时间02:00-08:00，监控不触发恢复。"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check ICE unified pipeline heartbeat
        if: steps.window.outputs.allowed == 'true'
        id: health
        run: node scripts/ice-workflow-watchdog.mjs

      - name: Record recovery start heartbeat
        if: steps.window.outputs.allowed == 'true' && steps.health.outputs.stale == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "watchdog-recovery"
          ICE_HEARTBEAT_STATUS: "running"
        run: node scripts/ice-pipeline-heartbeat.mjs || true

      - name: Recover collection when heartbeat is stale
        if: steps.window.outputs.allowed == 'true' && steps.health.outputs.stale == 'true'
        shell: bash
        run: |
          set +e
          ok=0
          for script in \
            scripts/ice-priority-discovery.mjs \
            scripts/ice-ero-official-discovery.mjs \
            scripts/ice-extra-monitored-discovery.mjs \
            scripts/ice-added-source-discovery.mjs
          do
            for attempt in 1 2 3; do
              node "$script" && { ok=1; break; }
              sleep $((attempt * 15))
            done
          done
          [[ "$ok" -eq 1 ]]

      - name: Filter, AI process and publish recovered content
        if: steps.window.outputs.allowed == 'true' && steps.health.outputs.stale == 'true'
        shell: bash
        run: |
          set -e
          node scripts/ice-official-source-only.mjs
          node scripts/ice-drop-stale-posts.mjs || true
          node scripts/ice-filter-replies.mjs || true
          node scripts/ice-english-pretranslation-dedupe.mjs
          node scripts/ice-precollect-published-dedupe.mjs
          node scripts/ice-fast-intake.mjs
          node scripts/ice-dedupe-v3.mjs || true
          node scripts/ice-ai-process-only.mjs
          node scripts/ice-editorial-normalize.mjs
          node scripts/ice-translate-title-body.mjs
          node scripts/ice-restore-human-approved.mjs || true
          node scripts/ice-cross-language-dedupe.mjs || true
          node scripts/ice-clean-existing-review-duplicates.mjs || true
          node scripts/ice-trusted-source-promote.mjs
          ICE_FORCE_FIRST_PUBLISH=true ICE_PUBLISH_MAX_PER_RUN=20 node scripts/ice-publish-due.mjs

      - name: Record recovery success heartbeat
        if: success() && steps.window.outputs.allowed == 'true' && steps.health.outputs.stale == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "watchdog-recovery"
          ICE_HEARTBEAT_STATUS: "success"
        run: node scripts/ice-pipeline-heartbeat.mjs || true

      - name: Record recovery failure heartbeat
        if: failure() && steps.window.outputs.allowed == 'true' && steps.health.outputs.stale == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "watchdog-recovery"
          ICE_HEARTBEAT_STATUS: "failure"
          ICE_HEARTBEAT_ERROR: "ICE watchdog automatic recovery failed"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
