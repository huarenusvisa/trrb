name: ICE失联看门狗

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trrb-ice-watchdog
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-http-header-size=65536"
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN || secrets.X_API_BEARER_TOKEN || secrets.TWITTER_BEARER_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  RUN_MODE: "process"
  ICE_RUN_DUE_MINUTES: "45"
  ICE_PRIORITY_LOOKBACK_MINUTES: "720"
  ICE_EXTRA_LOOKBACK_MINUTES: "720"
  ICE_ADDED_SOURCE_LOOKBACK_HOURS: "12"
  ICE_ADDED_SOURCE_MAX_PAGES: "1"
  ICE_PRIORITY_MAX_PAGES: "2"
  ICE_PRIORITY_ROTATION_GROUPS: "4"
  ICE_ERO_ROTATION_GROUPS: "4"
  ICE_ERO_LOOKBACK_HOURS: "12"
  ICE_MAX_SOURCE_AGE_MINUTES: "720"
  ICE_RECENT_DUPLICATE_WINDOW_MINUTES: "720"
  ICE_ENGLISH_DEDUPE_WINDOW_HOURS: "720"
  ICE_ENGLISH_DEDUPE_CANDIDATE_MINUTES: "750"
  ICE_ENGLISH_DEDUPE_MAX: "1000"
  ICE_OFFICIAL_FILTER_MAX: "1000"
  ICE_PRECOLLECT_MAX: "400"
  ICE_FAST_INTAKE_MAX: "250"
  ICE_MAX_AI_POSTS_PER_RUN: "4"
  ICE_MAX_STORIES_PER_RUN: "4"
  ICE_NORMALIZE_MAX_STORIES: "4"
  ICE_TRANSLATE_MAX_STORIES: "4"
  ICE_CROSS_LANGUAGE_DEDUPE_MAX: "250"
  ICE_AUTO_PUBLISH_SCORE: "80"
  ICE_AI_CONFIDENCE: "80"
  ICE_TRUSTED_AUTO_CONFIDENCE: "0"
  ICE_TRUSTED_MAX_AGE_MINUTES: "720"
  ICE_UNREVIEWED_EXPIRE_HOURS: "24"
  ICE_DEDUPE_HOURS: "720"

jobs:
  automation-gate:
    name: 读取ICE机器人硬开关
    runs-on: ubuntu-24.04
    outputs:
      global: ${{ steps.gate.outputs.global }}
      ice: ${{ steps.gate.outputs.ice }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/automation-gate.mjs

  watchdog:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.ice == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check New York window
        id: window
        shell: bash
        run: |
          H=$(TZ=America/New_York date +%H)
          if [[ "${{ github.event_name }}" == "schedule" ]] && (( 10#$H >= 2 && 10#$H < 8 )); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: "22"
      - name: Validate secrets
        if: steps.window.outputs.allowed == 'true'
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$X_BEARER_TOKEN"
          test -n "$OPENAI_API_KEY"
      - name: Check stale heartbeat
        id: due
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif ! node scripts/ice-run-due.mjs; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Force compact collection
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true'
        shell: bash
        run: |
          set +e
          ok=0
          for script in scripts/ice-priority-discovery.mjs scripts/ice-ero-official-discovery.mjs scripts/ice-extra-monitored-discovery.mjs scripts/ice-added-source-discovery.mjs; do
            timeout 75s node "$script" && ok=1
          done
          [[ "$ok" -eq 1 ]]
          timeout 75s node scripts/ice-official-source-only.mjs
          timeout 45s node scripts/ice-drop-stale-posts.mjs || true
          timeout 45s node scripts/ice-filter-replies.mjs || true
          timeout 75s node scripts/ice-english-pretranslation-dedupe.mjs
          timeout 75s node scripts/ice-precollect-published-dedupe.mjs
          timeout 75s node scripts/ice-fast-intake.mjs
      - name: Force compact process and publish
        if: steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true'
        env:
          ICE_FORCE_FIRST_PUBLISH: "true"
          ICE_PUBLISH_MAX_PER_RUN: "4"
        shell: bash
        run: |
          timeout 150s node scripts/ice-ai-process-only.mjs
          timeout 75s node scripts/ice-editorial-normalize.mjs
          timeout 75s node scripts/ice-translate-title-body.mjs
          timeout 45s node scripts/ice-cross-language-dedupe.mjs || true
          timeout 45s node scripts/ice-dedupe-v3.mjs || true
          timeout 60s node scripts/ice-trusted-source-promote.mjs
          timeout 60s node scripts/ice-publish-due.mjs
      - name: Write watchdog success
        if: success() && steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-pipeline"
          ICE_HEARTBEAT_STATUS: "success"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
      - name: Write watchdog failure
        if: failure() && steps.window.outputs.allowed == 'true' && steps.due.outputs.due == 'true'
        env:
          ICE_HEARTBEAT_STAGE: "parallel-pipeline"
          ICE_HEARTBEAT_STATUS: "failure"
          ICE_HEARTBEAT_ERROR: "ICE失联看门狗补跑失败"
        run: node scripts/ice-pipeline-heartbeat.mjs || true
