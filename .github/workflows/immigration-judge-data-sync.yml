name: Immigration Judge EOIR Data Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/import-eoir-judge-stats.py"
      - ".github/workflows/immigration-judge-data-sync.yml"
  schedule:
    - cron: "25 10 3 * *"

permissions:
  contents: write

concurrency:
  group: immigration-judge-eoir-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EOIR_PARQUET_PATH: /tmp/eoir-cases.parquet
      EOIR_JUDGE_SOURCE_NAME: EOIR FOIA case data processed by Deportation Data Project
      EOIR_JUDGE_SOURCE_URL: https://deportationdata.org/data/processed/eoir.html
      EOIR_JUDGE_SOURCE_DATE: "2026-07-01"
      ASYLUMTRACKER_MANIFEST_URL: https://asylumtracker.com/data/dataset-manifest.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data pipeline dependencies
        run: python -m pip install --disable-pip-version-check duckdb requests

      - name: Download July 2026 processed EOIR case snapshot
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$EOIR_PARQUET_PATH" \
            "https://media.githubusercontent.com/media/deportationdata/eoir/main/data/cases.parquet"
          test "$(stat -c%s "$EOIR_PARQUET_PATH")" -gt 50000000
          sha256sum "$EOIR_PARQUET_PATH"

      - name: Aggregate and import judge asylum statistics
        run: python scripts/import-eoir-judge-stats.py

      - name: Verify public judge API
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error \
            "https://trrb.net/.netlify/functions/immigration-judges?mode=stats" | tee /tmp/judge-stats.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/judge-stats.json'))
          judges=int(data.get('judges') or 0)
          courts=int(data.get('courts') or 0)
          decisions=int(data.get('decisions') or 0)
          print({'judges':judges,'courts':courts,'decisions':decisions})
          if judges < 800 or courts < 50 or decisions < 100000:
              raise SystemExit('public API verification failed')
          PY

      - name: Publish observable sync report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          mkdir -p reports
          curl --silent --show-error \
            "https://trrb.net/.netlify/functions/immigration-judges?mode=stats" \
            -o /tmp/judge-public-stats.json || printf '{}' > /tmp/judge-public-stats.json
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          try:
              stats=json.load(open('/tmp/judge-public-stats.json'))
          except Exception:
              stats={}
          report={
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': os.environ.get('JOB_STATUS','unknown'),
              'source_snapshot_date': os.environ.get('EOIR_JUDGE_SOURCE_DATE'),
              'source': os.environ.get('EOIR_JUDGE_SOURCE_URL'),
              'public_stats': {
                  'judges': stats.get('judges',0),
                  'courts': stats.get('courts',0),
                  'decisions': stats.get('decisions',0),
              },
          }
          with open('reports/immigration-judge-data-sync-latest.json','w') as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/immigration-judge-data-sync-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update immigration judge data sync report [skip ci]"
            git push
          fi
