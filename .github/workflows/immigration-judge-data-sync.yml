name: Immigration Judge EOIR Data Sync (Manual Backup Only)

on:
  workflow_dispatch:
  # 自动调度与 workflow_call 已停用；仅管理员手动运行。

permissions:
  contents: write

concurrency:
  group: immigration-judge-eoir-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EOIR_PARQUET_PATH: /tmp/eoir-cases.parquet
      EOIR_JUDGE_SOURCE_NAME: EOIR FOIA Case Data (July 2026; official authority, normalized derivative input)
      EOIR_JUDGE_SOURCE_URL: https://fileshare.eoir.justice.gov/EOIR%20Case%20Data.zip
      EOIR_JUDGE_SOURCE_DATE: "2026-07-01"
      EOIR_JUDGE_PROCESSOR_NAME: Deportation Data Project
      EOIR_JUDGE_PROCESSOR_URL: https://deportationdata.org/data/processed/eoir.html
      EOIR_JUDGE_SCOPE_START: "2020-01-01"
      EOIR_JUDGE_SCOPE_END: "2026-07-01"
      ASYLUMTRACKER_MANIFEST_URL: https://asylumtracker.com/data/dataset-manifest.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data pipeline dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check duckdb requests pypdf 2>&1 | tee -a /tmp/immigration-judge-sync.log

      - name: Record authoritative EOIR source availability
        shell: bash
        run: |
          set -o pipefail
          {
            echo "Authoritative source: $EOIR_JUDGE_SOURCE_URL"
            echo "Official snapshot period: $EOIR_JUDGE_SOURCE_DATE"
            curl --fail --location --retry 3 --retry-delay 3 --range 0-0 \
              --output /tmp/eoir-source-probe.bin \
              "$EOIR_JUDGE_SOURCE_URL" || true
            stat -c 'official_probe_bytes=%s' /tmp/eoir-source-probe.bin 2>/dev/null || true
          } 2>&1 | tee -a /tmp/immigration-judge-sync.log

      - name: Download normalized EOIR case snapshot
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Downloading normalized derivative of the official EOIR FOIA snapshot..."
            curl --fail --location --retry 5 --retry-delay 5 \
              --output "$EOIR_PARQUET_PATH" \
              "https://media.githubusercontent.com/media/deportationdata/eoir/main/data/cases.parquet"
            stat -c 'downloaded_bytes=%s' "$EOIR_PARQUET_PATH"
            test "$(stat -c%s "$EOIR_PARQUET_PATH")" -gt 50000000
            sha256sum "$EOIR_PARQUET_PATH"
          } 2>&1 | tee -a /tmp/immigration-judge-sync.log

      - name: Aggregate and import judge asylum statistics
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate-eoir-nationality-periods.py 2>&1 | tee -a /tmp/immigration-judge-sync.log
          python scripts/generate-eoir-state-and-judge-periods.py 2>&1 | tee -a /tmp/immigration-judge-sync.log
          python scripts/sync-eoir-judge-backgrounds.py 2>&1 | tee -a /tmp/immigration-judge-sync.log
          python scripts/sync-eoir-webex-links.py 2>&1 | tee -a /tmp/immigration-judge-sync.log
          python scripts/import-eoir-judge-stats-v2.py 2>&1 | tee -a /tmp/immigration-judge-sync.log

      - name: Verify public judge API
        shell: bash
        run: |
          set -euo pipefail
          {
            sleep 5
            curl --fail --silent --show-error \
              "https://trrb.net/.netlify/functions/immigration-judges?mode=stats" | tee /tmp/judge-stats.json
            python - <<'PY'
          import json
          data=json.load(open('/tmp/judge-stats.json'))
          judges=int(data.get('judges') or 0)
          courts=int(data.get('courts') or 0)
          decisions=int(data.get('decisions') or 0)
          latest=data.get('latest_import') or {}
          try:
              notes=json.loads(latest.get('notes') or '{}')
          except Exception as exc:
              raise SystemExit(f'latest import notes are not valid JSON: {exc}')
          preflight=notes.get('preflight') or {}
          expected={
              'judges': int(preflight.get('named_judges') or 0),
              'courts': int(preflight.get('current_courts') or 0),
              'decisions': int(preflight.get('merits_cases') or 0),
          }
          actual={'judges':judges,'courts':courts,'decisions':decisions}
          print({'actual':actual,'expected':expected,'batch_status':latest.get('status')})
          if latest.get('status') != 'imported' or min(expected.values()) <= 0 or actual != expected:
              raise SystemExit('public API does not exactly match the imported batch preflight')
          PY
          } 2>&1 | tee -a /tmp/immigration-judge-sync.log

      - name: Publish observable sync report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          mkdir -p reports
          curl --silent --show-error \
            "https://trrb.net/.netlify/functions/immigration-judges?mode=stats" \
            -o /tmp/judge-public-stats.json || printf '{}' > /tmp/judge-public-stats.json
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          try:
              stats=json.load(open('/tmp/judge-public-stats.json'))
          except Exception:
              stats={}
          try:
              diagnostics=open('/tmp/immigration-judge-sync.log',errors='replace').read().splitlines()[-160:]
          except Exception:
              diagnostics=[]
          report={
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': os.environ.get('JOB_STATUS','unknown'),
              'source_snapshot_date': os.environ.get('EOIR_JUDGE_SOURCE_DATE'),
              'scope_start': os.environ.get('EOIR_JUDGE_SCOPE_START'),
              'scope_end': os.environ.get('EOIR_JUDGE_SCOPE_END'),
              'authoritative_source': os.environ.get('EOIR_JUDGE_SOURCE_URL'),
              'normalization_layer': os.environ.get('EOIR_JUDGE_PROCESSOR_URL'),
              'public_stats': {
                  'judges': stats.get('judges',0),
                  'courts': stats.get('courts',0),
                  'decisions': stats.get('decisions',0),
              },
              'diagnostics_tail': diagnostics,
          }
          with open('reports/immigration-judge-data-sync-latest.json','w') as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/immigration-judge-data-sync-latest.json \
            data/immigration-judge-nationality-periods*.json \
            data/immigration-judge-state-periods.json \
            data/immigration-judge-nationality-yearly*.json \
            data/immigration-judge-backgrounds.json \
            data/eoir-webex-links.json
          if ! git diff --cached --quiet; then
            git commit -m "Update immigration judge data sync report [skip ci]"
            git push
          fi
