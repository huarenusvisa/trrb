name: Immigration Judge Homepage Hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/immigration-judge-homepage-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch judge card recognition and bust homepage cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('homepage-immigration-hub.js')
          s=p.read_text()
          old='''  function replaceJudgeCard(root) {\n    const card = root.querySelector("#china") || Array.from(root.querySelectorAll(".news-box")).find((item) => item.querySelector("h2")?.textContent.trim() === "中国官场");\n    if (!card || card.dataset.judgeHub === "true") return;\n    card.dataset.judgeHub = "true";\n    card.id = "judge-home-hub";\n    card.classList.add("immigration-knowledge-card", "legal-knowledge-card", "judge-knowledge-card");\n    card.innerHTML = judgeMarkup();\n  }'''
          new='''  function replaceJudgeCard(root) {\n    const card = root.querySelector("#judge-home-hub") || root.querySelector("#china") || Array.from(root.querySelectorAll(".news-box")).find((item) => ["中国官场", "移民法官通过率"].includes(item.querySelector("h2")?.textContent.trim()));\n    if (!card) return;\n    const alreadyRendered = card.dataset.judgeHub === "true" && Boolean(card.querySelector('.immigration-hub-grid'));\n    if (alreadyRendered) return;\n    card.dataset.judgeHub = "true";\n    card.id = "judge-home-hub";\n    card.classList.remove("category-empty");\n    card.classList.add("immigration-knowledge-card", "legal-knowledge-card", "judge-knowledge-card");\n    card.innerHTML = judgeMarkup();\n  }'''
          if old not in s:
              raise SystemExit('expected replaceJudgeCard block not found')
          p.write_text(s.replace(old,new))

          p=Path('index.html')
          s=p.read_text()
          old='./homepage-immigration-hub.js?v=20260819-seo-canonical-1'
          new='./homepage-immigration-hub.js?v=20260820-judge-data-live-1'
          if old not in s:
              raise SystemExit('homepage hub cache token not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit homepage judge fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homepage-immigration-hub.js index.html
          git commit -m "Homepage: render live immigration judge hub reliably"
          git push
