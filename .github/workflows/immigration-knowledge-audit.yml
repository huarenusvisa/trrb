name: 移民知识库审计补齐与统计

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 PUBLISH 才允许人工启动公开写入"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: trrb-immigration-knowledge-publisher
  cancel-in-progress: false

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  KNOWLEDGE_ARTICLES_PER_TOPIC: "10"
  KNOWLEDGE_HEALTH_WINDOW_HOURS: "30"
  KNOWLEDGE_SAFE_BATCH_SIZE: "2"

# 2026-08-05 继续执行：核对今日缺口，并将“移民美国”55个小类目分别补到10篇。
jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH' }}
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        category: [study, work, employment, family, humanitarian, change-status, citizenship]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 检查必要密钥
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: 小批次补齐 ${{ matrix.category }} 每个小类目至10篇
        run: node scripts/immigration-knowledge-repair-small.mjs "${{ matrix.category }}"

  final-audit:
    needs: repair
    if: ${{ always() && needs.repair.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 生成最终真实统计报告
        run: node scripts/immigration-knowledge-report.mjs
      - name: 提交最终统计报告
        shell: bash
        run: |
          git config user.name "TRRB Immigration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/immigration-knowledge-status.json
          if git diff --cached --quiet; then
            echo "统计结果没有变化"
            exit 0
          fi
          git commit -m "更新移民知识库55类统计报告"
          git pull --rebase origin main
          git push origin HEAD:main
