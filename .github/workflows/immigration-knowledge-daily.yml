name: 移民知识库每日自动生成

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/immigration-knowledge-daily.yml"
      - "scripts/immigration-knowledge-daily.mjs"
      - "scripts/immigration-knowledge-health.mjs"
      - "config/immigration-knowledge.js"
      - "immigrate/*knowledge-content.js"
      - "immigrate/change-status-module.js"
      - "immigrate/citizenship-module.js"
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: read

concurrency:
  group: trrb-immigration-knowledge-daily
  cancel-in-progress: false

jobs:
  time-gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        shell: bash
        run: |
          NY_HOUR=$(TZ=America/New_York date +%H)
          NY_TIME=$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push" || "$NY_HOUR" == "09" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "纽约时间 $NY_TIME，开始生成7个大栏目、55个小类目的每日内容。"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "纽约时间 $NY_TIME，不是上午9点，本次仅用于兼容夏令时，不执行。"
          fi

  generate:
    needs: time-gate
    if: needs.time-gate.outputs.allowed == 'true'
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        category:
          - study
          - work
          - employment
          - family
          - humanitarian
          - change-status
          - citizenship
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KNOWLEDGE_ARTICLES_PER_TOPIC: "10"
      KNOWLEDGE_HEALTH_WINDOW_HOURS: "30"
      KNOWLEDGE_BATCH_MAX_OUTPUT_TOKENS: "20000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 检查必要密钥
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "缺少OPENAI_API_KEY"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "缺少SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "缺少SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
      - name: 为 ${{ matrix.category }} 的每个小类目生成10篇
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "${{ matrix.category }} 第 $attempt/2 次执行"
            node scripts/immigration-knowledge-daily.mjs "${{ matrix.category }}" && exit 0
            sleep $((attempt * 30))
          done
          exit 1

  verify-and-repair:
    name: 核验55个小类目并自动补齐
    needs: [time-gate, generate]
    if: always() && needs.time-gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KNOWLEDGE_ARTICLES_PER_TOPIC: "10"
      KNOWLEDGE_HEALTH_WINDOW_HOURS: "30"
      KNOWLEDGE_BATCH_MAX_OUTPUT_TOKENS: "20000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 检查必要密钥
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "缺少OPENAI_API_KEY"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "缺少SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "缺少SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
      - name: 核验最近30小时每个小类目并补齐不足
        run: node scripts/immigration-knowledge-health.mjs
