name: Immigration Knowledge Route Consistency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/immigration-knowledge.js'
      - 'netlify/edge-functions/_shared/immigration-knowledge-routes.ts'
      - 'netlify/edge-functions/00-immigration-center-canonical.ts'
      - 'netlify/edge-functions/seo-route-meta.ts'
      - 'scripts/validate-immigration-knowledge-routes.mjs'
      - '.github/workflows/immigration-knowledge-route-consistency.yml'

permissions:
  contents: read

jobs:
  route-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate immigration knowledge canonical routes
        run: node scripts/validate-immigration-knowledge-routes.mjs
