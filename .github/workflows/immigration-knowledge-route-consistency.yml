name: Immigration Knowledge Route Consistency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate immigration knowledge canonical routes
        run: node scripts/validate-immigration-knowledge-routes.mjs
