name: Bing IndexNow自动推送

on:
  workflow_call:
    inputs:
      full_sync:
        required: false
        type: string
        default: 'false'
      include_retired:
        required: false
        type: string
        default: 'false'
      fresh_hours:
        required: false
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: trrb-indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INDEXNOW_USE_LIVE_NEWS: 'true'
      INDEXNOW_FRESH_HOURS: ${{ inputs.fresh_hours || '3' }}
      INDEXNOW_INCLUDE_HOME: 'false'
      INDEXNOW_FULL_SYNC: ${{ inputs.full_sync || 'false' }}
      INDEXNOW_INCLUDE_RETIRED: ${{ inputs.include_retired || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 全站同步时才生成本地站点地图
        if: ${{ inputs.full_sync == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/generate-sitemaps.mjs
          node scripts/clean-sitemap-against-database.mjs
          node scripts/filter-public-visibility-seo-feeds.mjs
          node scripts/split-sitemap-index.mjs
      - name: 提交IndexNow
        run: node scripts/submit-indexnow.mjs
