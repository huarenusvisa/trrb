name: Bing IndexNow自动推送

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "sitemap.xml"
      - "news-sitemap.xml"
      - "feed.xml"
      - "sitemap-index.xml"
      - "sitemaps/**"
      - "retired-indexnow-urls.txt"
      - "scripts/generate-sitemaps.mjs"
      - "scripts/clean-sitemap-against-database.mjs"
      - "scripts/filter-public-visibility-seo-feeds.mjs"
      - "scripts/split-sitemap-index.mjs"
      - "scripts/submit-indexnow.mjs"
      - "netlify/edge-functions/legacy-url-redirect.ts"
      - "9d4f7b8c6a2e41d39b7c5e8f1a6d3c20.txt"
      - ".github/workflows/indexnow.yml"

permissions:
  contents: read

concurrency:
  group: trrb-indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Retired URLs are event-driven changes, not recurring freshness signals.
      # Scheduled 15-minute runs keep the queue disabled to avoid crawl-quota waste.
      INDEXNOW_INCLUDE_RETIRED: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 生成最新站点地图并过滤非公开文章
        run: |
          node scripts/generate-sitemaps.mjs
          node scripts/clean-sitemap-against-database.mjs
          node scripts/filter-public-visibility-seo-feeds.mjs
          node scripts/split-sitemap-index.mjs
      - name: 提交IndexNow
        run: node scripts/submit-indexnow.mjs
