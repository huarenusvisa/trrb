name: Bing IndexNow自动推送

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: 是否执行一次全站URL同步
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
      include_retired:
        description: 是否同时通知明确退役的URL
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
  workflow_call:
    inputs:
      full_sync:
        required: false
        type: string
        default: 'false'
      include_retired:
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

concurrency:
  group: trrb-indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Regular runs submit only fresh news. Full-site and retired URL pushes are
      # explicit so unchanged archives do not consume Bing crawl quota hourly.
      INDEXNOW_FULL_SYNC: ${{ inputs.full_sync || 'false' }}
      INDEXNOW_INCLUDE_RETIRED: ${{ inputs.include_retired || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 生成最新站点地图并过滤非公开文章
        run: |
          node scripts/generate-sitemaps.mjs
          node scripts/clean-sitemap-against-database.mjs
          node scripts/filter-public-visibility-seo-feeds.mjs
          node scripts/split-sitemap-index.mjs
      - name: 提交IndexNow
        run: node scripts/submit-indexnow.mjs
