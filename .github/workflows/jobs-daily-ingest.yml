name: JOBS Daily Ingest

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - scripts/jobs-daily-ingest.mjs
      - .github/workflows/jobs-daily-ingest.yml
  workflow_dispatch:
    inputs:
      target:
        description: "本批抓取候选数量（50-500）"
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: jobs-daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOBS_TARGET_CANDIDATES: ${{ inputs.target || '200' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Verify jobs ingestion syntax
        run: node --check scripts/jobs-daily-ingest.mjs
      - name: Collect, validate and publish eligible jobs
        shell: bash
        run: |
          set -o pipefail
          node scripts/jobs-daily-ingest.mjs 2>&1 | tee jobs-daily-ingest-report.txt
      - name: Upload ingestion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-daily-ingest-report-${{ github.run_id }}
          path: jobs-daily-ingest-report.txt
          if-no-files-found: warn
