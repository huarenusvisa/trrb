name: JOBS Daily Ingest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/jobs-daily-ingest.mjs'
      - 'scripts/jobs-daily-ingest.test.mjs'
      - '.github/workflows/jobs-daily-ingest.yml'
  workflow_call:
    inputs:
      target:
        description: Maximum Chinese-source candidates to inspect
        required: false
        type: number
        default: 500

permissions:
  contents: read

concurrency:
  group: jobs-daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOBS_TARGET_CANDIDATES: ${{ inputs.target || 500 }}
      JOBS_MIN_NEW_PUBLISHED: 50
      JOBS_EXPANDED_CHINESE_TARGET: 1000
      JOBS_STORE_BATCH_SIZE: 150
      JOBS_STORE_CONCURRENCY: 8
      JOBS_REST_RETRY_ATTEMPTS: 3
      JOBS_MAX_WRITE_ERROR_RATE: 0.35
      JOBS_MIN_WRITE_ERROR_THRESHOLD: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Read existing automation switches
        id: gate
        run: node scripts/automation-gate.mjs
      - name: Verify and test jobs ingestion
        run: |
          node --check scripts/jobs-daily-ingest.mjs
          node --test scripts/jobs-daily-ingest.test.mjs
      - name: Collect, validate and publish eligible jobs
        if: ${{ steps.gate.outputs.global == 'true' && steps.gate.outputs.jobs == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/jobs-daily-ingest.mjs 2>&1 | tee jobs-daily-ingest-report.txt
      - name: Upload ingestion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-daily-ingest-report-${{ github.run_id }}
          path: jobs-daily-ingest-report.txt
          if-no-files-found: warn
