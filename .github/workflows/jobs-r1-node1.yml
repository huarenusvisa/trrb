name: JOBS-R1 Node 1

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260817001000_jobs_r1_node1_foundation.sql'
      - 'scripts/audit-jobs-r1-node1.mjs'
      - 'docs/JOBS-01-US-RECRUITING-AND-JOB-SEEKING.md'
      - '.github/workflows/jobs-r1-node1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit JOBS-R1 N1 data and identity foundation
        run: node scripts/audit-jobs-r1-node1.mjs
