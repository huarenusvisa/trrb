name: JOBS-R1 Node 10
on:
  workflow_dispatch:

jobs:
  full-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JOBS-R1 full 10-node acceptance
        run: node scripts/audit-jobs-r1-node10.mjs
