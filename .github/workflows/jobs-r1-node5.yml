name: JOBS-R1 Node 5

on:
  workflow_dispatch:

jobs:
  audit-node5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Strict JOBS-R1-N5 acceptance audit
        run: node scripts/audit-jobs-r1-node5.mjs
