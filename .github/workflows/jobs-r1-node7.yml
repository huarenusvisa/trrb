name: JOBS-R1 Node 7
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Strict JOBS-R1 N7 audit
        run: node scripts/audit-jobs-r1-node7.mjs
