name: JOBS-R1 Node 8
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260817008000_jobs_r1_node8_reviews_reports.sql'
      - 'jobs/review.html'
      - 'jobs/review.js'
      - 'admin/jobs-manager.js'
      - 'scripts/audit-jobs-r1-node8.mjs'
      - '.github/workflows/jobs-r1-node8.yml'
      - 'docs/JOBS-01-US-RECRUITING-AND-JOB-SEEKING.md'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Strict JOBS-R1 N8 audit
        run: node scripts/audit-jobs-r1-node8.mjs
