name: JOBS-R2 Node 10
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Syntax check primary JOBS-R2 runtime
        run: |
          node --check jobs/search.js
          node --check jobs/search-r2-discovery.js
          node --check jobs/search-r2-geo.js
          node --check jobs/search-r2-mobile.js
          node --check admin/jobs-manager.js
          node --check admin/jobs-location-governance.js
      - name: Revalidate JOBS-R2 N1-N9 and global regression
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-jobs-r2-node10.mjs 2>&1 | tee jobs-r2-node10-report.txt
      - name: Upload N10 validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-r2-node10-report
          path: jobs-r2-node10-report.txt
          if-no-files-found: warn
