name: JOBS-R2 Node 10
on:
  push:
    branches: [main]
    paths:
      - 'jobs/**'
      - 'admin/jobs-manager.js'
      - 'admin/jobs-location-governance.js'
      - 'supabase/migrations/20260817011000_jobs_r2_node1_search_location.sql'
      - 'supabase/migrations/20260817017000_jobs_r2_node7_mobile_saves.sql'
      - 'supabase/migrations/20260817019000_jobs_r2_node9_admin_location_governance.sql'
      - 'scripts/audit-jobs-r2-node*.mjs'
      - 'docs/JOBS-R2-LOCATION-AWARE-JOB-DISCOVERY-UX.md'
      - '.github/workflows/jobs-r2-node10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Syntax check primary JOBS-R2 runtime
        run: |
          node --check jobs/search.js
          node --check jobs/search-r2-discovery.js
          node --check jobs/search-r2-geo.js
          node --check jobs/search-r2-mobile.js
          node --check admin/jobs-manager.js
          node --check admin/jobs-location-governance.js
      - name: Revalidate JOBS-R2 N1-N9 and global regression
        run: node scripts/audit-jobs-r2-node10.mjs
