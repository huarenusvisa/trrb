name: JOBS-R2 Node 2

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260817012000_jobs_r2_node2_pc_header.sql'
      - 'jobs/search.html'
      - 'jobs/search.js'
      - 'scripts/audit-jobs-r2-node2.mjs'
      - 'docs/JOBS-R2-LOCATION-AWARE-JOB-DISCOVERY-UX.md'
      - '.github/workflows/jobs-r2-node2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit JOBS-R2 N2 compact PC search header
        run: node scripts/audit-jobs-r2-node2.mjs
