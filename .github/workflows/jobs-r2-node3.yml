name: JOBS-R2 Node 3

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260817013000_jobs_r2_node3_bidirectional_counts.sql'
      - 'jobs/search.html'
      - 'jobs/search-r2-discovery.js'
      - 'scripts/audit-jobs-r2-node3.mjs'
      - 'docs/JOBS-R2-LOCATION-AWARE-JOB-DISCOVERY-UX.md'
      - '.github/workflows/jobs-r2-node3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit JOBS-R2 N3 bidirectional discovery
        run: node scripts/audit-jobs-r2-node3.mjs
