name: JOBS-R2 Node 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit JOBS-R2 N3 bidirectional discovery
        run: node scripts/audit-jobs-r2-node3.mjs
