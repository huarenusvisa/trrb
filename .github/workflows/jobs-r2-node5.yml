name: JOBS-R2 Node 5

on:
  push:
    branches: [main]
    paths:
      - 'jobs/search.html'
      - 'jobs/search.js'
      - 'jobs/search-r2-geo.js'
      - 'supabase/migrations/20260817014000_jobs_r2_node4_human_geo_areas.sql'
      - 'scripts/audit-jobs-r2-node5.mjs'
      - 'docs/JOBS-R2-LOCATION-AWARE-JOB-DISCOVERY-UX.md'
      - '.github/workflows/jobs-r2-node5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit JOBS-R2 N5 distance-aware discovery
        run: node scripts/audit-jobs-r2-node5.mjs
