name: JOBS-R2 Node 6
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit JOBS-R2 N6 compact PC list
        run: node scripts/audit-jobs-r2-node6.mjs
