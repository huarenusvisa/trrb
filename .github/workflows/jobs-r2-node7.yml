name: JOBS-R2 Node 7
on:
  push:
    branches: [main]
    paths:
      - 'jobs/search-r2-mobile.js'
      - 'jobs/search-r2-discovery.js'
      - 'jobs/search-r2-geo.js'
      - 'jobs/search.js'
      - 'supabase/migrations/20260817017000_jobs_r2_node7_mobile_saves.sql'
      - 'scripts/audit-jobs-r2-node7.mjs'
      - 'docs/JOBS-R2-LOCATION-AWARE-JOB-DISCOVERY-UX.md'
      - '.github/workflows/jobs-r2-node7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Audit JOBS-R2 N7 mobile feed
        run: node scripts/audit-jobs-r2-node7.mjs
