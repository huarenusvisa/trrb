name: 旧WordPress分类分页退役生产验收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'netlify/edge-functions/legacy-url-redirect.ts'
      - '.github/workflows/legacy-category-retirement-production.yml'

permissions:
  contents: read

concurrency:
  group: trrb-legacy-category-retirement-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 校验源码覆盖旧数字分页
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '(?:/(?:page/)?\\d+)?' netlify/edge-functions/legacy-url-redirect.ts
          grep -q 'wordpress-system-page' netlify/edge-functions/legacy-url-redirect.ts

      - name: 等待生产并验证旧分类410
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            stamp="${GITHUB_RUN_ID}-${attempt}"
            a=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/category/https-www-trrb-cc/0/?legacy-category=$stamp" | tr -d '\r' || true)
            b=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/category/https-www-trrb-cc-cat8/0/?legacy-category=$stamp" | tr -d '\r' || true)
            a410=$(printf '%s' "$a" | grep -c '^HTTP/.* 410' || true)
            b410=$(printf '%s' "$b" | grep -c '^HTTP/.* 410' || true)
            anoindex=$(printf '%s' "$a" | grep -ci '^x-robots-tag:.*noindex' || true)
            bnoindex=$(printf '%s' "$b" | grep -ci '^x-robots-tag:.*noindex' || true)
            echo "attempt=$attempt categoryA=$a410/$anoindex categoryB=$b410/$bnoindex"
            if [ "$a410" -ge 1 ] && [ "$b410" -ge 1 ] && [ "$anoindex" -ge 1 ] && [ "$bnoindex" -ge 1 ]; then
              echo 'LEGACY_CATEGORY_NUMERIC_RETIREMENT_PASS=true'
              exit 0
            fi
            sleep 10
          done
          echo 'Legacy numeric category archives did not retire in production.'
          exit 1
