name: 历史文章搜索资产恢复

on:
  push:
    branches: [main]
    paths:
      - 'scripts/restore-legacy-archive.mjs'
      - 'scripts/submit-indexnow.mjs'
      - '.github/workflows/legacy-search-recovery.yml'
  workflow_call:
    inputs:
      limit:
        required: false
        type: number
        default: 1000
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: 输入 APPLY 才允许写入正式库
        required: true
        type: string
      limit:
        description: 每批最多恢复多少篇
        required: false
        default: '1000'

permissions:
  contents: read

concurrency:
  group: trrb-legacy-search-recovery
  cancel-in-progress: false

jobs:
  restore:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.confirm_apply == 'APPLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEGACY_PRIORITY_IDS: wp-117123
      LEGACY_RESTORE_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查恢复权限
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo 'SUPABASE_SERVICE_ROLE_KEY missing'; exit 2; }

      - name: 批量恢复旧站可验证正文
        id: restore
        shell: bash
        env:
          INPUT_LIMIT: ${{ inputs.limit || github.event.inputs.limit || '1000' }}
        run: |
          set -euo pipefail
          limit="${INPUT_LIMIT:-1000}"
          case "$limit" in
            ''|*[!0-9]*) limit=1000 ;;
          esac
          if [ "$limit" -lt 1 ]; then limit=1; fi
          if [ "$limit" -gt 2000 ]; then limit=2000; fi
          node scripts/restore-legacy-archive.mjs --apply --limit="$limit" --concurrency="${LEGACY_RESTORE_CONCURRENCY}"

      - name: 将本批新增和旧URL变更推送到IndexNow
        if: ${{ steps.restore.outputs.restored_count != '0' }}
        env:
          INDEXNOW_CHANGED_URLS_FILE: reports/legacy-indexnow-urls.txt
          INDEXNOW_INCLUDE_RETIRED: 'false'
          INDEXNOW_FULL_SYNC: 'false'
        run: |
          node scripts/generate-sitemaps.mjs
          node scripts/clean-sitemap-against-database.mjs
          node scripts/filter-public-visibility-seo-feeds.mjs
          node scripts/split-sitemap-index.mjs
          node scripts/submit-indexnow.mjs

      - name: 显示迁移结果
        if: always()
        shell: bash
        run: |
          test -f reports/legacy-migration-latest.json && cat reports/legacy-migration-latest.json || true

      - name: 验收旧搜索点击链
        if: always()
        shell: bash
        run: node scripts/legacy-search-acceptance.mjs

      - name: 保存迁移与验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-search-recovery-report-${{ github.run_id }}
          path: |
            reports/legacy-migration-latest.json
            reports/legacy-indexnow-urls.txt
            reports/legacy-search-acceptance-latest.json
          if-no-files-found: warn
          retention-days: 30
