name: 线上SEO与404真实抓取

on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * *"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "_redirects"
      - "robots.txt"
      - "netlify.toml"
      - "netlify/edge-functions/**"
      - ".github/workflows/live-seo-crawl.yml"

permissions:
  contents: read

concurrency:
  group: trrb-live-seo-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 等待Netlify部署
        run: sleep 240
      - name: 抓取线上页面并检查404和SEO
        env:
          SITE_ORIGIN: https://trrb.net
          CRAWL_LIMIT: "500"
          CRAWL_CONCURRENCY: "10"
          CRAWL_TIMEOUT_MS: "15000"
        run: node scripts/live-seo-crawl.mjs
      - name: 保存检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-crawl-report
          path: live-seo-crawl-report.json
          retention-days: 30
