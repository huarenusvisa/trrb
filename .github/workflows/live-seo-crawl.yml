name: 线上SEO与404真实抓取

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: trrb-live-seo-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 等待当前提交或其后代部署到生产
        shell: bash
        run: |
          set -euo pipefail
          target="${GITHUB_SHA}"
          for attempt in $(seq 1 90); do
            live="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/deploy-version.txt?run=${GITHUB_RUN_ID}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n[:space:]' || true)"
            if [ "$live" = "$target" ]; then
              echo "Production is running exact target $target"
              exit 0
            fi
            if [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
              git fetch --no-tags --depth=100 origin "$live" >/dev/null 2>&1 || true
              if git merge-base --is-ancestor "$target" "$live" 2>/dev/null; then
                echo "Production is running descendant $live containing target $target"
                exit 0
              fi
            fi
            echo "Waiting for production: expected target-or-descendant=$target live=${live:-unavailable} attempt=$attempt/90"
            sleep 10
          done
          echo "Production did not reach target $target or a descendant within 15 minutes." >&2
          exit 1
      - name: 抓取线上页面并检查404、SEO和静态资源类型
        env:
          SITE_ORIGIN: https://trrb.net
          CRAWL_LIMIT: "500"
          CRAWL_CONCURRENCY: "6"
          CRAWL_TIMEOUT_MS: "25000"
        run: node scripts/live-seo-crawl.mjs
      - name: 验证Trump文章手机端CSS回归问题
        run: node scripts/verify-round10-mobile-article.mjs
      - name: 验证第十一轮首页性能预算
        env:
          SITE_ORIGIN: https://trrb.net
          CRAWL_TIMEOUT_MS: "15000"
        run: node scripts/verify-round11-home-performance.mjs
      - name: 验证失效pretty文章URL自动救援
        env:
          SITE_ORIGIN: https://trrb.net
        run: node scripts/verify-round11-stale-article-route.mjs
      - name: 第十一轮十节点最终生产验收
        env:
          SITE_ORIGIN: https://trrb.net
          CRAWL_TIMEOUT_MS: "15000"
        run: node scripts/round11-final-production-audit.mjs
      - name: 第十二轮文章链路与全量索引生产审计
        env:
          SITE_ORIGIN: https://trrb.net
        run: node scripts/round12-production-audit.mjs
      - name: 保存检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-crawl-report
          path: |
            live-seo-crawl-report.json
            round11-final-production-audit.json
            round12-production-audit.json
          retention-days: 30
