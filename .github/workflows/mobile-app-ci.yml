name: Mobile App CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'netlify/functions/community-api.js'
      - 'netlify/functions/community-api.test.js'
      - 'netlify/functions/admin-push.js'
      - 'netlify/functions/push-receipts.mjs'
      - 'netlify/functions/push-receipts-core.js'
      - 'netlify/functions/push-receipts-core.test.js'
      - 'netlify/functions/_shared/expo-push-client.js'
      - 'netlify/functions/_shared/expo-push-client.test.js'
      - 'assets/brand/tangren-avatar-512.png'
      - 'scripts/audit-app-batch2-node7.mjs'
      - 'scripts/validate-mobile-store-config.mjs'
      - 'supabase/migrations/20260816220100_app_batch2_push_tokens.sql'
      - 'supabase/migrations/20260817031500_app_batch2_push_governance.sql'
      - 'supabase/migrations/20260903110000_push_receipt_lifecycle.sql'
      - '.github/workflows/mobile-app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'netlify/functions/community-api.js'
      - 'netlify/functions/community-api.test.js'
      - 'netlify/functions/public-article.js'
      - 'netlify/functions/public-articles.js'
      - 'netlify/functions/admin-push.js'
      - 'netlify/functions/push-receipts.mjs'
      - 'netlify/functions/push-receipts-core.js'
      - 'netlify/functions/push-receipts-core.test.js'
      - 'netlify/functions/_shared/expo-push-client.js'
      - 'netlify/functions/_shared/expo-push-client.test.js'
      - 'assets/brand/tangren-avatar-512.png'
      - 'scripts/audit-app-batch2-node7.mjs'
      - 'scripts/validate-mobile-store-config.mjs'
      - 'supabase/migrations/20260816220100_app_batch2_push_tokens.sql'
      - 'supabase/migrations/20260817031500_app_batch2_push_governance.sql'
      - 'supabase/migrations/20260903110000_push_receipt_lifecycle.sql'
      - '.github/workflows/mobile-app-ci.yml'
  workflow_dispatch:

concurrency:
  group: trrb-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    # Draft PRs can receive many automated commits; defer the expensive mobile
    # suite until the PR is ready for review. Main pushes and manual runs still run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Check mobile API syntax
        run: |
          node --check netlify/functions/public-article.js
          node --check netlify/functions/public-articles.js
          node --check netlify/functions/admin-push.js
          node --check netlify/functions/push-receipts.mjs
          node --test netlify/functions/push-receipts-core.test.js
          node --test netlify/functions/_shared/expo-push-client.test.js
          node --test netlify/functions/unified-account-login.test.js
          node --test netlify/functions/community-api.test.js
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Test unified mobile account client
        working-directory: apps/mobile
        run: npm run test:auth
      - name: Test mobile community API client
        working-directory: apps/mobile
        run: npm run test:community
      - name: Test mobile library cloud merge
        working-directory: apps/mobile
        run: npm run test:library
      - name: Test profile, notifications and reading settings
        working-directory: apps/mobile
        run: npm run test:data-settings
      - name: Test mobile push routing and permission lifecycle
        working-directory: apps/mobile
        run: npm run test:push
      - name: Test mobile interface languages
        working-directory: apps/mobile
        run: npm run test:i18n
      - name: Audit push security and lifecycle contract
        run: node scripts/audit-app-batch2-node7.mjs
      - name: Validate store build configuration
        working-directory: apps/mobile
        run: npm run config:check
      - name: Export Expo web bundle
        working-directory: apps/mobile
        run: npm run export:web
