name: Mobile App CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'netlify/functions/community-api.js'
      - 'netlify/functions/community-api.test.js'
      - 'assets/brand/tangren-avatar-512.png'
      - 'scripts/validate-mobile-store-config.mjs'
      - '.github/workflows/mobile-app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'netlify/functions/community-api.js'
      - 'netlify/functions/community-api.test.js'
      - 'netlify/functions/public-article.js'
      - 'netlify/functions/public-articles.js'
      - 'assets/brand/tangren-avatar-512.png'
      - 'scripts/validate-mobile-store-config.mjs'
      - '.github/workflows/mobile-app-ci.yml'
  workflow_dispatch:

concurrency:
  group: trrb-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Check mobile API syntax
        run: |
          node --check netlify/functions/public-article.js
          node --check netlify/functions/public-articles.js
          node --test netlify/functions/unified-account-login.test.js
          node --test netlify/functions/community-api.test.js
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Test unified mobile account client
        working-directory: apps/mobile
        run: npm run test:auth
      - name: Test mobile community API client
        working-directory: apps/mobile
        run: npm run test:community
      - name: Test mobile library cloud merge
        working-directory: apps/mobile
        run: npm run test:library
      - name: Validate store build configuration
        working-directory: apps/mobile
        run: npm run config:check
      - name: Export Expo web bundle
        working-directory: apps/mobile
        run: npm run export:web
