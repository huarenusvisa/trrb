name: Netlify部署凭证状态诊断

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-deploy-secret-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: trrb-netlify-secret-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 仅记录凭证是否存在
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          auth=false
          site=false
          hook=false
          [ -n "${NETLIFY_AUTH_TOKEN:-}" ] && auth=true
          [ -n "${NETLIFY_SITE_ID:-}" ] && site=true
          [ -n "${NETLIFY_BUILD_HOOK:-}" ] && hook=true
          cat > reports/netlify-deploy-secret-status.json <<EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "netlify_auth_token_configured": $auth,
            "netlify_site_id_configured": $site,
            "netlify_build_hook_configured": $hook,
            "preferred_mode": "$([ "$auth" = true ] && [ "$site" = true ] && echo cli || ([ "$hook" = true ] && echo build_hook || echo unavailable))"
          }
          EOF
          cat reports/netlify-deploy-secret-status.json

      - name: 保存无敏感信息诊断结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TRRB Deploy Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/netlify-deploy-secret-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Netlify deploy credential status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
