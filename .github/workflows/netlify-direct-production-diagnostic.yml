name: Netlify Direct Production Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-direct-production-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: trrb-netlify-direct-production-diagnostic
  cancel-in-progress: true

jobs:
  diagnose-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: b30280d2-b4f8-4a19-9135-862dd9c7171f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Diagnose direct Netlify path
        shell: bash
        run: |
          set -u
          mkdir -p reports
          token_present=false
          api_http=0
          status_exit=99
          build_exit=99
          deploy_exit=99
          [ -n "${NETLIFY_AUTH_TOKEN:-}" ] && token_present=true

          if [ "$token_present" = true ]; then
            api_http=$(curl -sS -o /tmp/site.json -w '%{http_code}' \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" || true)

            set +e
            npx --yes netlify-cli@latest status --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" >/tmp/netlify-status.log 2>&1
            status_exit=$?

            npx --yes netlify-cli@latest build --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" >/tmp/netlify-build.log 2>&1
            build_exit=$?

            if [ "$build_exit" -eq 0 ]; then
              npx --yes netlify-cli@latest deploy --prod --dir . --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" >/tmp/netlify-deploy.log 2>&1
              deploy_exit=$?
            fi
            set -e
          fi

          failure_stage='none'
          if [ "$token_present" != true ]; then failure_stage='token_missing';
          elif [ "$api_http" != 200 ]; then failure_stage='api_auth_or_site';
          elif [ "$status_exit" -ne 0 ]; then failure_stage='cli_status';
          elif [ "$build_exit" -ne 0 ]; then failure_stage='local_build';
          elif [ "$deploy_exit" -ne 0 ]; then failure_stage='production_upload';
          fi

          cat > reports/netlify-direct-production-diagnostic.json <<EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "target_sha": "${TARGET_SHA:-}",
            "token_present": $token_present,
            "site_lookup_http_status": $api_http,
            "cli_status_exit_code": $status_exit,
            "local_build_exit_code": $build_exit,
            "production_upload_exit_code": $deploy_exit,
            "failure_stage": "$failure_stage"
          }
          EOF
          cat reports/netlify-direct-production-diagnostic.json
      - name: Save diagnostic report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f reports/netlify-direct-production-diagnostic.json || exit 0
          git config user.name 'TRRB Netlify Diagnostic Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/netlify-direct-production-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update direct Netlify production diagnostic [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
