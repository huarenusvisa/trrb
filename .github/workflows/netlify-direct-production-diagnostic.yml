name: Netlify Direct Production Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-direct-production-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: b30280d2-b4f8-4a19-9135-862dd9c7171f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run exact production command
        shell: bash
        run: |
          set -u
          mkdir -p reports
          token_present=false
          api_http=0
          deploy_exit=99
          failure_kind='none'
          [ -n "${NETLIFY_AUTH_TOKEN:-}" ] && token_present=true
          if [ "$token_present" = true ]; then
            api_http=$(curl -sS -o /tmp/site.json -w '%{http_code}' -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" || true)
            if [ "$api_http" = 200 ]; then
              set +e
              npx --yes netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" >/tmp/netlify-exact-deploy.log 2>&1
              deploy_exit=$?
              set -e
              if [ "$deploy_exit" -ne 0 ]; then
                if grep -Eqi 'unknown option|unknown argument|unexpected argument' /tmp/netlify-exact-deploy.log; then failure_kind='cli_argument';
                elif grep -Eqi 'unauthorized|not authorized|invalid token|401|403' /tmp/netlify-exact-deploy.log; then failure_kind='authentication';
                elif grep -Eqi 'build command failed|failed during stage|build script returned non-zero|build failed' /tmp/netlify-exact-deploy.log; then failure_kind='build_command';
                elif grep -Eqi 'deploy.*failed|failed to deploy|upload.*failed' /tmp/netlify-exact-deploy.log; then failure_kind='production_upload';
                else failure_kind='unclassified_cli_failure'; fi
              fi
            else
              failure_kind='api_auth_or_site'
            fi
          else
            failure_kind='token_missing'
          fi
          cat > reports/netlify-direct-production-diagnostic.json <<EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "target_sha": "${TARGET_SHA:-}",
            "token_present": $token_present,
            "site_lookup_http_status": $api_http,
            "exact_deploy_exit_code": $deploy_exit,
            "failure_kind": "$failure_kind"
          }
          EOF
          cat reports/netlify-direct-production-diagnostic.json
      - name: Save diagnostic report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f reports/netlify-direct-production-diagnostic.json || exit 0
          git config user.name 'TRRB Netlify Diagnostic Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/netlify-direct-production-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update direct Netlify production diagnostic [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
