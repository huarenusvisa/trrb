name: Netlify Direct Production Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-direct-production-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: b30280d2-b4f8-4a19-9135-862dd9c7171f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run exact production command
        shell: bash
        run: |
          set -u
          mkdir -p reports
          token_present=false
          api_http=0
          deploy_exit=99
          failure_kind='none'
          [ -n "${NETLIFY_AUTH_TOKEN:-}" ] && token_present=true
          if [ "$token_present" = true ]; then
            api_http=$(curl -sS -o /tmp/site.json -w '%{http_code}' -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" || true)
            if [ "$api_http" = 200 ]; then
              set +e
              npx --yes netlify-cli@latest deploy --prod --context production --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" >/tmp/netlify-exact-deploy.log 2>&1
              deploy_exit=$?
              set -e
              if [ "$deploy_exit" -ne 0 ]; then
                if grep -Eqi 'unknown option|unknown argument|unexpected argument|Usage:' /tmp/netlify-exact-deploy.log; then failure_kind='cli_argument';
                elif grep -Eqi 'build command failed|failed during stage|build script returned non-zero|build failed|Command failed with exit code' /tmp/netlify-exact-deploy.log; then failure_kind='build_command';
                elif grep -Eqi 'not authorized to access this site|invalid access token|authentication failed|could not authenticate' /tmp/netlify-exact-deploy.log; then failure_kind='netlify_authentication';
                elif grep -Eqi 'deploy.*failed|failed to deploy|upload.*failed' /tmp/netlify-exact-deploy.log; then failure_kind='production_upload';
                elif grep -Eqi 'Cannot find module|ERR_MODULE_NOT_FOUND|MODULE_NOT_FOUND' /tmp/netlify-exact-deploy.log; then failure_kind='missing_module';
                elif grep -Eqi 'ENOENT|No such file or directory' /tmp/netlify-exact-deploy.log; then failure_kind='missing_file';
                elif grep -Eqi 'secret scan|secrets scan|secret scanning' /tmp/netlify-exact-deploy.log; then failure_kind='secret_scan';
                elif grep -Eqi 'SUPABASE|PostgREST|PGRST|database' /tmp/netlify-exact-deploy.log; then failure_kind='data_backend';
                elif grep -Eqi 'ENOTFOUND|ECONNREFUSED|ETIMEDOUT|network' /tmp/netlify-exact-deploy.log; then failure_kind='network';
                elif grep -Eqi 'validation failed|validator|SEO integrity|seo-integrity' /tmp/netlify-exact-deploy.log; then failure_kind='validation';
                else failure_kind='unclassified_cli_failure'; fi
              fi
            else
              failure_kind='api_auth_or_site'
            fi
          else
            failure_kind='token_missing'
          fi
          build_started=false
          functions_stage=false
          edge_stage=false
          if [ -f /tmp/netlify-exact-deploy.log ]; then
            grep -Eqi 'Netlify Build|build.command|Building site|build script' /tmp/netlify-exact-deploy.log && build_started=true || true
            grep -Eqi 'functions bundling|bundling functions|functions deployed' /tmp/netlify-exact-deploy.log && functions_stage=true || true
            grep -Eqi 'edge functions|edge-functions' /tmp/netlify-exact-deploy.log && edge_stage=true || true
          fi
          export TARGET_SHA token_present api_http deploy_exit failure_kind build_started functions_stage edge_stage
          node <<'NODE'
          const fs = require('fs');
          let raw = '';
          try { raw = fs.readFileSync('/tmp/netlify-exact-deploy.log', 'utf8'); } catch {}
          const token = process.env.NETLIFY_AUTH_TOKEN || '';
          if (token) raw = raw.split(token).join('<redacted>');
          raw = raw
            .replace(/https?:\/\/\S+/g, '<url>')
            .replace(/[A-Za-z0-9_+=\/-]{24,}/g, '<redacted>')
            .replace(/[A-Fa-f0-9]{24,}/g, '<redacted>');
          const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
          const selected = lines.filter(s => /(error|fail|warn|auth|login|site|project|team|deploy|build|flag|option|argument)/i.test(s)).slice(0, 12);
          const report = {
            generated_at: new Date().toISOString(),
            target_sha: process.env.TARGET_SHA || '',
            token_present: process.env.token_present === 'true',
            site_lookup_http_status: Number(process.env.api_http || 0),
            exact_deploy_exit_code: Number(process.env.deploy_exit || 99),
            failure_kind: process.env.failure_kind || '',
            build_started: process.env.build_started === 'true',
            functions_stage_seen: process.env.functions_stage === 'true',
            edge_stage_seen: process.env.edge_stage === 'true',
            sanitized_error_excerpt: selected.join(' | ').slice(0, 1200)
          };
          fs.writeFileSync('reports/netlify-direct-production-diagnostic.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Save diagnostic report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f reports/netlify-direct-production-diagnostic.json || exit 0
          git config user.name 'TRRB Netlify Diagnostic Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/netlify-direct-production-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update direct Netlify production diagnostic [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
