name: Netlify Homepage Deploy Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-hook-response-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: trrb-netlify-homepage-deploy-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
      NETLIFY_SITE_ID: b30280d2-b4f8-4a19-9135-862dd9c7171f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trigger Netlify and record recent deploys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          test -n "${NETLIFY_BUILD_HOOK:-}" || { echo 'NETLIFY_BUILD_HOOK missing'; exit 2; }
          sep='?'; case "$NETLIFY_BUILD_HOOK" in *\?*) sep='&' ;; esac
          hook_url="${NETLIFY_BUILD_HOOK}${sep}trigger_branch=main&clear_cache=true&trigger_title=TRRB+Homepage+Hard+Sweep+Probe"
          HOOK_HTTP=$(curl -sS -o /tmp/hook-body.txt -w '%{http_code}' -X POST "$hook_url")
          sleep 12
          DEPLOYS_HTTP=$(curl -sS -o /tmp/site-deploys.json -w '%{http_code}' --max-time 25 "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=15" || true)
          export HOOK_HTTP DEPLOYS_HTTP
          node <<'NODE'
          const fs=require('fs');
          let rows=[]; try{const j=JSON.parse(fs.readFileSync('/tmp/site-deploys.json','utf8'));if(Array.isArray(j))rows=j}catch{}
          const keys=['id','state','branch','context','commit_ref','title','created_at','updated_at','published_at','error_message','deploy_time','manual_deploy','deploy_source'];
          const recent=rows.slice(0,15).map(r=>Object.fromEntries(keys.filter(k=>r?.[k]===null||['string','number','boolean'].includes(typeof r?.[k])).map(k=>[k,r[k]])));
          const report={generated_at:new Date().toISOString(),hook_http_status:Number(process.env.HOOK_HTTP||0),deploys_http_status:Number(process.env.DEPLOYS_HTTP||0),recent_deploys:recent};
          fs.writeFileSync('reports/netlify-hook-response-metadata.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Commit probe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TRRB Netlify Metadata Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/netlify-hook-response-metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Netlify homepage deploy probe [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
