name: Netlify Hook返回元数据诊断

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-hook-response-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: trrb-netlify-hook-response-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 触发Hook并仅提取安全字段
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_BUILD_HOOK:-}" || { echo 'NETLIFY_BUILD_HOOK missing'; exit 2; }
          sep='?'
          case "$NETLIFY_BUILD_HOOK" in *\?*) sep='&' ;; esac
          hook_url="${NETLIFY_BUILD_HOOK}${sep}trigger_branch=main&clear_cache=true&trigger_title=TRRB+Hook+Metadata+Diagnostic"
          code=$(curl -sS -D /tmp/hook-headers.txt -o /tmp/hook-body.json -w '%{http_code}' -X POST "$hook_url")
          export HOOK_HTTP="$code"
          mkdir -p reports
          node <<'NODE'
          const fs = require('fs');
          let raw = '';
          try { raw = fs.readFileSync('/tmp/hook-body.json', 'utf8'); } catch {}
          let body = {};
          try { body = JSON.parse(raw || '{}'); } catch { body = {}; }
          const safeKeys = ['id','deploy_id','site_id','state','status','url','ssl_url','deploy_url','deploy_ssl_url','branch','title','message','name','created_at','updated_at'];
          const safe = {};
          for (const key of safeKeys) {
            const value = body?.[key];
            if (value === null || ['string','number','boolean'].includes(typeof value)) safe[key] = value;
          }
          const report = {
            generated_at: new Date().toISOString(),
            hook_http_status: Number(process.env.HOOK_HTTP || 0),
            response_is_json: raw.trim().startsWith('{') || raw.trim().startsWith('['),
            response_keys: body && typeof body === 'object' && !Array.isArray(body) ? Object.keys(body).filter(k => !/token|hook|secret|auth|password/i.test(k)).slice(0,50) : [],
            safe_metadata: safe
          };
          fs.writeFileSync('reports/netlify-hook-response-metadata.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: 尝试公开读取返回的Deploy ID状态
        shell: bash
        run: |
          set -euo pipefail
          deploy_id=$(node -e "const r=require('./reports/netlify-hook-response-metadata.json'); console.log(r.safe_metadata.deploy_id||r.safe_metadata.id||'')")
          if [ -z "$deploy_id" ]; then
            echo 'No deploy id in hook response'
            exit 0
          fi
          public_code=$(curl -sS -o /tmp/deploy-public.json -w '%{http_code}' --max-time 20 "https://api.netlify.com/api/v1/deploys/$deploy_id" || true)
          node - "$public_code" <<'NODE'
          const fs=require('fs');
          const code=Number(process.argv[2]||0);
          const file='reports/netlify-hook-response-metadata.json';
          const report=JSON.parse(fs.readFileSync(file,'utf8'));
          report.public_deploy_lookup_http_status=code;
          if (code >= 200 && code < 300) {
            let body={}; try { body=JSON.parse(fs.readFileSync('/tmp/deploy-public.json','utf8')); } catch {}
            const keys=['id','site_id','state','url','ssl_url','deploy_url','deploy_ssl_url','branch','title','message','name','created_at','updated_at','error_message'];
            report.public_deploy_metadata={};
            for(const k of keys){const v=body?.[k];if(v===null||['string','number','boolean'].includes(typeof v))report.public_deploy_metadata[k]=v;}
          }
          fs.writeFileSync(file,JSON.stringify(report,null,2)+'\n');
          NODE

      - name: 保存安全诊断结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TRRB Netlify Metadata Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/netlify-hook-response-metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Netlify hook response metadata [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
