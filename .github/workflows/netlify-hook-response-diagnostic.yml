name: Netlify Hook返回元数据诊断

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-hook-response-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: trrb-netlify-hook-response-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
      NETLIFY_SITE_ID: b30280d2-b4f8-4a19-9135-862dd9c7171f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 触发Hook并记录HTTP结果
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_BUILD_HOOK:-}" || { echo 'NETLIFY_BUILD_HOOK missing'; exit 2; }
          sep='?'
          case "$NETLIFY_BUILD_HOOK" in *\?*) sep='&' ;; esac
          hook_url="${NETLIFY_BUILD_HOOK}${sep}trigger_branch=main&clear_cache=true&trigger_title=TRRB+Homepage+Hard+Sweep"
          code=$(curl -sS -D /tmp/hook-headers.txt -o /tmp/hook-body.txt -w '%{http_code}' -X POST "$hook_url")
          echo "HOOK_HTTP=$code" >> "$GITHUB_ENV"
          sleep 8

      - name: 公开读取站点最近Deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          code=$(curl -sS -o /tmp/site-deploys.json -w '%{http_code}' --max-time 25 "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=12" || true)
          export DEPLOYS_HTTP="$code"
          node <<'NODE'
          const fs = require('fs');
          let raw=''; try { raw=fs.readFileSync('/tmp/site-deploys.json','utf8'); } catch {}
          let rows=[]; try { const j=JSON.parse(raw||'[]'); if(Array.isArray(j)) rows=j; } catch {}
          const safeKeys=['id','state','branch','context','commit_ref','title','created_at','updated_at','published_at','error_message','deploy_time','manual_deploy','deploy_source'];
          const recent=rows.slice(0,12).map(row=>{
            const out={};
            for(const key of safeKeys){ const v=row?.[key]; if(v===null||['string','number','boolean'].includes(typeof v)) out[key]=v; }
            return out;
          });
          const hookBody=(()=>{ try{return fs.readFileSync('/tmp/hook-body.txt','utf8').trim().slice(0,500)}catch{return ''} })();
          const report={
            generated_at:new Date().toISOString(),
            hook_http_status:Number(process.env.HOOK_HTTP||0),
            hook_response_preview:hookBody,
            deploys_http_status:Number(process.env.DEPLOYS_HTTP||0),
            recent_deploys:recent
          };
          fs.writeFileSync('reports/netlify-hook-response-metadata.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: 保存安全诊断结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TRRB Netlify Metadata Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/netlify-hook-response-metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Netlify hook response metadata [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
