name: News forward-only repair and verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-forward-fix-install.yml'
      - 'scripts/news-research-budget-contract.test.mjs'
      - 'scripts/news-budget-preload.mjs'
      - 'scripts/china-context-research.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: news-forward-fix-install
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEWS_BUDGET_ENFORCE: '0'
      NEWS_DEPTH_COMMISSION: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test actual guarded research, event identity and factual publication rules
        run: |
          set -euo pipefail
          node --experimental-strip-types --test \
            scripts/news-research-budget-contract.test.mjs \
            scripts/news-forward-policy.test.mjs \
            scripts/news-editorial-support.test.mjs \
            scripts/china-hot-editor.test.mjs \
            scripts/news-budget.test.mjs \
            scripts/news-priority.test.mjs \
            scripts/news-editorial-policy.test.mjs \
            scripts/ice-news-quality-gate.test.mjs \
            scripts/official-content-routing.test.mjs \
            scripts/ice-original-posts.test.mjs
      - name: Verify active fixed cutoff and wake only existing news producers
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const receipt=JSON.parse(readFileSync('scripts/news-forward-installation.json','utf8'));
          for(const path of ['.github/workflows/ice-unified-pipeline.yml','.github/workflows/china-hot-li-teacher-ingest.yml']){
            const workflow=readFileSync(path,'utf8');
            if(!workflow.includes('NEWS_BUDGET_ENFORCE: "1"')||!workflow.includes('NEWS_DEPTH_COMMISSION: "1"')||!workflow.includes(receipt.cutoff))throw new Error('Production policy missing: '+path);
          }
          for(const module of ['ice','china-hot']){
            const response=await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/actions/workflows/operations-control-plane.yml/dispatches`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({ref:'main',inputs:{module}})});
            if(response.status!==204)throw new Error(`Existing ${module} dispatch failed: ${response.status}`);
            console.log(JSON.stringify({event:'verified-existing-news-pipeline-dispatched',module,ref:'main',cutoff:receipt.cutoff}));
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n## Forward-only runtime verification\n\nProduction budget guard and deep commissioning are both enabled. Research stays within five searches; contract mismatches and actual budget limits have distinct logs. Existing ICE and China producers dispatched. No historical backfill or new schedule.\n');
          JS
