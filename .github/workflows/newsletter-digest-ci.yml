name: Newsletter Digest CI

on:
  pull_request:
    paths:
      - "netlify/functions/_shared/newsletter-digest-core.js"
      - "netlify/functions/_shared/newsletter-digest-core.test.js"
      - "netlify/functions/newsletter-digest-preview.js"
      - "netlify/functions/newsletter-digest-preview.test.js"
      - ".github/workflows/newsletter-digest-ci.yml"
  push:
    branches: [main]
    paths:
      - "netlify/functions/_shared/newsletter-digest-core.js"
      - "netlify/functions/_shared/newsletter-digest-core.test.js"
      - "netlify/functions/newsletter-digest-preview.js"
      - "netlify/functions/newsletter-digest-preview.test.js"
      - ".github/workflows/newsletter-digest-ci.yml"

permissions:
  contents: read

concurrency:
  group: newsletter-digest-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate safe digest selection and preview
        run: >-
          node --test
          netlify/functions/_shared/newsletter-digest-core.test.js
          netlify/functions/newsletter-digest-preview.test.js
