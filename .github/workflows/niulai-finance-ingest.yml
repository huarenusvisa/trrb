name: 牛来官方财经采集与草稿生成

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成中文稿并输出报告，不写入文章库"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/niulai-finance-ingest.yml"
      - "scripts/niulai-finance-ingest.mjs"
      - "scripts/lib/niulai-finance-sources.mjs"
  schedule:
    - cron: "8,38 * * * *"

permissions:
  contents: read

concurrency:
  group: trrb-niulai-finance-ingest
  cancel-in-progress: true

jobs:
  collect-translate-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN || secrets.X_API_BEARER_TOKEN || secrets.TWITTER_BEARER_TOKEN }}
      NIULAI_FINANCE_LOOKBACK_HOURS: "72"
      NIULAI_FINANCE_MAX_PUBLISH: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: 检查必要密钥
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "缺少 OPENAI_API_KEY"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "缺少 SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "缺少 SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          if [[ -z "$X_BEARER_TOKEN" ]]; then echo "未配置 X API，本轮仍采集美联储、SEC、BLS 官方订阅源。"; fi
      - name: 采集并生成后台待审中文草稿
        shell: bash
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          node scripts/niulai-finance-ingest.mjs "${args[@]}"
