name: 牛来财经独立站部署

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'niulai/**'
      - 'assets/topic-focus/finance-market.svg'
      - 'scripts/build-niulai-site.mjs'
      - '.github/workflows/niulai-site-deploy.yml'

permissions:
  contents: read

concurrency:
  group: niulai-production-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 84fc4308-5e59-4960-9f00-99c7b9c303cd
    steps:
      - uses: actions/checkout@v4
      - name: 构建独立站单一来源包
        run: node scripts/build-niulai-site.mjs
      - name: 发布到 niulai.us
        working-directory: .netlify/niulai-bundle
        run: npx --yes netlify-cli@latest deploy --prod --dir public --site "$NETLIFY_SITE_ID" --message "Niulai share metadata $GITHUB_SHA"
      - name: 验证分享图与抓取状态
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          page=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://niulai.us/?v=$stamp")
          headers=$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "https://niulai.us/?v=$stamp" | tr -d '\r')
          image_headers=$(curl -fsSI --max-time 20 "https://niulai.us/og-share.png?v=$stamp" | tr -d '\r')
          grep -q 'property="og:image"' <<<"$page"
          grep -q 'rel="apple-touch-icon"' <<<"$page"
          ! grep -qi '^x-robots-tag: noindex' <<<"$headers"
          grep -qi '^content-type: image/png' <<<"$image_headers"
