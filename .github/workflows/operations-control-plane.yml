name: TRRB Operations Control Plane

on:
  workflow_dispatch:
    inputs:
      module:
        description: "选择需要运行的模块"
        required: true
        default: all
        type: choice
        options:
          - all
          - ice
          - seo
          - ico
          - monitor
          - maintenance
          - china-hot
          - trump-x
          - jobs
          - secondhand
  schedule:
    # GitHub scheduled workflows can be delayed during periods of high load.
    # Wake the control plane four times per hour; the database cadence gate in
    # each collector remains the authority that permits one successful run per
    # 180 minutes. This is a retry heartbeat, not a 15-minute collection cycle.
    - cron: "7,22,37,52 * * * *"
    - cron: "47 3 * * *"
    - cron: "7 7 * * *"
    - cron: "23 8 * * 1"
    - cron: "12 13 * * *"
    - cron: "12 23 * * *"

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: trrb-operations-control-${{ github.event.schedule || inputs.module || github.ref }}
  cancel-in-progress: false

jobs:


  ice:
    if: ${{ github.event.schedule == '7,22,37,52 * * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'ice') }}
    uses: ./.github/workflows/ice-unified-pipeline.yml
    secrets: inherit

  seo-metadata:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'seo') }}
    uses: ./.github/workflows/round13-publish-seo-sync.yml
    secrets: inherit

  seo-indexnow:
    if: ${{ github.event.schedule == '7,22,37,52 * * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'seo') }}
    uses: ./.github/workflows/indexnow.yml
    secrets: inherit

  ico-accelerated-recovery:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'ico') }}
    uses: ./.github/workflows/legacy-search-recovery.yml
    with:
      limit: 1000
    secrets: inherit

  jobs-daily-ingest:
    if: ${{ github.event.schedule == '12 13 * * *' || github.event.schedule == '12 23 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'jobs') }}
    uses: ./.github/workflows/jobs-daily-ingest.yml
    secrets: inherit

  secondhand-daily-ingest:
    if: ${{ github.event.schedule == '12 13 * * *' || github.event.schedule == '12 23 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'secondhand') }}
    uses: ./.github/workflows/secondhand-daily-ingest.yml
    secrets: inherit

  china-hot-li-teacher:
    if: ${{ github.event.schedule == '7,22,37,52 * * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'china-hot') }}
    uses: ./.github/workflows/china-hot-li-teacher-ingest.yml
    secrets: inherit

  trump-x:
    if: ${{ github.event.schedule == '7,22,37,52 * * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'trump-x') }}
    uses: ./.github/workflows/trump-x-ingest.yml
    secrets: inherit


  daily-live-monitor:
    if: ${{ github.event.schedule == '47 3 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'monitor') }}
    uses: ./.github/workflows/live-seo-crawl.yml
    secrets: inherit

  daily-seo-integrity:
    if: ${{ github.event.schedule == '47 3 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'monitor') }}
    uses: ./.github/workflows/seo-integrity.yml
    secrets: inherit

  ice-night-maintenance:
    if: ${{ github.event.schedule == '7 7 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'maintenance') }}
    uses: ./.github/workflows/ice-night-maintenance.yml
    secrets: inherit

  ice-orphan-cleanup:
    if: ${{ github.event.schedule == '23 8 * * 1' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'maintenance') }}
    uses: ./.github/workflows/ice-orphan-media-cleanup.yml
    secrets: inherit
