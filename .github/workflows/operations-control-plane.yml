# Newest-canonical sitemap final verification: 2026-09-02T22:54Z
name: TRRB Operations Control Plane

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/operations-control-plane.yml'
  workflow_dispatch:
    inputs:
      module:
        description: "选择需要运行的模块"
        required: true
        default: all
        type: choice
        options:
          - all
          - ice
          - seo
          - ico
          - monitor
          - maintenance
          - china-hot
          - trump-x
          - jobs
          - secondhand
  schedule:
    # GitHub scheduled workflows can be delayed during periods of high load.
    # Wake the control plane four times per hour; the database cadence gate in
    # each collector remains the authority that permits one successful run per
    # 180 minutes. This is a retry heartbeat, not a 15-minute collection cycle.
    - cron: "7,22,37,52 * * * *"
    - cron: "47 3 * * *"
    - cron: "37 4 * * *"
    - cron: "7 7 * * *"
    - cron: "23 8 * * 1"
    - cron: "12 13 * * *"
    - cron: "12 23 * * *"

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: trrb-operations-control-${{ github.event.schedule || inputs.module || github.ref }}
  cancel-in-progress: false

jobs:
  automation-gate:
    name: 读取机器人硬开关
    runs-on: ubuntu-24.04
    outputs:
      global: ${{ steps.gate.outputs.global }}
      ice: ${{ steps.gate.outputs.ice }}
      china_hot: ${{ steps.gate.outputs.china_hot }}
      trump_x: ${{ steps.gate.outputs.trump_x }}
      jobs: ${{ steps.gate.outputs.jobs }}
      secondhand: ${{ steps.gate.outputs.secondhand }}
      seo_indexnow: ${{ steps.gate.outputs.seo_indexnow }}
      monitor: ${{ steps.gate.outputs.monitor }}
      maintenance: ${{ steps.gate.outputs.maintenance }}
      seo_metadata: ${{ steps.gate.outputs.seo_metadata }}
      legacy_recovery: ${{ steps.gate.outputs.legacy_recovery }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: 从正式数据库读取开关（失败即暂停）
        env:
          SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/automation-gate.mjs


  ice:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.ice == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'ice')) }}
    uses: ./.github/workflows/ice-unified-pipeline.yml
    secrets: inherit

  seo-metadata:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.seo_metadata == 'true' && (github.event_name == 'push' || github.event.schedule == '12 13 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'seo')) }}
    uses: ./.github/workflows/round13-publish-seo-sync.yml
    secrets: inherit

  seo-indexnow:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.seo_indexnow == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'seo')) }}
    uses: ./.github/workflows/indexnow.yml
    secrets: inherit

  ico-accelerated-recovery:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.legacy_recovery == 'true' && (github.event_name == 'push' || github.event.schedule == '37 4 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'ico')) }}
    uses: ./.github/workflows/legacy-search-recovery.yml
    with:
      limit: 1000
    secrets: inherit

  jobs-daily-ingest:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.jobs == 'true' && (github.event.schedule == '12 13 * * *' || github.event.schedule == '12 23 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'jobs')) }}
    uses: ./.github/workflows/jobs-daily-ingest.yml
    secrets: inherit

  secondhand-daily-ingest:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.secondhand == 'true' && (github.event.schedule == '12 13 * * *' || github.event.schedule == '12 23 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'secondhand')) }}
    uses: ./.github/workflows/secondhand-daily-ingest.yml
    secrets: inherit

  china-hot-li-teacher:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.china_hot == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'china-hot')) }}
    uses: ./.github/workflows/china-hot-li-teacher-ingest.yml
    secrets: inherit

  trump-x:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.trump_x == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'trump-x')) }}
    uses: ./.github/workflows/trump-x-ingest.yml
    secrets: inherit


  # Corrective changes to this control plane immediately run both SEO monitors.
  daily-live-monitor:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.monitor == 'true' && (github.event_name == 'push' || github.event.schedule == '47 3 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'monitor')) }}
    uses: ./.github/workflows/live-seo-crawl.yml
    secrets: inherit

  daily-seo-integrity:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.monitor == 'true' && (github.event_name == 'push' || github.event.schedule == '47 3 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'monitor')) }}
    uses: ./.github/workflows/seo-integrity.yml
    secrets: inherit

  ice-night-maintenance:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.maintenance == 'true' && (github.event.schedule == '7 7 * * *' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'maintenance')) }}
    uses: ./.github/workflows/ice-night-maintenance.yml
    secrets: inherit

  ice-orphan-cleanup:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.global == 'true' && needs.automation-gate.outputs.maintenance == 'true' && (github.event.schedule == '23 8 * * 1' || github.event_name == 'workflow_dispatch' && (inputs.module == 'all' || inputs.module == 'maintenance')) }}
    uses: ./.github/workflows/ice-orphan-media-cleanup.yml
    secrets: inherit


  notify-failure:
    name: 发送机器人站内错误通知
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs:
      - automation-gate
      - ice
      - seo-metadata
      - seo-indexnow
      - ico-accelerated-recovery
      - jobs-daily-ingest
      - secondhand-daily-ingest
      - china-hot-li-teacher
      - trump-x
      - daily-live-monitor
      - daily-seo-integrity
      - ice-night-maintenance
      - ice-orphan-cleanup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 写入机器人管理站内通知
        env:
          SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOMATION_CONTROL_KEY: global
          AUTOMATION_NOTIFICATION_TITLE: 机器人任务流执行失败
          AUTOMATION_NOTIFICATION_MESSAGE: "控制面任务失败；触发模块：${{ inputs.module || 'scheduled' }}。请查看 GitHub Actions 运行日志。"
        run: node scripts/automation-notify.mjs
