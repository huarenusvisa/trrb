name: PEOPLE-R1 Node 3 Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260817020000_people_r1_n3_search.sql'
      - 'scripts/people-r1-node3-audit.mjs'
      - '.github/workflows/people-r1-node3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit PEOPLE-R1-N3 search and disambiguation contract
        run: node scripts/people-r1-node3-audit.mjs
