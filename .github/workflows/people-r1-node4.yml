name: PEOPLE-R1 Node 4 Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'docs/PEOPLE-01-US-CHINESE-BIOGRAPHICAL-ARCHIVE.md'
      - 'supabase/migrations/20260817001500_people_r1_foundation.sql'
      - 'supabase/migrations/20260817050600_people_r1_n4_creation.sql'
      - 'scripts/people-r1-node4-audit.mjs'
      - '.github/workflows/people-r1-node4.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/people-r1-node4-audit.mjs
