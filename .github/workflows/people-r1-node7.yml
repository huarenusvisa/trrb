name: PEOPLE-R1 Node 7 Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260817001500_people_r1_foundation.sql'
      - 'supabase/migrations/20260817143000_people_r1_n7_life_status.sql'
      - 'scripts/people-r1-node7-audit.mjs'
      - '.github/workflows/people-r1-node7.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/people-r1-node7-audit.mjs
