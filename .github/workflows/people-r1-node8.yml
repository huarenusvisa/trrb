name: PEOPLE-R1 Node 8 Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260817151500_people_r1_n8_claims_relations.sql'
      - 'scripts/people-r1-node8-audit.mjs'
      - '.github/workflows/people-r1-node8.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/people-r1-node8-audit.mjs
