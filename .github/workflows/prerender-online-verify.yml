name: 文章预渲染线上验证

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "netlify/edge-functions/article-prerender.ts"
      - "article.html"
      - "article-index-guard.js"
      - "scripts/generate-sitemaps.mjs"
      - "scripts/verify-prerender-online.mjs"
      - "netlify.toml"
      - ".github/workflows/prerender-online-verify.yml"

permissions:
  contents: read

concurrency:
  group: trrb-prerender-online-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 等待 Netlify 发布最新版本
        run: sleep 150
      - name: 模拟 Googlebot 与普通浏览器验证文章首屏 HTML
        env:
          SITE_ORIGIN: https://trrb.net
          PRERENDER_SAMPLE: "10"
        run: node scripts/verify-prerender-online.mjs
      - name: 保存预渲染验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerender-online-report
          path: prerender-online-report.json
          retention-days: 30
