name: 独立产品索引边界生产验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trrb-product-index-boundary-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 校验源码索引边界
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/niulai/' _headers
          grep -q '/niulai/\*' _headers
          grep -q '/jobs/publish.html' _headers
          grep -q '/jobs/seeker.html' _headers
          grep -q 'X-Robots-Tag: noindex, follow, noarchive' _headers
          grep -q "https://trrb.net/immigrate/" scripts/generate-sitemaps.mjs
          grep -q "https://trrb.net/jobs/" scripts/generate-sitemaps.mjs
          ! grep -q "https://trrb.net/niulai/" scripts/generate-sitemaps.mjs
          grep -q 'STATIC_HUBS' netlify/edge-functions/sitemap-live.ts

      - name: 等待生产并验收HTTP头与Live Sitemap
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            stamp="${GITHUB_RUN_ID}-${attempt}"
            sitemap=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/sitemap.xml?product-index=$stamp" || true)
            finance=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/niulai/?product-index=$stamp" | tr -d '\r' || true)
            publish=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/jobs/publish.html?product-index=$stamp" | tr -d '\r' || true)
            seeker=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/jobs/seeker.html?product-index=$stamp" | tr -d '\r' || true)

            sitemap_jobs=$(printf '%s' "$sitemap" | grep -c '<loc>https://trrb.net/jobs/</loc>' || true)
            sitemap_immigrate=$(printf '%s' "$sitemap" | grep -c '<loc>https://trrb.net/immigrate/</loc>' || true)
            sitemap_finance=$(printf '%s' "$sitemap" | grep -c '<loc>https://trrb.net/niulai/</loc>' || true)
            finance_noindex=$(printf '%s' "$finance" | grep -ci '^x-robots-tag:.*noindex' || true)
            publish_noindex=$(printf '%s' "$publish" | grep -ci '^x-robots-tag:.*noindex' || true)
            seeker_noindex=$(printf '%s' "$seeker" | grep -ci '^x-robots-tag:.*noindex' || true)

            echo "attempt=$attempt sitemap jobs=$sitemap_jobs immigrate=$sitemap_immigrate finance=$sitemap_finance noindex finance=$finance_noindex publish=$publish_noindex seeker=$seeker_noindex"

            if [ "$sitemap_jobs" -ge 1 ] \
              && [ "$sitemap_immigrate" -ge 1 ] \
              && [ "$sitemap_finance" -eq 0 ] \
              && [ "$finance_noindex" -ge 1 ] \
              && [ "$publish_noindex" -ge 1 ] \
              && [ "$seeker_noindex" -ge 1 ]; then
              echo 'PRODUCT_INDEX_BOUNDARY_PRODUCTION_PASS=true'
              exit 0
            fi
            sleep 10
          done
          echo 'Product indexing boundary did not converge in production.'
          exit 1
