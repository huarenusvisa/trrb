name: Production Deploy Coverage Bridge

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: trrb-production-coverage-bridge
  cancel-in-progress: true

jobs:
  dispatch-production-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch current exact-SHA production gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          code=$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/round16-node9-production-deploy-recovery.yml/dispatches" \
            -d '{"ref":"main"}')
          cat /tmp/dispatch-response.txt || true
          test "$code" = "204" || { echo "Production workflow dispatch failed: HTTP $code"; exit 1; }
          echo 'Current production workflow dispatched.'
