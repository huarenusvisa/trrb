name: 生产SEO自动诊断留档

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/production-seo-diagnostic.mjs"
      - "scripts/generate-sitemaps.mjs"
      - "scripts/clean-sitemap-against-database.mjs"
      - "scripts/ensure-sitemap-articles.mjs"
      - "scripts/finalize-redirects.mjs"
      - "netlify.toml"
      - "netlify/edge-functions/**"
      - "article.html"
      - "listing.html"
      - "topic/ice/**"
      - ".github/workflows/production-seo-diagnostic.yml"

permissions:
  contents: write

concurrency:
  group: trrb-production-seo-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 等待Netlify生产部署
        run: sleep 240
      - name: 执行生产SEO诊断
        run: node scripts/production-seo-diagnostic.mjs
      - name: 提交最新诊断报告到仓库
        run: |
          git config user.name "TRRB SEO Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/production-seo-latest.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Update production SEO diagnostic report [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
