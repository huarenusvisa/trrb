name: 生产SEO自动诊断留档

on:
  workflow_dispatch:
  schedule:
    # Full production SEO diagnostics are intentionally batched twice daily.
    # Ordinary main pushes rely on deployment acceptance and do not need to
    # launch another full-site crawl.
    - cron: '17 7,19 * * *'

permissions:
  contents: write

concurrency:
  group: trrb-production-seo-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 等待当前main提交部署到生产
        shell: bash
        run: |
          set -euo pipefail
          target="${GITHUB_SHA}"
          for attempt in $(seq 1 90); do
            live="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/deploy-version.txt?run=${GITHUB_RUN_ID}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n[:space:]' || true)"
            if [ "$live" = "$target" ]; then
              echo "Production is running exact target $target"
              exit 0
            fi
            if [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
              git fetch --no-tags --depth=100 origin "$live" >/dev/null 2>&1 || true
              if git merge-base --is-ancestor "$target" "$live" 2>/dev/null; then
                echo "Production is running descendant $live containing target $target"
                exit 0
              fi
            fi
            echo "Waiting for production: expected target-or-descendant=$target live=${live:-unavailable} attempt=$attempt/90"
            sleep 10
          done
          echo "Production did not reach $target within 15 minutes." >&2
          exit 1

      - id: diagnostic
        name: 执行生产SEO诊断
        continue-on-error: true
        run: node scripts/production-seo-diagnostic.mjs

      - name: 保存本次生产诊断报告
        if: ${{ always() && steps.diagnostic.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-seo-diagnostic-${{ github.run_id }}
          path: reports/production-seo-latest.json
          if-no-files-found: error
          retention-days: 30

      - name: 提交最新诊断报告到仓库
        if: ${{ always() && steps.diagnostic.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TRRB SEO Diagnostic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/production-seo-latest.json
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update production SEO diagnostic report [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 阻止SEO故障被标记为成功
        if: ${{ steps.diagnostic.outcome == 'failure' }}
        run: |
          echo "Production SEO diagnostic found blocking failures." >&2
          exit 1
