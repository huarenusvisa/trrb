name: 第十一轮特朗普无人机文章回归

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "articles-home.js"
      - "article.html"
      - "article-index-guard.js"
      - "netlify/edge-functions/article-prerender.ts"
      - "immigrate/center.html"
      - "scripts/seo-integrity-audit.mjs"
      - "_headers"
      - "_redirects"
      - "netlify.toml"
      - ".github/workflows/round11-drone-article-regression.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 查询无人机关税文章并等待生产修复
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request

          BASE='https://fwiznbpsqkfgkvyznebz.supabase.co/rest/v1'
          KEY='sb_publishable_hSmKJghvQoJKg0m5loDQ2g_f1gu8qak'
          HEADERS={'apikey':KEY,'Authorization':'Bearer '+KEY,'Accept':'application/json','User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'}

          def api(path, params):
              url=BASE+path+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())

          rows=api('/articles', {
              'select':'id,title,slug,status,category_name,category_id,topic_key,published_at',
              'status':'eq.published',
              'title':'ilike.*无人机*',
              'order':'published_at.desc.nullslast',
              'limit':'20'
          })
          candidates=[r for r in rows if ('关税' in str(r.get('title','')) or '100%' in str(r.get('title',''))) and '特朗普' in str(r.get('title',''))]
          if not candidates:
              raise SystemExit('未找到特朗普无人机关税文章')
          row=candidates[0]
          print('DB_ARTICLE=', json.dumps(row, ensure_ascii=False))

          topic=str(row.get('topic_key') or '').strip().lower()
          if topic in ('trump','ice'):
              section=topic
          else:
              cats=api('/categories', {'select':'slug','id':'eq.'+str(row.get('category_id') or ''),'limit':'1'}) if row.get('category_id') else []
              section=str(cats[0].get('slug') if cats else '').strip()
              if not section:
                  section={
                    '重要新闻':'important-news','热门头条':'hot-headlines','美国时政':'us-politics',
                    '美国警情':'us-crime','中国官场':'china-officialdom','移民美国':'immigration',
                    '庇护百科':'asylum','驱逐快报':'deport'
                  }.get(str(row.get('category_name') or ''),'news')
          target='https://trrb.net/'+urllib.parse.quote(section,safe='')+'/'+urllib.parse.quote(str(row['slug']),safe='')
          print('TARGET=', target)

          last=''
          for attempt in range(1,25):
              try:
                  req=urllib.request.Request(target, headers={**HEADERS,'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      html=r.read().decode('utf-8','replace')
                      final=r.geturl()
                      status=r.status
                  last=f'status={status} final={final} len={len(html)}'
                  print('attempt', attempt, last)
                  good=(
                      status==200 and
                      'data-prerendered="true"' in html and
                      ('无人机' in html and ('关税' in html or '100%' in html)) and
                      '迈阿密按摩院连环扫黄' not in html and
                      '文章不存在' not in html and
                      'article.js?v=29.7' not in html and
                      'article-index-guard.js' not in html and
                      'article-seo.js' not in html
                  )
                  if good:
                      print('ROUND11_DRONE_ARTICLE_PASS')
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  last=repr(e)
                  print('attempt', attempt, last)
              time.sleep(15)
          raise SystemExit('生产环境仍未稳定通过: '+last)
          PY
