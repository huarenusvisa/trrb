name: 第十一轮无人机文章数据库诊断

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/round11-drone-db-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 查询无人机关税文章
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://fwiznbpsqkfgkvyznebz.supabase.co/rest/v1/articles'
          key='sb_publishable_hSmKJghvQoJKg0m5loDQ2g_f1gu8qak'
          params={'select':'id,title,slug,status,category_name,category_id,topic_key,published_at','status':'eq.published','title':'ilike.*无人机*','order':'published_at.desc.nullslast','limit':'20'}
          url=base+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url, headers={'apikey':key,'Authorization':'Bearer '+key,'Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=20) as r: rows=json.loads(r.read().decode())
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY
