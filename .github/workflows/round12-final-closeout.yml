name: 第十二轮最终生产总验收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/round12-production-audit.mjs"
      - "scripts/round12-mobile-visual.mjs"
      - "scripts/round12-final-closeout.mjs"
      - "topic/ice/ice.css"
      - "topic/ice/live-v6.html"
      - "trump/index.html"
      - "topic/trump/trump.css"
      - "listing.html"
      - "listing.js"
      - "site-search.js"
      - "article-route-runtime.js"
      - ".github/workflows/round12-final-closeout.yml"

permissions:
  contents: read

concurrency:
  group: trrb-round12-final-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装真实浏览器
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: 等待当前版本真正上线
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum scripts/round12-mobile-visual.mjs | awk '{print $1}')"
          echo "Expected mobile probe sha256: $expected"
          for attempt in $(seq 1 48); do
            probe="/tmp/round12-closeout-live-${attempt}.mjs"
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://trrb.net/scripts/round12-mobile-visual.mjs?sha=${GITHUB_SHA}&attempt=${attempt}" -o "$probe"; then
              live="$(sha256sum "$probe" | awk '{print $1}')"
              echo "Deploy probe ${attempt}/48: $live"
              if [ "$live" = "$expected" ]; then
                echo "Current Round 12 version is live."
                exit 0
              fi
            else
              echo "Deploy probe ${attempt}/48: production probe not ready"
            fi
            sleep 5
          done
          echo "Production never exposed the current Round 12 probe within 4 minutes."
          exit 1
      - name: 第十二轮1-7和9生产审计
        env:
          SITE_ORIGIN: https://trrb.net
        run: node scripts/round12-production-audit.mjs
      - name: 第十二轮8真实移动端验收
        env:
          SITE_ORIGIN: https://trrb.net
        run: node scripts/round12-mobile-visual.mjs
      - name: 第十二轮10最终关闭判定
        run: node scripts/round12-final-closeout.mjs
      - name: 保存第十二轮最终报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round12-final-closeout
          path: |
            round12-production-audit.json
            round12-mobile-visual.json
            round12-final-closeout.json
            round12-*.png
          retention-days: 30
