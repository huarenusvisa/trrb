name: 第十二轮最终生产总验收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/round12-production-audit.mjs"
      - "scripts/round12-mobile-visual.mjs"
      - "scripts/round12-final-closeout.mjs"
      - "topic/ice/ice.css"
      - "topic/ice/live-v6.html"
      - "trump/index.html"
      - "topic/trump/trump.css"
      - "listing.html"
      - "listing.js"
      - "site-search.js"
      - "article-route-runtime.js"
      - ".github/workflows/round12-final-closeout.yml"

permissions:
  contents: read

concurrency:
  group: trrb-round12-final-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装真实浏览器
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: 等待Netlify生产部署
        run: sleep 240
      - name: 第十二轮1-7和9生产审计
        env:
          SITE_ORIGIN: https://trrb.net
        run: node scripts/round12-production-audit.mjs
      - name: 第十二轮8真实移动端验收
        env:
          SITE_ORIGIN: https://trrb.net
        run: node scripts/round12-mobile-visual.mjs
      - name: 第十二轮10最终关闭判定
        run: node scripts/round12-final-closeout.mjs
      - name: 保存第十二轮最终报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round12-final-closeout
          path: |
            round12-production-audit.json
            round12-mobile-visual.json
            round12-final-closeout.json
            round12-*.png
          retention-days: 30
