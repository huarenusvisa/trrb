name: 第十二轮重复slug修复

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/round12-repair-duplicate-slugs.yml"
      - "scripts/round12-repair-duplicate-slugs.mjs"

permissions:
  contents: read

concurrency:
  group: round12-repair-duplicate-slugs
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repair duplicate published slugs
        run: node scripts/round12-repair-duplicate-slugs.mjs
