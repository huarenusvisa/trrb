name: 第十三轮节点5-发布失败与异常文章自动拦截

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trrb-round13-node5-publish-guard
  cancel-in-progress: true

jobs:
  publish-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 发布失败与异常文章自动拦截生产验收
        run: node scripts/round13-node5-publish-guard-audit.mjs
