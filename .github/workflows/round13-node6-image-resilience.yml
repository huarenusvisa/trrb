name: 第十三轮节点6-图片上传与封面自动容灾

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trrb-round13-node6-image-resilience
  cancel-in-progress: true

jobs:
  image-resilience:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 图片上传与封面自动容灾生产验收
        env:
          SITE_ORIGIN: https://trrb.net
        run: node scripts/round13-node6-image-resilience-audit.mjs
