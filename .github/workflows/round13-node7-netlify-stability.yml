name: 第十三轮节点7-Netlify构建与部署稳定性

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trrb-round13-node7-netlify-stability
  cancel-in-progress: true

jobs:
  netlify-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 等待节点7生产版本上线
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum scripts/round13-node7-netlify-stability-audit.mjs | awk '{print $1}')"
          for attempt in $(seq 1 60); do
            probe="/tmp/round13-node7-${attempt}.mjs"
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://trrb.net/scripts/round13-node7-netlify-stability-audit.mjs?sha=${GITHUB_SHA}&attempt=${attempt}" -o "$probe"; then
              live="$(sha256sum "$probe" | awk '{print $1}')"
              if [ "$live" = "$expected" ]; then echo "Current node7 audit is live."; exit 0; fi
            fi
            sleep 5
          done
          echo "Node7 production audit did not converge within 5 minutes."
          exit 1
      - name: Netlify构建与部署稳定性生产验收
        env:
          SITE_ORIGIN: https://trrb.net
        run: node scripts/round13-node7-netlify-stability-audit.mjs
