name: 第十三轮发布后SEO实时同步

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: trrb-round13-publish-seo-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 对齐主分支最新版本
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: 校验生产密钥
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: 从生产数据库重建 Sitemap / News Sitemap / RSS
        run: |
          node scripts/generate-sitemaps.mjs
          node scripts/clean-sitemap-against-database.mjs
          node scripts/ensure-sitemap-articles.mjs
          node scripts/generate-feed.mjs
          node scripts/upgrade-article-urls.mjs --metadata-only
          # generate-sitemaps.mjs rewrites _redirects from active categories.
          # Restore canonical host/alias rules without invoking homepage mutation.
          node scripts/finalize-redirects.mjs --redirects-only
      - name: 拒绝任何页面或运行时文件被定时同步误改
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            file="${line:3}"
            case "$file" in
              sitemap.xml|news-sitemap.xml|feed.xml|_redirects) ;;
              *) echo "Unexpected scheduled SEO side effect: $file"; bad=1 ;;
            esac
          done < <(git status --porcelain)
          test "$bad" -eq 0
      - name: 仅在SEO文件变化时提交
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TRRB Round13 Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml news-sitemap.xml feed.xml _redirects
          if git diff --cached --quiet -I '<lastBuildDate>' -I '<atom:updated>'; then
            echo "Only generated feed timestamps changed; no commit required."
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "SEO metadata already converged; no commit required."
            exit 0
          fi
          git commit -m "Round 13: sync published articles into SEO feeds"
          git pull --rebase origin main
          git push origin HEAD:main
