name: 第十三轮发布后SEO实时同步

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/round13-publish-seo-sync.yml"
      - "scripts/generate-sitemaps.mjs"
      - "scripts/clean-sitemap-against-database.mjs"
      - "scripts/ensure-sitemap-articles.mjs"
      - "scripts/generate-feed.mjs"
      - "scripts/upgrade-article-urls.mjs"
      - "scripts/finalize-redirects.mjs"
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "ICE持续处理发布线"
      - "ICE直接救援生产线"
      - "ICE唯一生产流水线"
      - "ICE旧版手动应急流程"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: trrb-round13-publish-seo-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 对齐主分支最新版本
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: 校验生产密钥
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: 从生产数据库重建 Sitemap / News Sitemap / RSS
        run: |
          node scripts/generate-sitemaps.mjs
          node scripts/clean-sitemap-against-database.mjs
          node scripts/ensure-sitemap-articles.mjs
          node scripts/generate-feed.mjs
          node scripts/upgrade-article-urls.mjs --metadata-only
          # generate-sitemaps.mjs rewrites _redirects from active categories.
          # Restore canonical host/alias rules without invoking homepage mutation.
          node scripts/finalize-redirects.mjs --redirects-only
      - name: 拒绝任何页面或运行时文件被定时同步误改
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            file="${line:3}"
            case "$file" in
              sitemap.xml|news-sitemap.xml|feed.xml|_redirects) ;;
              *) echo "Unexpected scheduled SEO side effect: $file"; bad=1 ;;
            esac
          done < <(git status --porcelain)
          test "$bad" -eq 0
      - name: 只读报告SEO快照差异
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- sitemap.xml news-sitemap.xml feed.xml _redirects; then
            echo "SEO metadata already converged."
            exit 0
          fi
          echo "SEO metadata drift detected; the existing Netlify build and live Edge responders remain the only production output chain."
          git diff --stat -- sitemap.xml news-sitemap.xml feed.xml _redirects
