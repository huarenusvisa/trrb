name: 第十四轮节点1-搜索引擎抓取与索引入口一致性验收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/round14-node1-crawl-index-entry-audit.mjs"
      - ".github/workflows/round14-node1-crawl-index-entry.yml"
      - "robots.txt"
      - "netlify.toml"
      - "netlify/edge-functions/**"

permissions:
  contents: read

concurrency:
  group: trrb-round14-node1-crawl-index-entry
  cancel-in-progress: true

jobs:
  crawl-index-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SITE_ORIGIN: https://trrb.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 搜索引擎抓取与索引入口生产验收
        run: node scripts/round14-node1-crawl-index-entry-audit.mjs
      - name: 保存节点1报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round14-node1-crawl-index-entry
          path: round14-node1-crawl-index-entry-audit.json
          if-no-files-found: warn
          retention-days: 30
