name: 第十四轮节点10-第十四轮最终生产总验收

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trrb-round14-node10-final-production
  cancel-in-progress: true

jobs:
  final-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SITE_ORIGIN: https://trrb.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装最终验收所需 Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          rm -f package.json package-lock.json
      - name: 确认节点9安全治理已上线
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            a="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -H 'Cache-Control: no-cache' "https://trrb.net/scripts/round14-node7-core-web-vitals-audit.mjs?r14final=${GITHUB_SHA}-${attempt}" || true)"
            b="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -H 'Cache-Control: no-cache' "https://trrb.net/netlify/edge-functions/article-prerender.ts?r14final=${GITHUB_SHA}-${attempt}" || true)"
            if { [ "$a" = "404" ] || [ "$a" = "410" ]; } && { [ "$b" = "404" ] || [ "$b" = "410" ]; }; then
              echo "Round14 production security state is live."
              exit 0
            fi
            sleep 5
          done
          echo "Round14 production security state not ready."
          exit 1
      - name: 第十四轮最终生产总验收
        run: node scripts/round14-node10-final-production-audit.mjs
      - name: 保存最终验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round14-node10-final-production
          path: |
            round14-node10-final-production-audit.json
            round14-node1-crawl-index-entry-audit.json
            round14-node2-canonical-robots-noindex-audit.json
            round14-node3-newsarticle-schema-audit.json
            round14-node4-internal-link-orphan-audit.json
            round14-node5-duplicate-thin-content-audit.json
            round14-node6-image-seo-audit.json
            round14-node7-core-web-vitals-audit.json
            round14-node8-search-discovery-push-audit.json
            round14-node9-security-audit.json
          if-no-files-found: ignore
          retention-days: 30
