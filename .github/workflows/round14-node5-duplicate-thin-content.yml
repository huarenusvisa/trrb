name: 第十四轮节点5-重复内容与薄内容持续清理

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trrb-round14-node5-duplicate-thin-content
  cancel-in-progress: true

jobs:
  duplicate-thin-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_ORIGIN: https://trrb.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 重复内容与薄内容生产验收
        run: node scripts/round14-node5-duplicate-thin-content-audit.mjs
      - name: 保存节点5报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round14-node5-duplicate-thin-content
          path: round14-node5-duplicate-thin-content-audit.json
          if-no-files-found: warn
          retention-days: 30
