name: Round15 CA2 RSS debug
on:
  push:
    branches: [main]
    paths:
      - "scripts/round15-ca2-debug.mjs"
      - ".github/workflows/round15-ca2-debug.yml"
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/round15-ca2-debug.mjs
