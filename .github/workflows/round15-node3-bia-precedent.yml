name: 第十五轮节点3-BIA先例裁决自动采集

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '旧采集器已由Round16统一链替代；输入 RUN 才执行'
        required: true
        default: 'STOP'

permissions:
  contents: write

concurrency:
  group: trrb-round15-node3-bia-precedent
  cancel-in-progress: true

jobs:
  collect:
    if: ${{ inputs.confirmation == 'RUN' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 采集EOIR官方BIA先例裁决
        run: node scripts/round15-node3-bia-precedent-collector.mjs
      - name: 保存节点3验收报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round15-node3-bia-precedent
          path: |
            round15-node3-bia-precedent-audit.json
            data/legal/bia-precedent-latest.json
          if-no-files-found: warn
          retention-days: 30
      - name: 官方先例数据有变化时提交
        if: success()
        run: |
          git config user.name "TRRB Round15 Legal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/legal/bia-precedent-latest.json
          if git diff --cached --quiet; then
            echo "No BIA precedent data change."
          else
            git commit -m "Round 15: sync BIA precedent decisions"
            git push
          fi
