name: 第十六轮节点2-统一法律数据库自动重建与版本同步

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/legal/**'
      - 'scripts/round15-node6-unified-legal-database.mjs'
      - 'scripts/round16-node2-unified-db-sync-audit.mjs'
      - '.github/workflows/round16-node2-unified-db-sync.yml'
  workflow_run:
    workflows: ['第十六轮节点1-五大官方法律源自动采集触发链闭环']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: trrb-round16-node2-unified-db-sync
  cancel-in-progress: true

jobs:
  rebuild-verify-database:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 从五大官方源重建统一法律数据库
        run: node scripts/round15-node6-unified-legal-database.mjs

      - name: 验收统一数据库版本与去重完整性
        run: node scripts/round16-node2-unified-db-sync-audit.mjs

      # Do NOT generate sitemap-legal.xml here. A newly rebuilt legal database
      # necessarily has a new datasetVersion before the AI analysis file has
      # caught up. The strict legal sitemap generator intentionally requires
      # exact N/N DB↔AI alignment, so running it in node2 would deadlock every
      # legitimate database update before the new DB could even be committed.
      # The AI workflow is triggered by the DB commit below; sitemap generation
      # remains a post-analysis responsibility.
      - name: 数据变化时仅提交统一法律数据库与数据库验收报告
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/legal/unified-legal-authorities-latest.json round15-node6-unified-legal-database-audit.json round16-node2-unified-db-sync-audit.json
          if git diff --cached --quiet; then
            echo 'No unified legal database changes to commit.'
            exit 0
          fi
          git commit -m 'Round 16 node2: synchronize unified legal database version'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 记录数据库版本并交棒AI同步
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./data/legal/unified-legal-authorities-latest.json').datasetVersion")
          COUNT=$(node -p "require('./data/legal/unified-legal-authorities-latest.json').count")
          echo "ROUND16 NODE2 DATABASE PASS: version=$VERSION records=$COUNT"
          echo 'The data/legal DB commit triggers the legal AI analysis workflow. Production legal sitemap/deploy must wait for strict DB↔AI N/N alignment.'
