name: 第十六轮节点9-法律栏目SEO、Sitemap与结构化数据完整性

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - 'data/legal/**'
      - 'sitemap-legal.xml'
      - 'scripts/generate-legal-sitemap.mjs'
      - 'scripts/round16-node9-legal-seo-sitemap-schema.mjs'
      - '.github/workflows/round16-node9-legal-seo-sitemap-schema.yml'

permissions:
  contents: write

jobs:
  legal-seo-sitemap-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 生成与当前法律数据库一致的Sitemap
        run: node scripts/generate-legal-sitemap.mjs
      - name: Sitemap变化时提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap-legal.xml
          if git diff --cached --quiet; then
            echo 'Legal sitemap already synchronized.'
          else
            git commit -m 'Round 16 node9: synchronize legal sitemap'
            git push origin HEAD:main
          fi
      - name: 安装Chromium真实浏览器
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: 等待节点9前端与Sitemap生产上线
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://trrb.net/legal/detail.js?round16node9=$(date +%s)" | grep -q 'legal-detail-jsonld' \
              && curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://trrb.net/sitemap-legal.xml?round16node9=$(date +%s)" | grep -q '<urlset'; then
              echo 'Node9 production assets are live.'
              exit 0
            fi
            echo "Waiting for production node9 assets ($attempt/90)..."
            sleep 10
          done
          echo 'Node9 production assets did not become ready in time.'
          exit 1
      - name: 法律栏目SEO、Sitemap与结构化数据生产验收
        env:
          SITE_ORIGIN: https://trrb.net
        run: node scripts/round16-node9-legal-seo-sitemap-schema.mjs
      - name: 保存节点9报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round16-node9-legal-seo-sitemap-schema
          path: round16-node9-legal-seo-sitemap-schema.json
          retention-days: 30
