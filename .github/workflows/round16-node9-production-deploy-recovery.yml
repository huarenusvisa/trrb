# Single production deploy gate for the current TRRB product.
name: 生产部署与当前产品验收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '_headers'
      - '_redirects'
      - 'netlify.toml'
      - '*.js'
      - '*.css'
      - 'jobs/**'
      - 'huarengongzuo/**'
      - 'niulai/**'
      - 'immigrate/**'
      - 'immigration-judge-approval-rate/**'
      - 'trump/**'
      - 'topic/**'
      - 'netlify/functions/**'
      - 'netlify/edge-functions/**'
      - 'scripts/generate-sitemaps.mjs'
      - 'scripts/finalize-redirects.mjs'
      - 'scripts/split-sitemap-index.mjs'
      - 'scripts/validate-site.mjs'
      - 'scripts/seo-integrity-audit.mjs'
      - '.github/workflows/round16-node9-production-deploy-recovery.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: trrb-production-deploy-main
  cancel-in-progress: true

jobs:
  deploy-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: b30280d2-b4f8-4a19-9135-862dd9c7171f
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 锁定最新 main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 20
          git fetch origin main
          git reset --hard origin/main
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "deploying_main=$DEPLOY_SHA"

          statuses="$(curl -fsS             -H "Authorization: Bearer $GITHUB_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/status" || true)"
          already_accepted="$(STATUS_JSON="$statuses" node -e '
            const payload = JSON.parse(process.env.STATUS_JSON || "{}");
            const hit = (payload.statuses || []).some((item) =>
              item.context === "trrb/production-accepted" && item.state === "success"
            );
            process.stdout.write(hit ? "true" : "false");
          ')"
          echo "SKIP_DEPLOY=$already_accepted" >> "$GITHUB_ENV"
          echo "already_accepted=$already_accepted"

      - name: 标记生产验收开始
        if: env.SKIP_DEPLOY != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
            -d '{"state":"pending","context":"trrb/production-accepted","description":"Waiting for Netlify Git deployment and production acceptance"}' >/dev/null

      - name: 手动运行时发布 Netlify Production
        if: ${{ github.event_name == 'workflow_dispatch' && env.SKIP_DEPLOY != 'true' }}
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          token_valid=false
          deploy_mode='none'
          if [ -n "${NETLIFY_AUTH_TOKEN:-}" ]; then
            token_http=$(curl -sS -o /tmp/netlify-user.json -w '%{http_code}' \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H 'Accept: application/json' \
              'https://api.netlify.com/api/v1/user' || true)
            if [ "$token_http" = "200" ]; then
              token_valid=true
            else
              echo "Netlify token is present but account authentication returned HTTP $token_http; using build hook fallback."
            fi
          fi

          if [ "$token_valid" = "true" ]; then
            deploy_mode='cli'
            echo 'Deploy mode: Netlify CLI direct production deploy via validated repository token'
            npx --yes netlify-cli@latest deploy --prod --context production
          elif [ -n "${NETLIFY_BUILD_HOOK:-}" ]; then
            deploy_mode='build-hook'
            echo 'Deploy mode: Netlify build hook fallback'
            if [[ "$NETLIFY_BUILD_HOOK" == *\?* ]]; then
              hook_url="${NETLIFY_BUILD_HOOK}&trigger_branch=main&clear_cache=true"
            else
              hook_url="${NETLIFY_BUILD_HOOK}?trigger_branch=main&clear_cache=true"
            fi
            curl -fsS -X POST "$hook_url"
          else
            echo 'No valid Netlify auth token and no build hook configured.'
            exit 2
          fi
          echo "DEPLOY_MODE=$deploy_mode" >> "$GITHUB_ENV"

      - name: 发布生产触发结果状态
        if: ${{ always() && github.event_name == 'workflow_dispatch' && env.SKIP_DEPLOY != 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            state='success'
            description="Production trigger accepted via ${DEPLOY_MODE:-unknown}"
          else
            state='failure'
            description='Production trigger failed before acceptance'
          fi
          payload=$(node -e 'process.stdout.write(JSON.stringify({state:process.argv[1],context:"trrb/production-trigger",description:process.argv[2]}))' "$state" "$description")
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
            -d "$payload" >/dev/null

      - name: 停止失败的生产触发
        if: ${{ github.event_name == 'workflow_dispatch' && env.SKIP_DEPLOY != 'true' && steps.deploy.outcome != 'success' }}
        shell: bash
        run: exit 1

      - name: 验收 Netlify Git 部署的当前 SHA
        if: env.SKIP_DEPLOY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            stamp=$(date +%s)
            live_sha=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/deploy-version.txt?v=$stamp" 2>/dev/null | tr -d '\r\n[:space:]' || true)
            home=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/?v=$stamp" || true)
            bundle=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/.netlify/functions/public-home-bundle?v=$stamp" || true)
            sitemap=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/sitemap.xml?v=$stamp" || true)

            sha_ok=0; [ "$live_sha" = "$DEPLOY_SHA" ] && sha_ok=1
            home_ok=$(printf '%s' "$home" | grep -Eci '<!doctype html|<html' || true)
            bundle_ok=$(printf '%s' "$bundle" | grep -c '"mode":"homepage"' || true)
            sitemap_ok=$(printf '%s' "$sitemap" | grep -Ec '<urlset|<sitemapindex' || true)

            echo "attempt=$attempt sha=$sha_ok home=$home_ok bundle=$bundle_ok sitemap=$sitemap_ok"
            if [ "$sha_ok" -eq 1 ] \
              && [ "$home_ok" -ge 1 ] \
              && [ "$bundle_ok" -ge 1 ] \
              && [ "$sitemap_ok" -ge 1 ]; then
              echo 'Current production SHA acceptance passed.'
              exit 0
            fi
            sleep 10
          done
          echo 'Current production SHA acceptance timed out.'
          exit 1

      - name: 标记生产 SHA 已验收
        if: ${{ success() && env.SKIP_DEPLOY != 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$DEPLOY_SHA" \
            -d '{"state":"success","context":"trrb/production-accepted","description":"Production SHA deployed and accepted"}' >/dev/null

      - name: 同一 SHA 已部署时跳过
        if: env.SKIP_DEPLOY == 'true'
        run: echo "Production SHA $DEPLOY_SHA was already deployed and accepted; duplicate run skipped."
