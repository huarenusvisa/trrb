# Production deployment recovery + crawlability guard
name: 生产部署恢复与SEO抓取验收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/round16-node9-production-deploy-recovery.yml'
      - '.github/workflows/round16-node4-home-legal-production.yml'
      - '.github/workflows/round13-publish-seo-sync.yml'
      - '_redirects'
      - '_headers'
      - 'robots.txt'
      - 'netlify.toml'
      - 'netlify/edge-functions/**'
      - 'netlify/functions/public-home-bundle.js'
      - 'netlify/functions/admin-articles.js'
      - 'netlify/functions/admin-article-ai-publish-background.js'
      - 'netlify/functions/_shared/article-ai.js'
      - 'admin/admin-publisher-v2.js'
      - 'article.html'
      - 'article-route-runtime.js'
      - 'article-live-neighbors.js'
      - 'article-v31.js'
      - 'articles-home-index.js'
      - 'articles-home.js'
      - 'articles-home-live-fix.js'
      - 'category-runtime-v3.js'
      - 'homepage-refresh-guard.js'
      - 'homepage-immigration-hub.js'
      - 'homepage-focus-v34.js'
      - 'topic-focus.js'
      - 'ice-home-unify.js'
      - 'immigration-entry.js'
      - 'listing.html'
      - 'listing.js'
      - 'listing-seo.js'
      - 'immigrate/immigrate.js'
      - 'immigrate/center.html'
      - 'immigrate/center.js'
      - 'immigrate/center-seo.js'
      - 'immigrate/knowledge-article-filter.js'
      - 'config/immigration-knowledge.js'
      - 'jobs/index.html'
      - 'trump/index.html'
      - 'topic/trump/trump.js'
      - 'topic/ice/featured-video.js'
      - 'scripts/generate-sitemaps.mjs'
      - 'scripts/split-sitemap-index.mjs'
      - 'scripts/inject-static-news-links.mjs'
      - 'scripts/ensure-sitemap-articles.mjs'
      - 'scripts/upgrade-article-urls.mjs'
      - 'scripts/generate-feed.mjs'
      - 'scripts/finalize-redirects.mjs'
      - 'scripts/optimize-homepage-performance.mjs'
      - 'scripts/validate-site.mjs'
      - 'scripts/seo-integrity-audit.mjs'
      - 'scripts/google-indexing-acceptance.mjs'
      - 'scripts/production-seo-diagnostic.mjs'
      - 'scripts/round14-node5-duplicate-thin-content-audit.mjs'
      - 'scripts/ice-breaking-news-index-audit.mjs'
      - 'scripts/round16-node4-home-legal-production.mjs'
      - 'scripts/submit-indexnow.mjs'
      - 'scripts/write-deploy-version.mjs'
      - 'index.html'
      - 'topic/ice/live-v6.html'
      - 'topic/ice/index.html'
      - 'topic/ice/ice.js'

permissions:
  contents: read

concurrency:
  group: trrb-production-deploy-main
  cancel-in-progress: true

jobs:
  recover-production-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 合并连续提交并锁定最新main版本
        shell: bash
        run: |
          set -euo pipefail
          sleep 30
          git fetch origin main
          git reset --hard origin/main
          DEPLOY_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$DEPLOY_SHA" > deploy-version.txt
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "deploying_main=$DEPLOY_SHA"

      - name: 确定性发布Netlify生产站
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NETLIFY_AUTH_TOKEN:-}" ] && [ -n "${NETLIFY_SITE_ID:-}" ]; then
            echo 'Using deterministic Netlify CLI production deploy for the configured site ID.'
            npx --yes netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
            exit 0
          fi
          if [ -n "${NETLIFY_BUILD_HOOK:-}" ]; then
            echo 'CLI credentials are unavailable; falling back to configured Netlify build hook.'
            echo 'Forcing main branch and a clean build; the exact-SHA check below must still prove the target is trrb.net.'
            if [[ "$NETLIFY_BUILD_HOOK" == *\?* ]]; then
              hook_url="${NETLIFY_BUILD_HOOK}&trigger_branch=main&clear_cache=true"
            else
              hook_url="${NETLIFY_BUILD_HOOK}?trigger_branch=main&clear_cache=true"
            fi
            curl -fsS -X POST "$hook_url" >/tmp/netlify-hook-response.txt
            cat /tmp/netlify-hook-response.txt || true
            exit 0
          fi
          echo 'No Netlify deployment credential or build hook is configured in GitHub Actions secrets.'
          exit 2

      - name: 验收生产Commit、首页、栏目、主机归一、ICE、Sitemap和旧档案
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SHA:-}" || { echo 'DEPLOY_SHA missing'; exit 2; }
          for attempt in $(seq 1 120); do
            stamp=$(date +%s)
            live_sha=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/deploy-version.txt?seo-deploy=$stamp" 2>/dev/null | tr -d '\r\n[:space:]' || true)
            home=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/?seo-deploy=$stamp" || true)
            category=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/important-news?seo-deploy=$stamp" || true)
            asylum=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/asylum?seo-deploy=$stamp" || true)
            ice=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/ice?seo-deploy=$stamp" || true)
            sitemap=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/sitemap.xml?seo-deploy=$stamp" || true)
            news=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/news-sitemap.xml?seo-deploy=$stamp" || true)
            bundle=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/.netlify/functions/public-home-bundle?seo-deploy=$stamp" || true)
            immigration_legacy=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/listing.html?category=%E7%A7%BB%E6%B0%91%E7%BE%8E%E5%9B%BD&seo-deploy=$stamp" || true)
            jobs_html=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/jobs/?seo-deploy=$stamp" || true)
            finance_html=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/finance/?seo-deploy=$stamp" || true)

            sitemap_headers=$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/sitemap.xml?seo-deploy=$stamp" | tr -d '\r' || true)
            news_headers=$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/news-sitemap.xml?seo-deploy=$stamp" | tr -d '\r' || true)
            category_headers=$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/important-news?seo-deploy=$stamp" | tr -d '\r' || true)
            legacy_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/article.html?id=wp-117123&seo-deploy=$stamp" | tr -d '\r' || true)
            archive_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/article.html?id=117382&seo-deploy=$stamp" | tr -d '\r' || true)
            invalid_uuid_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/article.html?id=00000000-0000-4000-8000-000000000000&seo-deploy=$stamp" | tr -d '\r' || true)
            www_category_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://www.trrb.net/important-news?seo-deploy=$stamp" | tr -d '\r' || true)
            www_sitemap_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://www.trrb.net/sitemap.xml?seo-deploy=$stamp" | tr -d '\r' || true)
            index_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/index.html?seo-deploy=$stamp" | tr -d '\r' || true)
            search_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/listing.html?q=seo-check&seo-deploy=$stamp" | tr -d '\r' || true)
            jobs_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/jobs/?seo-deploy=$stamp" | tr -d '\r' || true)
            finance_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/finance/?seo-deploy=$stamp" | tr -d '\r' || true)
            people_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/people/?seo-deploy=$stamp" | tr -d '\r' || true)
            ice_topic_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/topic/ice/?seo-deploy=$stamp" | tr -d '\r' || true)
            ice_raw_headers=$(curl -sSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/topic/ice/live-v6.html?seo-deploy=$stamp" | tr -d '\r' || true)

            deploy_sha_ok=0
            [ "$live_sha" = "$DEPLOY_SHA" ] && deploy_sha_ok=1
            home_marker=$(printf '%s' "$home" | grep -c 'data-seo-static-snapshot="build"' || true)
            home_article_links=$(printf '%s' "$home" | grep -Eo 'href="/(ice|trump|important-news|hot-headlines|us-politics|us-crime|china-officialdom|immigration|asylum|deport|news)/[^"]+' | wc -l | tr -d ' ')
            home_single_guard=$(printf '%s' "$home" | grep -c 'homepage-refresh-guard.js?v=20260819-bundle-supplements-2' || true)
            home_canonical=$(printf '%s' "$home" | grep -c '<link rel="canonical" href="https://trrb.net/"' || true)
            home_robots=$(printf '%s' "$home" | grep -ci 'name="robots" content="index,follow' || true)
            home_og=$(printf '%s' "$home" | grep -c 'property="og:url" content="https://trrb.net/"' || true)
            finance_card=$(printf '%s' "$home" | grep -c 'href="/finance/"' || true)
            bundle_ok=$(printf '%s' "$bundle" | grep -c '"mode":"homepage"' || true)
            category_marker=$(printf '%s' "$category" | grep -c 'data-seo-category-snapshot="edge"' || true)
            category_article_links=$(printf '%s' "$category" | grep -Eo 'href="/important-news/[^"]+' | wc -l | tr -d ' ')
            category_header=$(printf '%s' "$category_headers" | grep -ci '^x-trrb-category-prerender: category-edge-v1' || true)
            asylum_marker=$(printf '%s' "$asylum" | grep -c 'data-seo-category-snapshot="edge"' || true)
            asylum_article_links=$(printf '%s' "$asylum" | grep -Eo 'href="/asylum/[^"]+' | wc -l | tr -d ' ')
            ice_marker=$(printf '%s' "$ice" | grep -c 'data-seo-static-snapshot="build"' || true)
            ice_article_links=$(printf '%s' "$ice" | grep -Eo 'href="/ice/[^"]+' | grep -v 'href="/ice/news' | wc -l | tr -d ' ')
            legacy_sitemap=$(printf '%s\n%s' "$sitemap" "$news" | grep -c 'article.html?id=' || true)
            sitemap_v5=$(printf '%s' "$sitemap_headers" | grep -ci '^x-trrb-sitemap: live-supabase-v5-static-authority-aligned' || true)
            sitemap_knowledge_header=$(printf '%s' "$sitemap_headers" | sed -n 's/^x-trrb-sitemap-immigration-knowledge:[[:space:]]*//Ip' | tr -d '[:space:]' | head -1)
            sitemap_knowledge_header=${sitemap_knowledge_header:-0}
            sitemap_legal=$(printf '%s' "$sitemap" | grep -c '<loc>https://trrb.net/legal/</loc>' || true)
            sitemap_immigration_category=$(printf '%s' "$sitemap" | grep -c '<loc>https://trrb.net/immigrate/center?path=study</loc>' || true)
            sitemap_immigration_topic=$(printf '%s' "$sitemap" | grep -c '<loc>https://trrb.net/immigrate/center?path=study&amp;topic=f1</loc>' || true)
            sitemap_jobs=$(printf '%s' "$sitemap" | grep -Ec '<loc>https://trrb.net/jobs(?:/|\?|<)' || true)
            sitemap_finance=$(printf '%s' "$sitemap" | grep -Ec '<loc>https://trrb.net/finance(?:/|\?|<)' || true)
            sitemap_people=$(printf '%s' "$sitemap" | grep -Ec '<loc>https://trrb.net/people(?:/|\?|<)' || true)
            news_v5=$(printf '%s' "$news_headers" | grep -ci '^x-trrb-news-sitemap: live-supabase-v5-latest1000-topic-safe-ice-safe-dedupe' || true)
            legacy_410=$(printf '%s' "$legacy_headers" | grep -c '^HTTP/.* 410' || true)
            legacy_noindex=$(printf '%s' "$legacy_headers" | grep -ci '^x-robots-tag:.*noindex' || true)
            archive_200=$(printf '%s' "$archive_headers" | grep -c '^HTTP/.* 200' || true)
            invalid_uuid_404=$(printf '%s' "$invalid_uuid_headers" | grep -c '^HTTP/.* 404' || true)
            invalid_uuid_noindex=$(printf '%s' "$invalid_uuid_headers" | grep -ci '^x-robots-tag:.*noindex' || true)

            www_category_301=$(printf '%s' "$www_category_headers" | grep -c '^HTTP/.* 301' || true)
            www_category_location=$(printf '%s' "$www_category_headers" | grep -ci '^location: https://trrb.net/important-news' || true)
            www_category_marker=$(printf '%s' "$www_category_headers" | grep -ci '^x-trrb-host-canonical: apex-https' || true)
            www_sitemap_301=$(printf '%s' "$www_sitemap_headers" | grep -c '^HTTP/.* 301' || true)
            www_sitemap_location=$(printf '%s' "$www_sitemap_headers" | grep -ci '^location: https://trrb.net/sitemap.xml' || true)
            www_sitemap_marker=$(printf '%s' "$www_sitemap_headers" | grep -ci '^x-trrb-host-canonical: apex-https' || true)
            index_301=$(printf '%s' "$index_headers" | grep -c '^HTTP/.* 301' || true)
            immigration_canonical=$(printf '%s' "$immigration_legacy" | grep -c '<link rel="canonical" href="https://trrb.net/immigration"' || true)
            immigration_wrong_knowledge=$(printf '%s' "$immigration_legacy" | grep -c '<link rel="canonical" href="https://trrb.net/immigrate/' || true)
            search_noindex=$(printf '%s' "$search_headers" | grep -ci '^x-robots-tag:.*noindex' || true)

            jobs_noindex_header=$(printf '%s' "$jobs_headers" | grep -ci '^x-robots-tag:.*noindex' || true)
            jobs_noindex_meta=$(printf '%s' "$jobs_html" | grep -ci 'name="robots" content="noindex' || true)
            jobs_prelaunch=$(printf '%s' "$jobs_html" | grep -c '上线准备中' || true)
            finance_noindex_header=$(printf '%s' "$finance_headers" | grep -ci '^x-robots-tag:.*noindex' || true)
            finance_noindex_meta=$(printf '%s' "$finance_html" | grep -ci 'name="robots" content="noindex' || true)
            people_410=$(printf '%s' "$people_headers" | grep -c '^HTTP/.* 410' || true)
            people_noindex=$(printf '%s' "$people_headers" | grep -ci '^x-robots-tag:.*noindex' || true)
            people_marker=$(printf '%s' "$people_headers" | grep -ci '^x-trrb-retired-product: people-r1-gone-v1' || true)
            ice_topic_301=$(printf '%s' "$ice_topic_headers" | grep -c '^HTTP/.* 301' || true)
            ice_topic_location=$(printf '%s' "$ice_topic_headers" | grep -ci '^location: https://trrb.net/ice' || true)
            ice_topic_marker=$(printf '%s' "$ice_topic_headers" | grep -ci '^x-trrb-ice-canonical: legacy-topic-to-ice-v1' || true)
            ice_raw_301=$(printf '%s' "$ice_raw_headers" | grep -c '^HTTP/.* 301' || true)
            ice_raw_location=$(printf '%s' "$ice_raw_headers" | grep -ci '^location: https://trrb.net/ice' || true)

            first_ice_url=$(printf '%s' "$news" | grep -Eo '<loc>https://trrb.net/ice/[^<]+' | head -1 | sed 's#<loc>##' || true)
            ice_article_ok=0
            pretty_no_archive_loader=0
            if [ -n "$first_ice_url" ]; then
              article_headers=$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' "$first_ice_url?seo-deploy=$stamp" | tr -d '\r' || true)
              article_html=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' "$first_ice_url?seo-deploy=$stamp" || true)
              if printf '%s' "$article_html" | grep -q 'data-trrb-edge-schema' && ! printf '%s\n%s' "$article_headers" "$article_html" | grep -qi 'noindex'; then
                ice_article_ok=1
              fi
              if ! printf '%s' "$article_html" | grep -q 'articles-home-index.js' && ! printf '%s' "$article_html" | grep -Eq '<script[^>]+src="/article\.js'; then
                pretty_no_archive_loader=1
              fi
            fi

            echo "attempt=$attempt deploy_sha=$deploy_sha_ok live_sha=${live_sha:-missing} expected=$DEPLOY_SHA home=$home_marker/$home_article_links/$home_single_guard/seo:$home_canonical/$home_robots/$home_og/finance:$finance_card bundle=$bundle_ok category=$category_marker/$category_article_links/$category_header asylum=$asylum_marker/$asylum_article_links ice=$ice_marker/$ice_article_links host_www_category=$www_category_301/$www_category_location/$www_category_marker host_www_sitemap=$www_sitemap_301/$www_sitemap_location/$www_sitemap_marker index301=$index_301 immigration=$immigration_canonical/wrong:$immigration_wrong_knowledge searchNoindex=$search_noindex legacy_sitemap=$legacy_sitemap legacy410=$legacy_410/$legacy_noindex archive200=$archive_200 invalidUUID=$invalid_uuid_404/$invalid_uuid_noindex sitemap_v5=$sitemap_v5 knowledge=$sitemap_knowledge_header legal=$sitemap_legal immigrationKnowledge=$sitemap_immigration_category/$sitemap_immigration_topic forbiddenSitemap=jobs:$sitemap_jobs/finance:$sitemap_finance/people:$sitemap_people jobsPrelaunch=$jobs_noindex_header/$jobs_noindex_meta/$jobs_prelaunch financeNoindex=$finance_noindex_header/$finance_noindex_meta peopleGone=$people_410/$people_noindex/$people_marker iceCanonical=$ice_topic_301/$ice_topic_location/$ice_topic_marker/$ice_raw_301/$ice_raw_location news_v5=$news_v5 ice_article_ok=$ice_article_ok pretty_clean=$pretty_no_archive_loader"

            if [ "$deploy_sha_ok" -eq 1 ] \
              && [ "$home_marker" -ge 1 ] && [ "$home_article_links" -ge 10 ] && [ "$home_single_guard" -ge 1 ] \
              && [ "$home_canonical" -ge 1 ] && [ "$home_robots" -ge 1 ] && [ "$home_og" -ge 1 ] && [ "$finance_card" -ge 1 ] \
              && [ "$bundle_ok" -ge 1 ] && [ "$category_marker" -ge 1 ] && [ "$category_article_links" -ge 10 ] && [ "$category_header" -ge 1 ] \
              && [ "$asylum_marker" -ge 1 ] && [ "$asylum_article_links" -ge 3 ] && [ "$ice_marker" -ge 1 ] && [ "$ice_article_links" -ge 3 ] \
              && [ "$www_category_301" -ge 1 ] && [ "$www_category_location" -ge 1 ] && [ "$www_category_marker" -ge 1 ] \
              && [ "$www_sitemap_301" -ge 1 ] && [ "$www_sitemap_location" -ge 1 ] && [ "$www_sitemap_marker" -ge 1 ] && [ "$index_301" -ge 1 ] \
              && [ "$immigration_canonical" -ge 1 ] && [ "$immigration_wrong_knowledge" -eq 0 ] && [ "$search_noindex" -ge 1 ] \
              && [ "$legacy_sitemap" -eq 0 ] && [ "$legacy_410" -ge 1 ] && [ "$legacy_noindex" -ge 1 ] && [ "$archive_200" -ge 1 ] \
              && [ "$invalid_uuid_404" -ge 1 ] && [ "$invalid_uuid_noindex" -ge 1 ] && [ "$sitemap_v5" -ge 1 ] && [ "$sitemap_knowledge_header" -ge 62 ] \
              && [ "$sitemap_legal" -ge 1 ] && [ "$sitemap_immigration_category" -ge 1 ] && [ "$sitemap_immigration_topic" -ge 1 ] \
              && [ "$sitemap_jobs" -eq 0 ] && [ "$sitemap_finance" -eq 0 ] && [ "$sitemap_people" -eq 0 ] && [ "$news_v5" -ge 1 ] \
              && [ "$jobs_noindex_header" -ge 1 ] && [ "$jobs_noindex_meta" -ge 1 ] && [ "$jobs_prelaunch" -ge 1 ] \
              && [ "$finance_noindex_header" -ge 1 ] && [ "$finance_noindex_meta" -ge 1 ] \
              && [ "$people_410" -ge 1 ] && [ "$people_noindex" -ge 1 ] && [ "$people_marker" -ge 1 ] \
              && [ "$ice_topic_301" -ge 1 ] && [ "$ice_topic_location" -ge 1 ] && [ "$ice_topic_marker" -ge 1 ] \
              && [ "$ice_raw_301" -ge 1 ] && [ "$ice_raw_location" -ge 1 ] \
              && [ "$ice_article_ok" -eq 1 ] && [ "$pretty_no_archive_loader" -eq 1 ]; then
              echo 'PRODUCTION EXACT-SHA + SITEMAP V5 STATIC AUTHORITY + PRELAUNCH/RETIRED NOINDEX + ICE CANONICAL + NEWS V5 + ARTICLE INDEXABILITY PASS'
              exit 0
            fi
            sleep 10
          done

          echo 'Production did not publish the exact current main commit with the required crawlable SEO chain in time.'
          exit 1
