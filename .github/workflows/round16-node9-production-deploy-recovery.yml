# Single production deploy gate for the current TRRB product.
name: 生产部署与当前产品验收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '_headers'
      - '_redirects'
      - 'netlify.toml'
      - '*.js'
      - '*.css'
      - 'jobs/**'
      - 'finance/**'
      - 'immigrate/**'
      - 'immigration-judge-approval-rate/**'
      - 'trump/**'
      - 'topic/**'
      - 'netlify/functions/**'
      - 'netlify/edge-functions/**'
      - 'scripts/generate-sitemaps.mjs'
      - 'scripts/split-sitemap-index.mjs'
      - '.github/workflows/round16-node9-production-deploy-recovery.yml'

permissions:
  contents: read

concurrency:
  group: trrb-production-deploy-main
  cancel-in-progress: true

jobs:
  deploy-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 锁定最新 main
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          git fetch origin main
          git reset --hard origin/main
          DEPLOY_SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "deploying_main=$DEPLOY_SHA"

      - name: 发布 Netlify Production
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NETLIFY_AUTH_TOKEN:-}" ] && [ -n "${NETLIFY_SITE_ID:-}" ]; then
            npx --yes netlify-cli@latest deploy --build --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
          elif [ -n "${NETLIFY_BUILD_HOOK:-}" ]; then
            if [[ "$NETLIFY_BUILD_HOOK" == *\?* ]]; then
              hook_url="${NETLIFY_BUILD_HOOK}&trigger_branch=main&clear_cache=true"
            else
              hook_url="${NETLIFY_BUILD_HOOK}?trigger_branch=main&clear_cache=true"
            fi
            curl -fsS -X POST "$hook_url"
          else
            echo 'No Netlify deployment credential/build hook configured.'
            exit 2
          fi

      - name: 验收最新 SHA、首页、招聘和核心 API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            stamp=$(date +%s)
            live_sha=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/deploy-version.txt?v=$stamp" 2>/dev/null | tr -d '\r\n[:space:]' || true)
            home=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/?v=$stamp" || true)
            jobs=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/jobs/?v=$stamp" || true)
            jobs_api=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/.netlify/functions/public-home-jobs?limit=6&v=$stamp" || true)
            bundle=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/.netlify/functions/public-home-bundle?v=$stamp" || true)
            headers=$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/jobs/?v=$stamp" | tr -d '\r' || true)

            sha_ok=0; [ "$live_sha" = "$DEPLOY_SHA" ] && sha_ok=1
            home_jobs=$(printf '%s' "$home" | grep -c '招聘求职' || true)
            false_empty=$(printf '%s' "$home" | grep -c '当前暂无重点新闻' || true)
            jobs_index=$(printf '%s' "$jobs" | grep -ci 'name="robots" content="index,follow' || true)
            jobs_prelaunch=$(printf '%s' "$jobs" | grep -c '上线准备中' || true)
            jobs_api_ok=$(printf '%s' "$jobs_api" | grep -Ec '"jobs"[[:space:]]*:[[:space:]]*\[[^]]*\{' || true)
            bundle_ok=$(printf '%s' "$bundle" | grep -c '"mode":"homepage"' || true)
            geo_policy=$(printf '%s' "$headers" | grep -ci '^permissions-policy:.*geolocation=(self)' || true)

            echo "attempt=$attempt sha=$sha_ok homeJobs=$home_jobs falseEmpty=$false_empty jobsIndex=$jobs_index jobsPrelaunch=$jobs_prelaunch jobsApi=$jobs_api_ok bundle=$bundle_ok geo=$geo_policy"
            if [ "$sha_ok" -eq 1 ] \
              && [ "$home_jobs" -ge 1 ] && [ "$false_empty" -eq 0 ] \
              && [ "$jobs_index" -ge 1 ] && [ "$jobs_prelaunch" -eq 0 ] \
              && [ "$jobs_api_ok" -ge 1 ] && [ "$bundle_ok" -ge 1 ] \
              && [ "$geo_policy" -ge 1 ]; then
              echo 'Production acceptance passed.'
              exit 0
            fi
            sleep 10
          done
          echo 'Production acceptance timed out.'
          exit 1
