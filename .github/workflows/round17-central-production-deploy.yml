name: Round 17 - Central Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - 'data/legal/**'
      - 'sitemap-legal.xml'
      - 'robots.txt'
      - 'scripts/round17-node*.mjs'
      - 'docs/ROUND17-LEGAL-KNOWLEDGE-SEARCH-AND-RELIABILITY.md'
      - 'config/immigration-knowledge.js'
      - 'immigrate/center.html'
      - 'immigrate/center.js'
      - 'immigrate/center-seo.js'
      - 'immigrate/center.css'
      - 'immigrate/study-knowledge-content.css'
      - 'immigrate/*-knowledge-content.js'
      - 'immigrate/change-status-module.js'
      - 'immigrate/citizenship-module.js'
      - 'netlify/functions/public-category-page.js'
      - 'scripts/split-sitemap-index.mjs'
      - '.github/workflows/round17-node*.yml'
      - '.github/workflows/round17-central-production-deploy.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: trrb-round17-central-production-dispatch
  cancel-in-progress: true

jobs:
  dispatch-latest-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the single exact-SHA production deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          code=$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/round16-node9-production-deploy-recovery.yml/dispatches" \
            -d '{"ref":"main"}')
          cat /tmp/dispatch-response.txt || true
          test "$code" = "204" || { echo "Production workflow dispatch failed: HTTP $code"; exit 1; }
          echo 'Round17 changes handed to the single exact-SHA production deploy gate.'
