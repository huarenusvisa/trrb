name: Round 17 Node 10 - Final Production Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - 'data/legal/**'
      - 'sitemap-legal.xml'
      - 'robots.txt'
      - 'index.html'
      - 'homepage-refresh-guard.js'
      - 'articles-home-live-fix.js'
      - 'scripts/round17-node*.mjs'
      - 'docs/ROUND17-LEGAL-KNOWLEDGE-SEARCH-AND-RELIABILITY.md'
      - '.github/workflows/round17-node10-final-production-audit.yml'

permissions:
  contents: read

jobs:
  final-production-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate final production audit syntax
        run: |
          node --check scripts/round17-node10-final-production-audit.mjs
          node --check scripts/round17-node6-sync-analysis-version.mjs
          node --check homepage-refresh-guard.js
          node --check articles-home-live-fix.js
      - name: Re-verify Round 17 nodes 1-9 at code/data level
        shell: bash
        run: |
          set -euo pipefail
          node scripts/round17-node1-search-relevance-audit.mjs
          node scripts/round17-node2-multifilter-url-audit.mjs
          node scripts/round17-node3-related-authorities-audit.mjs
          node scripts/round17-node4-metadata-display-audit.mjs
          node scripts/round17-node5-legal-diff-dedup-audit.mjs data/legal/unified-legal-authorities-latest.json data/legal/unified-legal-authorities-latest.json /tmp/round17-node5-final.json
          node scripts/round17-node6-ai-coverage-grounding-audit.mjs
          node scripts/round17-node7-mobile-a11y-stability-audit.mjs
          node scripts/round17-node8-production-resilience-audit.mjs
          node scripts/round17-node9-seo-index-internal-links-audit.mjs
      - name: Trigger final production deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_BUILD_HOOK:-}" || { echo 'NETLIFY_BUILD_HOOK is not configured'; exit 2; }
          curl -fsS -X POST "$NETLIFY_BUILD_HOOK" >/tmp/netlify-round17-node10.txt
      - name: Re-verify Round 17 nodes 1-9 on production and close node 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/round17-production
          for attempt in $(seq 1 90); do
            stamp=$(date +%s)
            ok=1
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/data/legal/unified-legal-authorities-latest.json?round17node10=$stamp" -o /tmp/round17-production/db.json || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/data/legal/legal-ai-analysis-latest.json?round17node10=$stamp" -o /tmp/round17-production/ai.json || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/legal/?round17node10=$stamp" -o /tmp/round17-production/index.html || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/legal/detail.html?round17node10=$stamp" -o /tmp/round17-production/detail.html || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/legal/legal-app.js?round17node10=$stamp" -o /tmp/round17-production/app.js || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/legal/detail.js?round17node10=$stamp" -o /tmp/round17-production/detail.js || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/legal/legal.css?round17node10=$stamp" -o /tmp/round17-production/legal.css || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/sitemap-legal.xml?round17node10=$stamp" -o /tmp/round17-production/sitemap.xml || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/robots.txt?round17node10=$stamp" -o /tmp/round17-production/robots.txt || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/?round17node10=$stamp" -o /tmp/round17-production/home-index.html || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/homepage-refresh-guard.js?round17node10=$stamp" -o /tmp/round17-production/homepage-refresh-guard.js || ok=0
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/articles-home-live-fix.js?round17node10=$stamp" -o /tmp/round17-production/articles-home-live-fix.js || ok=0
            if [ "$ok" = 1 ] && node scripts/round17-node10-final-production-audit.mjs /tmp/round17-production; then
              exit 0
            fi
            echo "Round 17 final production audit attempt $attempt did not pass; retrying."
            sleep 10
          done
          echo 'ROUND 17 FINAL PRODUCTION AUDIT: FAIL'
          exit 1

# Strict restart final: requires current 603/603 Chinese coverage, zero placeholders and homepage 4-day live-only published_at ordering.
