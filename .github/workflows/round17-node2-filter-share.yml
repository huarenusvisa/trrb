name: Round 17 Node 2 - Legal Filters and Share URL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legal/legal-app.js'
      - 'legal/index.html'
      - 'data/legal/unified-legal-authorities-latest.json'
      - 'scripts/round17-node2-filter-share-audit.mjs'
      - 'docs/ROUND17-LEGAL-KNOWLEDGE-SEARCH-AND-RELIABILITY.md'
      - '.github/workflows/round17-node2-filter-share.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Round 17 node 2
        run: node scripts/round17-node2-filter-share-audit.mjs

# Strict restart revalidation after node 1 passed against current 603/603 legal dataset: 2026-08-17T02:26Z.
