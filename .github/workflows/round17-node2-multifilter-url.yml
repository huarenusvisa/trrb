name: Round 17 Node 2 - Multi-filter Shareable URL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legal/index.html'
      - 'legal/legal-app.js'
      - 'scripts/round17-node2-multifilter-url-audit.mjs'
      - 'docs/ROUND17-LEGAL-KNOWLEDGE-SEARCH-AND-RELIABILITY.md'
      - '.github/workflows/round17-node2-multifilter-url.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit Round 17 node 2
        run: node scripts/round17-node2-multifilter-url-audit.mjs
