name: Round 17 Node 3 - Related Authorities Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Re-verify nodes 1-3 locally
        run: |
          node scripts/round17-node1-search-relevance-audit.mjs
          node scripts/round17-node2-multifilter-url-audit.mjs
          node scripts/round17-node3-related-authorities-audit.mjs
      - name: Trigger Netlify only for manual node run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_BUILD_HOOK:-}" || { echo 'NETLIFY_BUILD_HOOK is not configured'; exit 2; }
          if [[ "$NETLIFY_BUILD_HOOK" == *\?* ]]; then
            hook_url="${NETLIFY_BUILD_HOOK}&trigger_branch=main&clear_cache=true&trigger_title=TRRB+Round17+node3+manual"
          else
            hook_url="${NETLIFY_BUILD_HOOK}?trigger_branch=main&clear_cache=true&trigger_title=TRRB+Round17+node3+manual"
          fi
          curl -fsS -X POST "$hook_url" >/tmp/netlify-hook-response.txt
      - name: Verify nodes 1-3 on production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            stamp=$(date +%s)
            index=$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://trrb.net/legal/?round17=$stamp" || true)
            app=$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://trrb.net/legal/legal-app.js?round17=$stamp" || true)
            detail=$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://trrb.net/legal/detail.html?round17=$stamp" || true)
            detailjs=$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://trrb.net/legal/detail.js?round17=$stamp" || true)
            node1=0; node2=0; node3=0
            printf '%s' "$app" | grep -q 'relevanceScore' && printf '%s' "$app" | grep -q 'analysisSearchFields' && node1=1 || true
            printf '%s' "$index" | grep -q 'legal-from' && printf '%s' "$index" | grep -q 'legal-sort' && printf '%s' "$app" | grep -q "params.get('from')" && node2=1 || true
            printf '%s' "$detail" | grep -q 'detail-related-list' && printf '%s' "$detailjs" | grep -q 'relatedRecords' && printf '%s' "$detailjs" | grep -q 'renderRelated(r,records)' && node3=1 || true
            if [ "$node1" = 1 ] && [ "$node2" = 1 ] && [ "$node3" = 1 ]; then
              echo 'ROUND 17 NODE 1 PRODUCTION: PASS'
              echo 'ROUND 17 NODE 2 PRODUCTION: PASS'
              echo 'ROUND 17 NODE 3 PRODUCTION: PASS'
              exit 0
            fi
            sleep 10
          done
          echo 'Production did not expose required Round 17 node 1-3 assets.'
          exit 1

# Push deployment is centralized in round17-central-production-deploy.yml.
