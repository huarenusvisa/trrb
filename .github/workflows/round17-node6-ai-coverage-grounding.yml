name: Round 17 Node 6 - AI Coverage Grounding Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate node 6 audit and sync scripts
        run: |
          node --check scripts/round17-node6-ai-coverage-grounding-audit.mjs
          node --check scripts/round17-node6-sync-analysis-version.mjs
      - name: Audit repository AI coverage and grounding
        run: node scripts/round17-node6-ai-coverage-grounding-audit.mjs
      - name: Trigger Netlify only for manual node run
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NETLIFY_BUILD_HOOK:-}" || { echo 'NETLIFY_BUILD_HOOK is not configured'; exit 2; }
          if [[ "$NETLIFY_BUILD_HOOK" == *\?* ]]; then
            hook_url="${NETLIFY_BUILD_HOOK}&trigger_branch=main&clear_cache=true&trigger_title=TRRB+Round17+node6+manual"
          else
            hook_url="${NETLIFY_BUILD_HOOK}?trigger_branch=main&clear_cache=true&trigger_title=TRRB+Round17+node6+manual"
          fi
          curl -fsS -X POST "$hook_url" >/tmp/netlify-hook-response.txt
      - name: Wait for synchronized production and audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            stamp=$(date +%s)
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/data/legal/unified-legal-authorities-latest.json?round17node6=$stamp" -o /tmp/db.json || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/data/legal/legal-ai-analysis-latest.json?round17node6=$stamp" -o /tmp/ai.json || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/legal/legal-app.js?round17node6=$stamp" -o /tmp/app.js || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://trrb.net/legal/detail.js?round17node6=$stamp" -o /tmp/detail.js || true
            if node scripts/round17-node6-ai-coverage-grounding-audit.mjs /tmp/db.json /tmp/ai.json /tmp/app.js /tmp/detail.js /tmp/round17-node6-production.json; then
              echo 'ROUND 17 NODE 6 PRODUCTION: PASS'
              exit 0
            fi
            sleep 10
          done
          echo 'Production did not converge to synchronized AI grounding state.'
          exit 1

# Push deployment is centralized in round17-central-production-deploy.yml.
