name: Round 17 Node 6 - Safe Analysis Version Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify analysis versions without mutating legal content
        run: node scripts/round17-node6-sync-analysis-version.mjs

# This workflow intentionally has no write/commit step. A changed legal dataset
# requires re-grounding through the AI analysis pipeline; datasetVersion must
# never be rewritten merely to make stale analysis appear current.
