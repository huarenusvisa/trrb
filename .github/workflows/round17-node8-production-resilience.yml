name: Round 17 Node 8 - Production Resilience Loop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legal/legal-app.js'
      - 'legal/detail.js'
      - 'scripts/round17-node8-production-resilience-audit.mjs'
      - '.github/workflows/round17-node8-production-resilience.yml'

permissions:
  contents: read

jobs:
  monitor-recover-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit graceful degradation locally
        run: node scripts/round17-node8-production-resilience-audit.mjs
      - name: Monitor production and recover if unhealthy
        shell: bash
        run: |
          set -euo pipefail
          health() {
            stamp=$(date +%s)
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/legal/?round17node8=$stamp" -o /tmp/legal-index.html || return 1
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/legal/legal-app.js?round17node8=$stamp" -o /tmp/legal-app.js || return 1
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/legal/detail.js?round17node8=$stamp" -o /tmp/legal-detail.js || return 1
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/data/legal/unified-legal-authorities-latest.json?round17node8=$stamp" -o /tmp/legal-db.json || return 1
            grep -q 'id="legal-list"' /tmp/legal-index.html || return 1
            grep -q '数据库加载失败' /tmp/legal-app.js || return 1
            grep -q '暂时无法加载资料' /tmp/legal-detail.js || return 1
            node -e "const d=require('/tmp/legal-db.json');if(!d.datasetVersion||!(d.records||[]).length)process.exit(1)" || return 1
          }
          if health; then
            echo 'Production health monitor: healthy on first check.'
          else
            echo 'Production health monitor: unhealthy; invoking recovery deployment.'
            test -n "${NETLIFY_BUILD_HOOK:-}" || { echo 'Recovery hook unavailable'; exit 2; }
            curl -fsS -X POST "$NETLIFY_BUILD_HOOK" >/tmp/netlify-recovery.txt
            recovered=0
            for attempt in $(seq 1 90); do
              if health; then recovered=1; break; fi
              sleep 10
            done
            test "$recovered" = 1 || { echo 'Recovery verification failed.'; exit 1; }
          fi
          node scripts/round17-node8-production-resilience-audit.mjs /tmp/legal-app.js /tmp/legal-detail.js
          echo 'ROUND 17 NODE 8 PRODUCTION: PASS'

# Strict restart revalidation after nodes 1-7 passed current production: 2026-08-17T02:34Z.
