name: 全站SEO与404完整性检查

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "robots.txt"
      - "sitemap*.xml"
      - "news-sitemap.xml"
      - "feed.xml"
      - "netlify.toml"
      - "_redirects"
      - "scripts/finalize-redirects.mjs"
      - "scripts/seo-integrity-audit.mjs"
      - "scripts/seo-quality-contract.test.mjs"
      - "netlify/shared/article-indexability.mjs"
      - "netlify/edge-functions/article-prerender.ts"
      - "netlify/edge-functions/*sitemap*.ts"
      - "scripts/*indexability*.mjs"
      - "scripts/production-seo-diagnostic*.mjs"
      - "scripts/google-search-performance*.mjs"
      - "scripts/seo-live-page-policy*.mjs"
      - "scripts/admin-article-length.test.mjs"
      - "scripts/legacy-restore-short-article.test.mjs"
      - "scripts/generate-sitemaps.mjs"
      - "scripts/jobs-user-workflows.test.mjs"
      - "scripts/huarengongzuo-i18n.test.mjs"
      - "scripts/automation-control-contract.test.mjs"
      - "admin/automation-control.js"
      - "netlify/functions/automation-control.js"
      - ".github/workflows/operations-control-plane.yml"
      - ".github/workflows/ice-*.yml"
      - "huarengongzuo/i18n.js"
      - "supabase/migrations/*.sql"
      - "scripts/seo-search-engine-ops.mjs"
      - "scripts/generate-feed.mjs"
      - "netlify/edge-functions/feed-live.ts"
      - ".github/workflows/seo-search-engine-ops.yml"
      - "scripts/upgrade-article-urls.mjs"
      - "scripts/verify-pr-preview.mjs"
      - ".github/workflows/seo-integrity.yml"
      - ".github/workflows/legacy-archive-final-closure.yml"
      - "config/legacy-archive-final-closure-20260829.json"

permissions:
  contents: read

concurrency:
  group: trrb-seo-integrity
  cancel-in-progress: true

jobs:
  audit:
    # Heavy full-site checks wait until a PR is out of draft. Reusable
    # workflow_call executions are unaffected.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate current SEO assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/generate-sitemaps.mjs
          node scripts/clean-sitemap-against-database.mjs
          node scripts/finalize-redirects.mjs --redirects-only
          node scripts/generate-feed.mjs
          node scripts/upgrade-article-urls.mjs
      - name: Validate legacy archive category policy
        run: node scripts/legacy-category-policy.test.mjs
      - name: Verify short article indexing and search diagnostics
        run: >-
          node --experimental-strip-types --test
          scripts/article-indexability.test.mjs
          scripts/article-indexability-audits.test.mjs
          scripts/admin-article-length.test.mjs
          scripts/legacy-restore-short-article.test.mjs
          scripts/ice-original-posts.test.mjs
          scripts/production-seo-diagnostic.test.mjs
          scripts/google-search-performance.test.mjs
          scripts/seo-live-page-policy.test.mjs
      - name: Run production integrity validation
        run: node scripts/validate-site.mjs
      - name: Run SEO and internal 404 audit
        run: |
          node --experimental-strip-types --test scripts/news-editorial-support.test.mjs scripts/china-hot-editor.test.mjs scripts/news-budget.test.mjs scripts/news-priority.test.mjs scripts/news-editorial-policy.test.mjs scripts/china-person-registry.test.mjs scripts/china-hot-li-teacher-ingest.test.mjs scripts/china-context-research.test.mjs scripts/china-editorial-update.test.mjs scripts/ren-zhengfei-news.test.mjs scripts/article-editorial-policy.test.mjs scripts/ice-news-quality-gate.test.mjs scripts/official-content-routing.test.mjs scripts/ice-original-posts.test.mjs
          node scripts/ice-history-list.test.mjs
          node scripts/seo-quality-contract.test.mjs
          node scripts/jobs-google-seo.test.mjs
          node scripts/jobs-user-workflows.test.mjs
          node scripts/huarengongzuo-i18n.test.mjs
          node scripts/automation-control-contract.test.mjs
          node scripts/seo-integrity-audit.mjs
      - name: Verify Netlify deploy preview article routes
        if: github.event_name == 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PREVIEW_BASE: https://deploy-preview-${{ github.event.pull_request.number }}--trrb.netlify.app
        run: node scripts/verify-pr-preview.mjs
      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: seo-audit-report.json
          if-no-files-found: warn
          retention-days: 30
