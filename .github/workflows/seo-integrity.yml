name: 全站SEO与404完整性检查

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "robots.txt"
      - "sitemap*.xml"
      - "news-sitemap.xml"
      - "feed.xml"
      - "netlify.toml"
      - "_redirects"
      - "scripts/finalize-redirects.mjs"
      - "scripts/seo-integrity-audit.mjs"
      - "scripts/seo-quality-contract.test.mjs"
      - "scripts/seo-search-engine-ops.mjs"
      - "scripts/generate-feed.mjs"
      - "netlify/edge-functions/feed-live.ts"
      - ".github/workflows/seo-search-engine-ops.yml"
      - "scripts/upgrade-article-urls.mjs"
      - "scripts/verify-pr-preview.mjs"
      - ".github/workflows/seo-integrity.yml"
      - ".github/workflows/legacy-archive-final-closure.yml"
      - "config/legacy-archive-final-closure-20260829.json"

permissions:
  contents: read

concurrency:
  group: trrb-seo-integrity
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate current SEO assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/generate-sitemaps.mjs
          node scripts/clean-sitemap-against-database.mjs
          node scripts/finalize-redirects.mjs --redirects-only
          node scripts/generate-feed.mjs
          node scripts/upgrade-article-urls.mjs
      - name: Validate legacy archive category policy
        run: node scripts/legacy-category-policy.test.mjs
      - name: Run production integrity validation
        run: node scripts/validate-site.mjs
      - name: Run SEO and internal 404 audit
        run: |
          node scripts/seo-quality-contract.test.mjs
          node scripts/jobs-google-seo.test.mjs
          node scripts/seo-integrity-audit.mjs
      - name: Verify Netlify deploy preview article routes
        if: github.event_name == 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PREVIEW_BASE: https://deploy-preview-${{ github.event.pull_request.number }}--trrb.netlify.app
        run: node scripts/verify-pr-preview.mjs
      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: seo-audit-report.json
          if-no-files-found: warn
          retention-days: 30
