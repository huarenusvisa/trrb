# Robot safety verification rerun: 2026-09-02T22:00Z
# Manual verification rerun after Google Search Console permission: 2026-09-02
# Manual verification rerun after Bing API secret configuration: 2026-09-02
name: Google/Bing SEO每日提交与诊断

on:
  workflow_dispatch:
  schedule:
    # Search-engine submission is a daily batch. Urgent corrective runs remain
    # available manually without paying the cost on every main-branch change.
    - cron: '23 7 * * *'
  push:
    # Validate this SEO control workflow immediately when its own logic changes.
    # Ordinary product/code pushes still do not trigger a full search-engine run.
    branches: [main]
    paths:
      - '.github/workflows/seo-search-engine-ops.yml'

permissions:
  contents: read

concurrency:
  group: trrb-seo-search-engine-ops
  cancel-in-progress: true

jobs:
  automation-gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - id: controls
        env:
          SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/automation-gate.mjs
      - id: gate
        # Push/manual runs are corrective and must never be silently skipped. Only
        # scheduled runs respect the control-plane switches.
        run: echo "allowed=${{ github.event_name != 'schedule' || (steps.controls.outputs.global == 'true' && steps.controls.outputs.seo_search_engine == 'true') }}" >> "$GITHUB_OUTPUT"
  monitor:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Google API client
        run: npm install --no-save googleapis@144
      - name: Verify live production health
        shell: bash
        run: |
          set -euo pipefail
          # SEO must audit the site that search engines can actually crawl. The
          # latest Git commit may intentionally be a reports/** or .github/**
          # bookkeeping commit that Netlify correctly skips, so requiring the
          # exact GITHUB_SHA here would block SEO for a non-production change.
          for attempt in $(seq 1 12); do
            live="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/deploy-version.txt?run=${GITHUB_RUN_ID}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n[:space:]' || true)"
            if [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
              curl --fail --silent --show-error --max-time 20 https://trrb.net/ >/dev/null
              echo "Production is healthy at deployed commit $live"
              exit 0
            fi
            echo "Waiting for a healthy production marker: live=${live:-unavailable} attempt=$attempt/12"
            sleep 5
          done
          echo "Production health check failed: deploy-version marker is unavailable or invalid." >&2
          exit 1
      - name: Verify the quality-gated sitemap
        shell: bash
        run: |
          curl --fail --silent --show-error --head https://trrb.net/sitemap.xml \
            | tr -d '\r' \
            | grep -qi '^x-trrb-sitemap: live-supabase-v9-quality-budget-canonical$'
      - name: Push current URLs to Bing and Yandex through IndexNow
        env:
          INDEXNOW_FULL_SYNC: 'true'
          INDEXNOW_INCLUDE_RETIRED: 'true'
          INDEXNOW_FRESH_HOURS: '48'
          INDEXNOW_USE_LIVE_NEWS: 'true'
        run: node scripts/submit-indexnow.mjs
      - name: Run SEO search-engine operations
        env:
          SITE_ORIGIN: https://trrb.net
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL || 'sc-domain:trrb.net' }}
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          SEO_WRITE_MODE: 'true'
          # Missing Search Console authorization is a blocking robot failure.
          # Never report the SEO workflow green when Google submission did not run.
          SEO_REQUIRE_GOOGLE: 'true'
          # Bing credentials and submissions are also mandatory.
          SEO_REQUIRE_BING: 'true'
          SEO_LIVE_AUDIT_LIMIT: '120'
        run: node scripts/seo-search-engine-ops.mjs
      - name: Save SEO robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-search-engine-ops-report
          path: seo-search-engine-ops-report.json
          retention-days: 30


      - name: 写入 Google/Bing SEO 机器人站内通知
        if: failure()
        env:
          SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOMATION_CONTROL_KEY: seo_search_engine
          AUTOMATION_NOTIFICATION_TITLE: Google/Bing SEO机器人执行失败
        run: node scripts/automation-notify.mjs

