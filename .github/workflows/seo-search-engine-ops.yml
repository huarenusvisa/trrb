# Robot safety verification rerun: 2026-09-02T22:00Z
# Manual verification rerun after Google Search Console permission: 2026-09-02
# Manual verification rerun after Bing API secret configuration: 2026-09-02
name: 全站 Google/Bing SEO 自动机器人

on:
  workflow_call:
  workflow_dispatch:
  push:
    # Run immediately when the SEO robot or AsylumJudge indexing protection changes.
    branches: [main]
    paths:
      - '.github/workflows/seo-search-engine-ops.yml'
      - 'scripts/asylumjudge-live-seo-audit.mjs'
      - 'scripts/submit-asylumjudge-indexnow.mjs'
      - 'scripts/asylumjudge-indexing-hygiene.mjs'
      - 'scripts/build-asylumjudge-site.mjs'
      - 'scripts/build-asylumjudge-seo.mjs'
      - 'asylumjudge/app-i18n.js'
      - 'immigration-judge-approval-rate/china-dashboard-i18n.js'

permissions:
  contents: read

concurrency:
  group: trrb-seo-search-engine-ops
  cancel-in-progress: true

jobs:
  automation-gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - id: controls
        env:
          SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/automation-gate.mjs
      - id: gate
        # Scheduled and reusable runs require the complete SEO suite to remain enabled.
        run: echo "allowed=${{ github.event_name == 'workflow_dispatch' || (steps.controls.outputs.global == 'true' && steps.controls.outputs.seo_indexnow == 'true' && steps.controls.outputs.seo_search_engine == 'true' && steps.controls.outputs.monitor == 'true') }}" >> "$GITHUB_OUTPUT"

  trrb-monitor:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Google API client
        run: npm install --no-save googleapis@144
      - name: Verify live production health
        shell: bash
        run: |
          set -euo pipefail
          target="${GITHUB_SHA}"
          for attempt in $(seq 1 90); do
            live="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://trrb.net/deploy-version.txt?run=${GITHUB_RUN_ID}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n[:space:]' || true)"
            if [ "$live" = "$target" ]; then
              curl --fail --silent --show-error --max-time 20 https://trrb.net/ >/dev/null
              echo "Production is healthy at target commit $target"
              exit 0
            fi
            if [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
              git fetch --no-tags --depth=100 origin "$live" >/dev/null 2>&1 || true
              if git merge-base --is-ancestor "$target" "$live" 2>/dev/null; then
                curl --fail --silent --show-error --max-time 20 https://trrb.net/ >/dev/null
                echo "Production is healthy at descendant commit $live"
                exit 0
              fi
            fi
            echo "Waiting for production target-or-descendant: target=$target live=${live:-unavailable} attempt=$attempt/90"
            sleep 10
          done
          echo "Production did not deploy the target commit within 15 minutes." >&2
          exit 1
      - name: Verify the quality-gated sitemap
        shell: bash
        run: |
          set -euo pipefail
          xml="$(curl --fail --silent --show-error https://trrb.net/sitemap.xml)"
          grep -q '<sitemapindex' <<<"$xml"
          grep -q 'sitemap-articles-1.xml' <<<"$xml"
      - name: Push current TRRB URLs through IndexNow
        env:
          INDEXNOW_FULL_SYNC: 'false'
          INDEXNOW_INCLUDE_RETIRED: 'true'
          INDEXNOW_FRESH_HOURS: '48'
          INDEXNOW_USE_LIVE_NEWS: 'true'
        run: node scripts/submit-indexnow.mjs
      - name: Run TRRB search-engine operations
        env:
          SITE_ORIGIN: https://trrb.net
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL || 'sc-domain:trrb.net' }}
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          SEO_WRITE_MODE: 'true'
          SEO_REQUIRE_GOOGLE: 'true'
          SEO_REQUIRE_BING: 'true'
          SEO_LIVE_AUDIT_LIMIT: '120'
        run: node scripts/seo-search-engine-ops.mjs
      - name: Save TRRB SEO robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trrb-seo-search-engine-ops-report
          path: seo-search-engine-ops-report.json
          retention-days: 30
      - name: 写入 TRRB SEO 机器人站内通知
        if: failure()
        env:
          SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOMATION_CONTROL_KEY: seo_search_engine
          AUTOMATION_NOTIFICATION_TITLE: TRRB Google/Bing SEO机器人执行失败
        run: node scripts/automation-notify.mjs

  asylumjudge-monitor:
    needs: automation-gate
    if: ${{ needs.automation-gate.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and auto-normalize AsylumJudge SEO output
        run: node scripts/build-asylumjudge-site.mjs
      - name: Verify AsylumJudge canonical sitemap contract
        run: node scripts/asylumjudge-seo.test.mjs
      - name: Block multilingual duplicate-canonical regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('.netlify/asylumjudge-bundle/public/asylumjudge-indexing-hygiene.json', 'utf8'));
          const highCjk = report.high_cjk_page_count ?? report.high_cjk_pages?.length ?? 0;
          if (report.removed_untranslated_methodology_urls !== 9) {
            throw new Error(`Localized methodology crawl surfaces regressed: expected 9 removals, got ${report.removed_untranslated_methodology_urls}`);
          }
          if (!Number.isFinite(report.localized_pages) || report.localized_pages < 10000) {
            throw new Error(`Server-side localization regressed: ${report.localized_pages}`);
          }
          if (highCjk > 10) {
            throw new Error(`Multilingual duplicate-content guard failed: ${highCjk} non-Chinese pages exceed the CJK threshold`);
          }
          console.log(`AsylumJudge indexing guard passed: ${report.localized_pages} localized pages; ${highCjk} high-CJK warnings.`);
          NODE
      - name: Audit the live AsylumJudge site for canonical, noindex, redirects and 404s
        env:
          ASYLUMJUDGE_SITE_ORIGIN: https://asylumjudge.com
          ASYLUMJUDGE_SEO_SAMPLE_PER_SITEMAP: '8'
          ASYLUMJUDGE_SEO_CONCURRENCY: '4'
        run: node scripts/asylumjudge-live-seo-audit.mjs
      - name: Push live AsylumJudge canonical URLs through IndexNow
        run: node scripts/submit-asylumjudge-indexnow.mjs --live
      - name: Save AsylumJudge SEO robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asylumjudge-seo-robot-report
          path: |
            asylumjudge-live-seo-report.json
            .netlify/asylumjudge-bundle/public/asylumjudge-indexing-hygiene.json
          if-no-files-found: warn
          retention-days: 30
      - name: 写入 AsylumJudge SEO 机器人站内通知
        if: failure()
        env:
          SUPABASE_URL: https://fwiznbpsqkfgkvyznebz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTOMATION_CONTROL_KEY: seo_search_engine
          AUTOMATION_NOTIFICATION_TITLE: AsylumJudge SEO机器人执行失败
          AUTOMATION_NOTIFICATION_MESSAGE: 'AsylumJudge live canonical/noindex/redirect/404 or multilingual duplicate-content guard failed. Review the SEO robot artifact before the next deploy.'
        run: node scripts/automation-notify.mjs
