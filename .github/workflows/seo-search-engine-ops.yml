name: Google/Bing SEO每日提交与诊断

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
  push:
    branches:
      - main
    paths:
      - 'robots.txt'
      - 'sitemap.xml'
      - 'sitemap-*.xml'
      - 'news-sitemap.xml'
      - 'scripts/generate-sitemaps.mjs'
      - 'scripts/seo-search-engine-ops.mjs'
      - 'netlify/edge-functions/sitemap-live.ts'
      - 'netlify/edge-functions/news-sitemap-live.ts'
      - '.github/workflows/seo-search-engine-ops.yml'

permissions:
  contents: read

concurrency:
  group: trrb-seo-search-engine-ops
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Google API client
        run: npm install --no-save googleapis@144
      - name: Wait for the quality-gated sitemap deployment
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --head https://trrb.net/sitemap.xml \
              | tr -d '\r' \
              | grep -qi '^x-trrb-sitemap: live-supabase-v9-quality-budget-canonical$'; then
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for the production sitemap quality gate.' >&2
          exit 1
      - name: Run SEO search-engine operations
        env:
          SITE_ORIGIN: https://trrb.net
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL || 'sc-domain:trrb.net' }}
          GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          SEO_WRITE_MODE: 'true'
          SEO_REQUIRE_GOOGLE: 'true'
        run: node scripts/seo-search-engine-ops.mjs
      - name: Save SEO robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-search-engine-ops-report
          path: seo-search-engine-ops-report.json
          retention-days: 30
