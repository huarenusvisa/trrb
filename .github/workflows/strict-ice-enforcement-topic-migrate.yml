name: ICE严格分类数据库迁移

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20260822053200_strict_ice_enforcement_topic.sql"
      - ".github/workflows/strict-ice-enforcement-topic-migrate.yml"

permissions:
  contents: read

concurrency:
  group: trrb-strict-ice-enforcement-topic-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.SUPABASE_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve database connection
        id: db
        shell: bash
        run: |
          set -euo pipefail
          url="${SUPABASE_POOLER_URL:-}"
          if [[ -z "$url" ]]; then url="${SUPABASE_DB_URL:-}"; fi
          if [[ -z "$url" ]]; then echo "Missing Supabase database connection" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Apply strict ICE topic migration
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260822053200_strict_ice_enforcement_topic.sql
      - name: Verify trigger and cleanup
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          function_def="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select pg_get_functiondef('public.assign_article_category_from_topic()'::regprocedure);")"
          printf '%s\n' "$function_def" | grep -q 'explicit_ice_agency'
          printf '%s\n' "$function_def" | grep -q 'explicit_enforcement_action'
          stale_count="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from public.articles where lower(coalesce(topic_key,''))='ice' and not (((coalesce(title,'')||' '||coalesce(summary,'')||' '||coalesce(content,'')) ~* '(\\mICE\\M|移民及海关执法局|移民与海关执法局|移民和海关执法局|美国移民海关执法局)') and ((coalesce(title,'')||' '||coalesce(summary,'')||' '||coalesce(content,'')) ~* '(抓捕|抓获|拘捕|逮捕|拘留|拘押|羁押|遣返|递解|驱逐出境|突袭|搜捕|通缉|扫荡|执法行动|\\marrest\\M|\\mdetain\\M|\\mdetention\\M|\\mdeport\\M|\\mremoval\\M|\\mraid\\M|\\mcustody\\M|\\mfugitive\\M|\\mwarrant\\M)'));")"
          test "$stale_count" = "0"
          examples="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from public.articles where title in ('什么是K-1未婚夫/妻签证？','Advance Parole旅行许可完整办理流程详解','[BIA先例] BIA关于212(h)条款豁免申请与调整身份酌情裁量的判决（Matter of BEST, 2026）') and topic_key is null;")"
          test "$examples" = "3"
          echo "Strict ICE trigger installed; stale_topic_count=$stale_count; examples_cleared=$examples"
