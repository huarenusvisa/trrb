name: Tang Daily Store Screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tang-daily-store-screenshots.yml'
      - 'scripts/store-capture/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: tang-daily-store-screenshots
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: store-simulator
          path: /tmp/store-app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: huarenusvisa/trrb
          run-id: 35160456860
      - uses: actions/upload-artifact@v4
        with:
          name: store-simulator
          path: /tmp/store-app/
          retention-days: 7
  capture:
    needs: build
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: store-simulator
          path: /tmp/store-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install screenshot automation
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - name: Capture actual app UI
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          mkdir -p /tmp/store-app/unpacked captures
          tar -xzf /tmp/store-app/store-simulator.tar.gz -C /tmp/store-app/unpacked
          python3 scripts/store-capture/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-raw-${{ matrix.family }}
          path: |
            captures/
            /tmp/store-app/store-build-evidence.json
          retention-days: 30
          include-hidden-files: true
