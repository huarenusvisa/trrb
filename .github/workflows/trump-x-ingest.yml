name: Trump X资讯采集

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trump-x-ingest.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trrb-trump-x-content-intake
  cancel-in-progress: false

jobs:
  collect-to-content-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN || secrets.X_API_BEARER_TOKEN || secrets.TWITTER_BEARER_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 每三小时运行；官方时间线为空时改用同一官方账号搜索补抓，并回看7天查重补漏。
      TRUMP_X_LOOKBACK_HOURS: "168"
      TRUMP_X_MAX_FETCH: "100"
      TRUMP_X_MAX_PROCESS: "50"
      TRUMP_X_PROCESS_CONCURRENCY: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claim shared three-hour collection cadence
        id: due
        env:
          COLLECTION_PIPELINE: "trump-x"
          COLLECTION_CADENCE_ACTION: "claim"
          COLLECTION_CADENCE_MINUTES: "180"
          COLLECTION_FORCE: ${{ github.event_name != 'schedule' }}
        run: node scripts/collection-cadence-gate.mjs
      - name: Validate secrets
        if: steps.due.outputs.due == 'true'
        shell: bash
        run: |
          test -n "$X_BEARER_TOKEN" || { echo "缺少X_BEARER_TOKEN"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "缺少OPENAI_API_KEY"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "缺少SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "缺少SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
      - name: Validate Trump X collector
        if: steps.due.outputs.due == 'true'
        run: node --test scripts/trump-x-ingest.test.mjs
      - name: Collect, translate, read images and deduplicate Trump X news
        if: steps.due.outputs.due == 'true'
        run: node scripts/trump-x-ingest.mjs
      - name: Complete cadence heartbeat
        if: success() && steps.due.outputs.due == 'true'
        env:
          COLLECTION_PIPELINE: "trump-x"
          COLLECTION_CADENCE_ACTION: "success"
        run: node scripts/collection-cadence-gate.mjs
      - name: Record cadence failure
        if: failure() && steps.due.outputs.due == 'true'
        env:
          COLLECTION_PIPELINE: "trump-x"
          COLLECTION_CADENCE_ACTION: "failure"
          COLLECTION_CADENCE_ERROR: "Trump X资讯采集失败"
        run: node scripts/collection-cadence-gate.mjs || true
