name: Build and submit AsylumJudge with official logo

jobs:
  build_ios:
    name: Build iOS with official AsylumJudge logo
    type: build
    environment: production
    params:
      platform: ios
      profile: production
  submit_ios:
    name: Upload corrected iOS build
    needs: [build_ios]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
