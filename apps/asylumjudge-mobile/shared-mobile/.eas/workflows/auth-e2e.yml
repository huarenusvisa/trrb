name: Unified account, community and comments E2E

on:
  workflow_dispatch: {}

jobs:
  preflight:
    name: Validate marked test account
    environment: preview
    steps:
      - uses: eas/checkout
      - name: Validate auth test environment
        run: node scripts/validate-auth-e2e-env.mjs

  get_android:
    name: Get latest Android E2E build
    needs: [preflight]
    type: get-build
    params:
      platform: android
      profile: e2e-test
      wait_for_in_progress: true

  get_ios:
    name: Get latest iOS E2E build
    needs: [preflight]
    type: get-build
    params:
      platform: ios
      profile: e2e-test
      simulator: true
      wait_for_in_progress: true

  test_android_auth:
    name: Android unified account regression
    needs: [get_android]
    environment: preview
    type: maestro
    params:
      build_id: ${{ needs.get_android.outputs.build_id }}
      flow_path: '.maestro/auth-login.yml'
      retries: 1
      retry_failed_only: true

  test_android_community:
    name: Android community lifecycle
    needs: [get_android, test_android_auth]
    environment: preview
    type: maestro
    params:
      build_id: ${{ needs.get_android.outputs.build_id }}
      flow_path: '.maestro/community-lifecycle.yml'
      retries: 1
      retry_failed_only: true

  test_android_news_comments:
    name: Android news comments lifecycle
    needs: [get_android, test_android_community]
    environment: preview
    type: maestro
    params:
      build_id: ${{ needs.get_android.outputs.build_id }}
      flow_path: '.maestro/news-comments-lifecycle.yml'
      retries: 1
      retry_failed_only: true

  test_ios_auth:
    name: iOS unified account regression
    needs: [get_ios, test_android_news_comments]
    environment: preview
    type: maestro
    params:
      build_id: ${{ needs.get_ios.outputs.build_id }}
      flow_path: '.maestro/auth-login.yml'
      retries: 1
      retry_failed_only: true

  test_ios_community:
    name: iOS community lifecycle
    needs: [get_ios, test_ios_auth]
    environment: preview
    type: maestro
    params:
      build_id: ${{ needs.get_ios.outputs.build_id }}
      flow_path: '.maestro/community-lifecycle.yml'
      retries: 1
      retry_failed_only: true

  test_ios_news_comments:
    name: iOS news comments lifecycle
    needs: [get_ios, test_ios_community]
    environment: preview
    type: maestro
    params:
      build_id: ${{ needs.get_ios.outputs.build_id }}
      flow_path: '.maestro/news-comments-lifecycle.yml'
      retries: 1
      retry_failed_only: true

  cleanup_marked_content:
    name: Remove marked community and comment content
    after: [test_android_news_comments, test_ios_news_comments]
    environment: preview
    steps:
      - uses: eas/checkout
      - name: Clean up all marked test content
        run: node scripts/cleanup-marked-e2e.mjs
