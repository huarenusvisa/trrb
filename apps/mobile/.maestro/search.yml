appId: net.trrb.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "搜索"
    timeout: 30000
- tapOn:
    text: "搜索"
    index: 0
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "search-screen"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 15000
- tapOn:
    id: "search-input"
- inputText: "特朗普"
- tapOn:
    id: "search-submit"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "search-results"
    timeout: 20000
- extendedWaitUntil:
    visible: "搜索：特朗普"
    timeout: 20000
- assertVisible:
    id: "category-news-list"
