  <rect x="10" y="10" width="492" height="492" rx="112" fill="#fff" stroke="#D0D5DD" stroke-width="20"/>
  <rect x="116" y="126" width="80" height="214" rx="24" fill="#14804A"/>
  <rect x="216" y="183" width="80" height="157" rx="24" fill="#C4161C"/>
  <rect x="316" y="233" width="80" height="107" rx="24" fill="#2563A9"/>
  <g fill="#101828" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900">
    <text x="207" y="426" transform="rotate(-9 207 426)">U</text>
    <text x="270" y="416" transform="rotate(9 270 416)">S</text>
  </g>
</svg>
