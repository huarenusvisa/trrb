<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>唐人财经 Design System 1.0 预览</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#FBFAF6;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    #frame{border:0;width:100%;height:100%;display:block;background:#FBFAF6}
    .badge{position:fixed;z-index:9999;right:max(9px,env(safe-area-inset-right));top:max(7px,env(safe-area-inset-top));font-size:10px;font-weight:850;letter-spacing:.02em;background:rgba(11,107,79,.93);color:#FFFDF8;padding:6px 8px;border-radius:8px;pointer-events:none;box-shadow:0 7px 20px rgba(37,45,40,.16)}
  </style>
</head>
<body>
  <div class="badge">Tangren DS 1.0 · B</div>
  <iframe id="frame" src="./index.html#market" title="唐人财经 Design System 1.0"></iframe>
  <script>
    const frame=document.getElementById('frame');
    frame.addEventListener('load',()=>{
      try{
        const d=frame.contentDocument;
        if(!d.querySelector('link[data-tangren-design]')){
          const link=d.createElement('link');
          link.rel='stylesheet';
          link.href='./tangren-design.css';
          link.dataset.tangrenDesign='1';
          d.head.appendChild(link);
        }
        const logo=d.querySelector('.logo');
        if(logo){logo.src='./brand-mark.svg';logo.style.display='block';logo.style.borderRadius='13px'}
        const oldMark=d.querySelector('.preview-mark');if(oldMark)oldMark.remove();
        const home=d.querySelector('.home-link');if(home)home.style.visibility='hidden';
      }catch(e){}
    });
  </script>
</body>
</html>
