<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />

  <title>ETF｜唐人财经</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="./finance.css" />

</head>
<body>
<div class="stock-app">
  <header class="stock-top"><div class="stock-topin"><a class="back" href="./" aria-label="返回">‹</a><div class="stock-ticker"><b id="fundSymbol">ETF</b><span>基金研究</span></div><div></div></div></header>
  <main class="stock-content">
    <section class="stock-hero"><div class="eyebrow">ETF / Fund</div><h1 id="fundName">—</h1><div id="fundPrice" class="stock-price">—</div><div id="fundChange" class="move">—</div><div class="chart-wrap"><svg viewBox="0 0 800 400" preserveAspectRatio="none" aria-label="ETF 演示走势图"><polyline points="0,290 45,280 90,305 135,260 180,270 225,230 270,245 315,210 360,220 405,175 450,190 495,150 540,170 585,130 630,145 675,105 720,120 800,86" fill="none" stroke="#00c805" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="range"><button class="on">1M</button><button>3M</button><button>YTD</button><button>1Y</button><button>3Y</button><button>5Y</button></div></section>
    <section class="stock-section"><h2>基金概览</h2><div class="metrics"><div class="metric"><small>类别</small><b id="fundCat">—</b></div><div class="metric"><small>管理费率</small><b id="fundExpense">—</b></div><div class="metric"><small>资产规模</small><b id="fundAum">—</b></div><div class="metric"><small>风险等级</small><b id="fundRisk">—</b></div></div></section>

    <section class="stock-section"><h2>相关资讯</h2><div class="news-list"><a class="news" href="#"><div><b>ETF 资金流向与市场宽度成为投资者近期关注重点</b><small>ETF观察 · 1小时前</small></div><div class="thumb">ETF</div></a><a class="news" href="#"><div><b>利率、盈利和行业集中度继续影响指数产品表现</b><small>唐人财经 · 3小时前</small></div><div class="thumb">MARKET</div></a></div></section>
    <section class="stock-section"><h2>风险说明</h2><p class="risk">ETF 和基金可能发生本金损失。费用、规模、持仓与历史表现应在接入正式授权数据源后动态更新。V1 不开放购买、申购、开户、KYC 或交易。</p></section>

  <div class="fixed"><button class="ghost" onclick="history.back()">返回</button><button id="fundWatchBtn" class="primary">+ 加入基金自选</button></div>
