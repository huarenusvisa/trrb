  <text x="440" y="260" fill="#081a33" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="800" letter-spacing="1">HUAREN GONGZUO</text>
  <text x="444" y="335" fill="#175fae" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" letter-spacing="4">JOBS FOR CHINESE COMMUNITIES</text>
