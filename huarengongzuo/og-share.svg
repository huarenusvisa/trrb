<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Huarengongzuo share card</title>
  <desc id="desc">Huarengongzuo blue logo and website name on a light blue background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="260" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f63e9"/>
      <stop offset="1" stop-color="#2188eb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b4e9f" flood-opacity=".18"/>
