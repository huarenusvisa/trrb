<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" /><title>联系招聘方｜华人工作网</title>
  <style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#101828;font-family:system-ui}.shell{max-width:820px;margin:auto;padding:26px 16px 70px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:16px;padding:20px;margin-top:16px}.hidden{display:none!important}.muted{color:#667085;line-height:1.6}a{color:#1769d2;text-decoration:none;font-weight:750}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px}.auth-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer}.primary{background:#1769d2;color:#fff;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a,.actions button{display:inline-block;background:#eef5ff;border:1px solid #cfe2ff;border-radius:9px;padding:9px 12px}.messages{max-height:420px;overflow:auto;background:#f8fafc;border-radius:10px;padding:10px}.bubble{background:#fff;border:1px solid #dfe5ee;border-radius:10px;padding:9px;margin:8px 0;white-space:pre-wrap}.bubble.mine{background:#eaf3ff;margin-left:12%}.bubble small{display:block;color:#667085;margin-top:4px}@media(max-width:700px){.auth-grid{grid-template-columns:1fr}}</style>
</head>
<body><main class="shell"><a href="/jobs/">← 返回招聘求职</a><h1>联系招聘方</h1><p id="contact-state" class="muted">正在读取岗位…</p>
  <section id="auth-card" class="card hidden"><h2>登录后发送站内信</h2><p class="muted">登录即注册，不需要邮件验证。</p><div class="auth-grid"><label>邮箱或手机号<input id="identifier" autocomplete="username" /></label><label>密码<input id="password" type="password" minlength="8" autocomplete="current-password" /></label><button id="login" class="primary" type="button">登录 / 注册</button></div><p id="auth-status" class="muted"></p></section>
  <section id="contact-card" class="card hidden"><h2 id="contact-title"></h2><p id="contact-location" class="muted"></p><div id="contact-actions" class="actions"></div><section id="message-section" class="hidden"><hr><h3>站内信</h3><div id="messages" class="messages"></div><form id="message-form"><textarea id="message-body" maxlength="5000" required placeholder="输入消息"></textarea><button class="primary" type="submit">发送消息</button> <a href="/jobs/messages.html">打开全部站内信</a></form></section></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/supabase-client.js"></script><script src="/jobs/unified-account.js?v=20260831-auto-register-v1"></script><script src="/jobs/contact.js?v=20260831-messages-v1"></script></body></html>
