<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>美国招聘求职｜唐人日报</title>
  <meta name="description" content="唐人日报美国招聘求职入口，仅限美国境内招聘与求职。" />
  <link rel="canonical" href="https://trrb.net/jobs/" />
  <link rel="stylesheet" href="/styles.css?v=29.9" />
  <style>
    body{background:#f8fafc;color:#101828}.jobs-shell{max-width:980px;margin:0 auto;padding:48px 20px 80px}.jobs-head{margin-bottom:28px}.jobs-head a{color:#d60000;text-decoration:none}.jobs-head h1{font-size:clamp(30px,5vw,48px);margin:18px 0 10px}.jobs-head p{color:#667085;line-height:1.7}.jobs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.jobs-entry{display:block;background:white;border:1px solid #e4e7ec;border-radius:18px;padding:30px;color:#101828;text-decoration:none;box-shadow:0 8px 30px rgba(16,24,40,.06)}.jobs-entry strong{display:block;font-size:26px;margin-bottom:10px}.jobs-entry span{color:#667085;line-height:1.6}.jobs-note{margin-top:22px;padding:18px;border-radius:14px;background:#fff;border:1px solid #eaecf0;color:#475467;line-height:1.7}@media(max-width:680px){.jobs-grid{grid-template-columns:1fr}.jobs-shell{padding-top:28px}}
  </style>
</head>
<body>
  <main class="jobs-shell">
    <header class="jobs-head"><a href="/">← 返回唐人日报</a><h1>美国招聘求职</h1><p>仅限美国境内。招聘者与求职者使用唐人日报统一账号体系；后续搜索、发布、联系和治理能力按 JOBS-R1 固定节点逐步上线。</p></header>
    <section class="jobs-grid" aria-label="招聘求职入口">
      <a class="jobs-entry" href="/jobs/?mode=hiring"><strong>我要招聘</strong><span>雇主招聘入口。当前阶段先建立统一入口与数据闭环。</span></a>
      <a class="jobs-entry" href="/jobs/?mode=seeking"><strong>我要求职</strong><span>求职者入口。搜索与求职档案将在后续固定节点上线。</span></a>
    </section>
    <p class="jobs-note">平台不会把“上传图片”或“角色标签”自动视为身份、企业或真实性认证。招聘与求职数据统一进入同一正式数据库，并受后台治理。</p>
  </main>
</body>
</html>
