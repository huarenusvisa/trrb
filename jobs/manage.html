<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" /><title>我的招聘｜华人工作网</title>
  <style>:root{--blue:#1769d2;--line:#dfe5ee;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#101828;font-family:system-ui}.shell{max-width:980px;margin:auto;padding:26px 16px 70px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.top a,a{color:var(--blue);text-decoration:none;font-weight:750}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}.hidden{display:none!important}.muted{color:var(--muted);line-height:1.6}.auth-grid,.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.auth-grid{grid-template-columns:1fr 1fr auto;align-items:end}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px}textarea{min-height:130px}button{border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:8px 11px;cursor:pointer}.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:800}.listing{border-top:1px solid var(--line);padding:15px 0}.listing:first-child{border-top:0}.listing h3{margin:0 0 6px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef5ff;color:#174f91;font-size:12px}.full{grid-column:1/-1}dialog{width:min(760px,94vw);border:0;border-radius:16px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(15,23,42,.55)}.dialog-body{padding:22px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0}.message-link{position:relative}.unread{background:#d92d20;color:#fff;border-radius:999px;padding:2px 7px;font-size:12px}@media(max-width:700px){.top{align-items:flex-start}.auth-grid,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}</style>
</head>
<body><main class="shell"><header class="top"><div><a href="/jobs/">← 返回招聘求职</a><h1>我的招聘</h1></div><div><a class="message-link" href="/jobs/messages.html">站内信 <span id="unread-count" class="unread hidden">0</span></a> · <a href="/jobs/publish.html">发布招聘</a></div></header>
  <section id="auth-card" class="card"><h2>登录后管理</h2><p class="muted">登录即注册，不需要邮件验证。</p><div class="auth-grid"><label>邮箱或手机号<input id="identifier" autocomplete="username" /></label><label>密码<input id="password" type="password" minlength="8" autocomplete="current-password" /></label><button id="login" class="primary" type="button">登录 / 注册</button></div><p id="auth-status" class="muted"></p></section>
  <section id="manage" class="hidden"><div class="card"><h2>我的招聘信息</h2><p id="jobs-manage-message" class="muted">正在读取…</p><div id="jobs-manage-listings"></div></div><div class="card"><h2>我的求职信息</h2><div id="jobs-manage-seekers"></div></div></section>
</main>
<dialog id="edit-dialog"><form id="edit-form" class="dialog-body"><div class="dialog-head"><h2>修改招聘</h2><button type="button" id="edit-close">×</button></div><input id="edit-id" type="hidden" /><div class="form-grid"><label>职位标题<input id="edit-title" maxlength="120" required /></label><label>真实雇主/公司名称<input id="edit-company" maxlength="160" /></label><label class="full">职位描述<textarea id="edit-description" maxlength="12000" required></textarea></label><label>州<input id="edit-state" maxlength="3" required /></label><label>城市<input id="edit-city" maxlength="120" required /></label><label>有效期<input id="edit-expires" type="datetime-local" /></label><label>联系方法<select id="edit-contact-method"><option value="platform">站内信</option><option value="phone">电话</option><option value="email">Email</option><option value="sms">短信</option></select></label><label>联系电话或Email<input id="edit-contact-value" maxlength="320" /></label><label><input id="edit-contact-public" type="checkbox" style="width:auto" /> 允许公开显示联系方式</label><label class="full">官方申请网址<input id="edit-application-url" type="url" /></label></div><div class="actions"><button class="primary" type="submit">保存修改</button><span id="edit-status" class="muted"></span></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/supabase-client.js"></script><script src="/jobs/unified-account.js?v=20260831-auto-register-v1"></script><script src="/jobs/manage.js?v=20260831-manage-v2"></script></body></html>
