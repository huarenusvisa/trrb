<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>招聘评价与举报｜唐人日报</title><link rel="stylesheet" href="/styles.css"></head><body><main class="container" style="max-width:880px;margin:32px auto;padding:0 16px"><p><a href="/jobs/">← 返回招聘求职</a></p><h1>真实联系后的评价与举报</h1><p id="review-state">正在读取岗位…</p><section id="review-panel" hidden><h2 id="review-title"></h2><p>只有产生过真实联系记录的登录用户才能提交评价。公开匿名只隐藏前台身份，平台账户仍可追溯。</p><form id="review-form"><label>沟通体验 1–5 <input id="communication-score" type="number" min="1" max="5" required></label><br><label>信息一致度 1–5 <input id="accuracy-score" type="number" min="1" max="5" required></label><br><label>薪资/内容一致度 1–5 <input id="compensation-score" type="number" min="1" max="5"></label><br><label>评价内容<br><textarea id="review-body" maxlength="2000" rows="5"></textarea></label><br><label><input id="public-anonymous" type="checkbox"> 对公众匿名显示</label><br><button type="submit">提交评价</button></form><hr><h3>举报岗位</h3><form id="report-form"><label>原因 <select id="report-reason" required><option value="suspected_fraud">涉嫌诈骗</option><option value="misleading_content">信息误导</option><option value="compensation_mismatch">薪资不一致</option><option value="harassment">骚扰</option><option value="privacy">隐私问题</option><option value="copyright">版权问题</option><option value="other">其他</option></select></label><br><label>说明<br><textarea id="report-details" maxlength="3000" rows="4"></textarea></label><br><button type="submit">提交举报</button></form><hr><h3>公开评价</h3><div id="reviews-list"></div></section></main><script src="/js/supabase-config.js"></script><script src="/jobs/review.js"></script></body></html>
