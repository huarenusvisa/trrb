<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>美国招聘搜索｜唐人日报</title>
  <meta name="description" content="搜索美国境内招聘岗位。不会打字也可按工作和找工地点点选；支持附近、ZIP、地区和全美。" />
  <link rel="canonical" href="https://trrb.net/jobs/search.html" />
  <link rel="stylesheet" href="/styles.css?v=29.9" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body{background:#f8fafc;color:#101828}.shell{max-width:1180px;margin:0 auto;padding:24px 18px 80px}.head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.head a{color:#d60000;text-decoration:none}.head h1{margin:10px 0 4px;font-size:clamp(27px,4vw,40px)}.head p{margin:0;color:#667085;max-width:720px;line-height:1.55}.search-card,.result-card{background:#fff;border:1px solid #e4e7ec;border-radius:15px;box-shadow:0 5px 22px rgba(16,24,40,.045)}.search-card{padding:14px;margin:16px 0}.quick-grid{display:grid;grid-template-columns:minmax(210px,.9fr) minmax(260px,1.1fr) minmax(220px,1.3fr) auto;gap:9px;align-items:end}.quick-grid label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#475467;font-weight:650}.quick-grid input,.quick-grid select,.location-trigger{height:44px;border:1px solid #d0d5dd;border-radius:10px;padding:0 11px;background:#fff;color:#101828;font:inherit;text-align:left}.location-trigger{display:flex;align-items:center;justify-content:space-between;cursor:pointer}.primary,.secondary{border:0;border-radius:10px;padding:11px 16px;font-weight:750;cursor:pointer}.primary{background:#d60000;color:#fff;height:44px}.secondary{background:#eef2f6;color:#344054}.location-panel{margin-top:10px;padding:12px;border:1px solid #e4e7ec;border-radius:12px;background:#fcfcfd}.location-options{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.zip-row{display:flex;gap:7px;align-items:center}.zip-row input{height:40px;width:120px;border:1px solid #d0d5dd;border-radius:9px;padding:0 10px}.location-note{font-size:12px;color:#667085;margin:8px 0 0}.discovery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.discovery-box{border:1px solid #eaecf0;background:#fff;border-radius:11px;padding:10px}.discovery-box strong{display:block;font-size:13px;margin-bottom:8px}.discovery-buttons{display:flex;flex-wrap:wrap;gap:6px}.discovery-buttons button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:6px 9px;font-size:12px;cursor:pointer}.discovery-buttons button:hover{border-color:#d60000;color:#b42318}.discovery-empty{font-size:12px;color:#98a2b3}.advanced{margin-top:10px;border-top:1px solid #eaecf0;padding-top:9px}.advanced summary{cursor:pointer;color:#475467;font-size:13px;font-weight:700;user-select:none}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:10px}.grid label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#475467}.grid input,.grid select{min-height:40px;border:1px solid #d0d5dd;border-radius:9px;padding:7px 9px;background:#fff}.wide{grid-column:span 2}.actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.status{color:#667085;font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.view-switch{display:flex;gap:7px}.view-switch button.is-active{background:#101828;color:#fff}.results{display:grid;gap:8px}.result-card{padding:15px}.result-card h2{font-size:19px;margin:0 0 7px}.meta{display:flex;flex-wrap:wrap;gap:7px;color:#667085;font-size:13px}.pill{background:#f2f4f7;border-radius:999px;padding:3px 8px}.salary{font-weight:800;color:#b42318}.empty{padding:28px;text-align:center;color:#667085}.pagination{display:flex;justify-content:center;gap:10px;margin-top:18px}#jobs-map{height:560px;border-radius:15px;border:1px solid #e4e7ec;background:#eef2f6}.hidden{display:none!important}@media(max-width:860px){.quick-grid{grid-template-columns:1fr 1fr}.quick-grid .quick-search{grid-column:span 2}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head{display:block}}@media(max-width:560px){.shell{padding:16px 12px 72px}.quick-grid{grid-template-columns:1fr}.quick-grid .quick-search{grid-column:span 1}.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.head p{font-size:14px}.location-options{display:grid;grid-template-columns:1fr 1fr}.zip-row{grid-column:1/-1}.zip-row input{flex:1;width:auto}.discovery{grid-template-columns:1fr}#jobs-map{height:460px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="head">
      <div><a href="/jobs/">← 招聘求职</a><h1>找工作</h1><p>不懂美国地理也没关系：系统优先使用你已授权或已选择的找工地点；也可以只点工作类别和地区，不必打字。</p></div>
      <a href="/jobs/publish.html" class="secondary" style="text-decoration:none">＋ 发布招聘</a>
    </header>

    <section class="search-card" aria-label="极简找工作">
      <form id="jobs-search-form">
        <div class="quick-grid">
          <label>找什么工作？
            <select id="category"><option value="">全部工作</option></select>
          </label>
          <label>想在哪里？
            <button class="location-trigger" id="location-trigger" type="button"><span id="location-summary">全美国</span><span>更换 ▾</span></button>
          </label>
          <label class="quick-search">搜索（可选）
            <input id="q" name="q" placeholder="职位、公司或地区；不会打字可留空" />
          </label>
          <button class="primary" type="submit">查看工作</button>
        </div>

        <div id="location-panel" class="location-panel hidden">
          <div class="location-options">
            <button class="secondary" type="button" id="use-location">📍 使用当前位置</button>
            <div class="zip-row"><input id="location-zip" inputmode="numeric" autocomplete="postal-code" maxlength="10" placeholder="ZIP Code" /><button class="secondary" type="button" id="use-zip">使用ZIP</button></div>
            <button class="secondary" type="button" id="choose-region">🗺️ 选择地区</button>
            <button class="secondary" type="button" id="all-us">🇺🇸 全美国</button>
          </div>
          <p class="location-note">精确设备位置只有在你主动授权后才使用。拒绝定位不影响ZIP、地区或全美找工作；这里保存的是“找工地点”，不是家庭住址。</p>
        </div>

        <section class="discovery" aria-label="职位和地区双向推荐">
          <div class="discovery-box"><strong id="region-hints-title">选一个工作，看看哪里机会多</strong><div id="region-hints" class="discovery-buttons"><span class="discovery-empty">选择工作类别后自动显示有岗位的州和数量。</span></div></div>
          <div class="discovery-box"><strong id="category-hints-title">选一个地区，看看这里缺什么人</strong><div id="category-hints" class="discovery-buttons"><span class="discovery-empty">选择地区后自动显示当地工作类别和数量。</span></div></div>
        </section>

        <details class="advanced" id="advanced-filters">
          <summary>更多筛选（地区、类型、薪资、距离、排序）</summary>
          <div class="grid">
            <label>类型<select id="employment"><option value="">全部类型</option><option value="full_time">全职</option><option value="part_time">兼职</option><option value="contract">合同</option><option value="temporary">临时</option><option value="internship">实习</option></select></label>
            <label>州<input id="state" maxlength="3" placeholder="NY" /></label>
            <label>城市<input id="city" placeholder="New York City" /></label>
            <label>County<input id="county" placeholder="Queens County" /></label>
            <label>Borough<input id="borough" placeholder="Queens" /></label>
            <label>Neighborhood<input id="neighborhood" placeholder="Flushing" /></label>
            <label>最低薪资<input id="salary" type="number" min="0" step="1" placeholder="例如 20" /></label>
            <label>附近范围<select id="radius"><option value="">不限距离</option><option value="5">5 miles</option><option value="10">10 miles</option><option value="25">25 miles</option><option value="50">50 miles</option></select></label>
            <label>排序<select id="sort"><option value="relevance">综合</option><option value="latest">最新</option><option value="salary">薪资</option><option value="distance">距离</option></select></label>
          </div>
        </details>
        <div class="actions"><button class="secondary" type="button" id="clear-location">清除附近定位</button><span class="status" id="search-status">正在连接正式招聘数据源…</span></div>
      </form>
    </section>

    <div class="toolbar"><strong id="results-heading">招聘岗位</strong><div class="view-switch"><button class="secondary is-active" id="list-view" type="button">列表</button><button class="secondary" id="map-view" type="button">地图</button></div></div>
    <section id="jobs-results" class="results" aria-live="polite"></section>
    <section id="jobs-map" class="hidden" aria-label="附近招聘岗位地图"></section>
    <nav class="pagination"><button class="secondary" id="prev-page" type="button">上一页</button><button class="secondary" id="next-page" type="button">下一页</button></nav>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./search.js?v=20260817-r2n3"></script>
</body>
</html>
