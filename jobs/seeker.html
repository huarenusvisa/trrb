<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>发布求职｜华人工作网</title>
  <style>body{font-family:system-ui;margin:0;background:#f8fafc;color:#101828}.shell{max-width:860px;margin:auto;padding:30px 18px 70px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin:10px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;box-sizing:border-box}textarea{min-height:130px}button{padding:12px 18px;border:0;border-radius:10px;background:#1769d2;color:white;margin-top:12px}.hidden{display:none}.muted{color:#667085;line-height:1.6}.preview{max-width:160px;border-radius:50%;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style>
</head>
<body><main class="shell">
  <a href="/jobs/">← 返回招聘求职</a><h1>发布求职</h1>
  <p class="muted">使用唐人日报统一账号；新账号登录时自动创建。头像可选，无头像时使用账号首字头像。请勿填写身份证号、SSN、银行卡、移民文件号码等高敏感信息。</p>
  <section class="card" id="auth-card"><label>邮箱或手机号</label><input id="email" autocomplete="username"><label>密码</label><input id="password" type="password" minlength="8"><button id="login" type="button">登录 / 注册</button><div id="auth-status" class="muted"></div></section>
  <form id="form" class="card hidden"><div class="grid">
    <div><label>显示名称</label><input id="display-name" maxlength="80"></div><div><label>目标岗位 *</label><input id="target-role" required maxlength="120"></div>
    <div><label>州 *</label><input id="state" required maxlength="3"></div><div><label>城市 *</label><input id="city" required maxlength="120"></div>
    <div><label>County</label><input id="county"></div><div><label>Borough</label><input id="borough"></div><div class="full"><label>Neighborhood</label><input id="neighborhood"></div>
    <div class="full"><label>经历</label><textarea id="experience" maxlength="12000"></textarea></div><div class="full"><label>自我介绍 *</label><textarea id="bio" maxlength="6000" required></textarea></div>
    <div><label>电话</label><input id="phone" maxlength="40"></div><div><label>Email</label><input id="public-email" type="email" maxlength="320"></div>
    <div><label><input id="phone-public" type="checkbox" style="width:auto"> 公开电话</label></div><div><label><input id="email-public" type="checkbox" style="width:auto"> 公开Email</label></div>
    <div class="full"><label>头像（可选）</label><input id="avatar" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview hidden" alt="头像预览"></div>
  </div><button type="submit">发布求职</button><div id="status" class="muted"></div></form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/huarengongzuo/i18n.js?v=20260831-i18n-v1"></script><script src="/jobs/unified-account.js?v=20260821-u1"></script><script src="/jobs/seeker.js?v=20260821-u1"></script>
</body></html>
