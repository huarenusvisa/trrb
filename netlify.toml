  path = "/*/*"
  excludedPath = ["/*.css", "/*.js", "/*.mjs", "/*.json", "/*.xml", "/*.webp", "/*.png", "/*.jpg", "/*.jpeg", "/*.svg", "/*.ico", "/*.woff", "/*.woff2", "/assets/*", "/config/*", "/data/*", "/asylumjudge", "/asylumjudge/*", "/community", "/community/*"]

