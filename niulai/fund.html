<!doctype html>

  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/logo-mark.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="./finance.css" />
  <link rel="stylesheet" href="./v1-polish.css" />

  <link rel="stylesheet" href="./resilience.css" />
  <script src="./data-adapter.js" defer></script>
  <script src="./fund.js" defer></script>
  <script src="./detail-state-sync.js" defer></script>

<body>
<div class="stock-app">
  <header class="stock-top"><div class="stock-topin"><a class="back" href="./#funds" aria-label="返回基金">‹</a><div class="stock-ticker"><b id="fundSymbol">ETF</b><span>基金研究</span></div><div></div></div></header>
  <main class="stock-content">
    <section class="stock-hero" aria-labelledby="fundName"><div class="eyebrow">ETF / Fund</div><h1 id="fundName">—</h1><div id="fundPrice" class="stock-price">—</div><div id="fundChange" class="move">—</div><div id="fundChart" class="chart-wrap"></div><div class="range" role="group" aria-label="ETF 走势图时间范围"><button class="on" aria-pressed="true" data-range="1M">1M</button><button aria-pressed="false" data-range="3M">3M</button><button aria-pressed="false" data-range="YTD">YTD</button><button aria-pressed="false" data-range="1Y">1Y</button><button aria-pressed="false" data-range="3Y">3Y</button><button aria-pressed="false" data-range="5Y">5Y</button></div></section>
    <section class="stock-section"><h2>基金概览</h2><div class="metrics"><div class="metric"><small>类别</small><b id="fundCat">—</b></div><div class="metric"><small>管理费率</small><b id="fundExpense">—</b></div><div class="metric"><small>资产规模</small><b id="fundAum">—</b></div><div class="metric"><small>风险等级</small><b id="fundRisk">—</b></div></div></section>
    <section class="stock-section"><h2>核心持仓</h2><div id="holdings" class="event-list"></div></section>
    <section class="stock-section"><h2>相关资讯</h2><div class="news-list"><article class="news"><div><b>ETF 资金流向与市场宽度成为投资者近期关注重点</b><small>ETF观察 · 1小时前</small></div><div class="thumb" aria-hidden="true">ETF</div></article><article class="news"><div><b>利率、盈利和行业集中度继续影响指数产品表现</b><small>唐人财经 · 3小时前</small></div><div class="thumb" aria-hidden="true">MARKET</div></article></div></section>
    <section class="stock-section"><h2>风险说明</h2><p class="risk">ETF 和基金可能发生本金损失。费用、规模、持仓与历史表现应在接入正式授权数据源后动态更新。V1 不开放购买、申购、开户、KYC 或交易。</p></section>
  </main>
  <div class="fixed" aria-label="基金操作"><button id="fundBackBtn" class="ghost">返回</button><button id="fundWatchBtn" class="primary" aria-pressed="false">+ 加入基金自选</button></div>
</div>
