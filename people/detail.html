<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人物详情｜美国华人人物志｜唐人日报</title>
  <meta name="description" content="美国华人人物志人物详情：生平、来美经历、事业、重要年份、照片、人生故事与时间线。">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{background:#f6f7f9;color:#17202a}.person-wrap{max-width:920px;margin:0 auto;padding:28px 18px 70px}.person-card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;margin:16px 0}.hero{display:grid;grid-template-columns:160px 1fr;gap:24px;align-items:start}.hero img{width:160px;height:200px;object-fit:cover;border-radius:14px;background:#eef0f3}.muted{color:#68707c}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#f0f2f5;border-radius:999px;padding:5px 10px;font-size:13px}.timeline{border-left:2px solid #d9dde3;padding-left:20px}.timeline article{margin:0 0 20px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}.empty{color:#7a828e}.back{color:inherit;text-decoration:none}@media(max-width:620px){.hero{grid-template-columns:1fr}.hero img{width:120px;height:150px}}
  </style>
</head>
<body>
  <main class="person-wrap">
    <a class="back" href="/people/">← 返回美国华人人物志</a>
    <section id="personHero" class="person-card"><p class="empty">正在加载人物资料…</p></section>
    <section class="person-card"><h2>生平</h2><div id="biography" class="empty">暂无公开内容</div></section>
    <section class="person-card"><h2>来美经历</h2><div id="arrival" class="empty">暂无公开内容</div></section>
    <section class="person-card"><h2>事业与工作</h2><div id="career" class="empty">暂无公开内容</div></section>
    <section class="person-card"><h2>重要年份与时间线</h2><div id="timeline" class="timeline empty">暂无公开内容</div></section>
    <section class="person-card"><h2>照片</h2><div id="photos" class="gallery empty">暂无已审核照片</div></section>
    <section class="person-card"><h2>人生故事</h2><div id="stories" class="empty">暂无公开故事</div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/people/detail.js"></script>
