<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>重置密码｜唐人日报</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,460px);background:#fff;border:1px solid #e4e7ec;border-radius:20px;padding:28px;box-shadow:0 12px 36px #10182812}h1{font-size:30px;margin:0 0 8px}.sub{color:#667085;line-height:1.6;margin:0 0 24px}.field{position:relative;margin-top:14px}.field input{width:100%;height:54px;border:1px solid #d0d5dd;border-radius:12px;padding:0 76px 0 14px;font-size:17px}.field button{position:absolute;right:4px;top:4px;height:46px;border:0;background:transparent;color:#c8211e;font-weight:700;padding:0 14px}.submit{width:100%;height:54px;border:0;border-radius:12px;background:#c8211e;color:#fff;font-size:17px;font-weight:800;margin-top:18px}.submit:disabled{opacity:.55}.msg{display:none;margin-top:16px;padding:14px;border-radius:10px;background:#f2f4f7;line-height:1.5}.msg.error{background:#fff1f0;color:#b42318}.home{display:block;text-align:center;color:#667085;text-decoration:none;font-weight:700;margin-top:20px;padding:10px}
  </style>
</head>
<body><main class="wrap"><section class="card"><h1>设置新密码</h1><p class="sub">请输入两次新密码。密码需要 8–128 位。</p><form id="form"><div class="field"><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="新密码" required><button type="button" data-for="password">显示</button></div><div class="field"><input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="再次输入新密码" required><button type="button" data-for="confirm">显示</button></div><button class="submit" id="submit" type="submit">保存新密码</button></form><div class="msg" id="message" role="alert"></div><a class="home" href="/">返回唐人日报</a></section></main>
<script>
  const params=new URLSearchParams(location.hash.slice(1));const token=params.get('access_token')||'';history.replaceState(null,'',location.pathname+location.search);const form=document.getElementById('form'),message=document.getElementById('message'),submit=document.getElementById('submit');
  function show(text,error=false){message.textContent=text;message.className='msg'+(error?' error':'');message.style.display='block'}
  document.querySelectorAll('[data-for]').forEach(button=>button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.for);const visible=input.type==='text';input.type=visible?'password':'text';button.textContent=visible?'显示':'隐藏'}));
  if(!token){form.hidden=true;show('重置链接无效或已过期，请回到 App 重新申请。',true)}
  form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password.length<8||password.length>128)return show('新密码需要 8–128 位。',true);if(password!==confirm)return show('两次输入的新密码不一致。',true);submit.disabled=true;submit.textContent='正在保存…';try{const response=await fetch('/.netlify/functions/unified-account-recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'complete',access_token:token,password})});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'重置失败，请重新申请链接。');form.hidden=true;show('密码已重置。现在可以回到唐人日报 App 使用新密码登录。')}catch(error){show(error.message||'重置失败，请稍后重试。',true)}finally{submit.disabled=false;submit.textContent='保存新密码'}});
</script></body></html>
