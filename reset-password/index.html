<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>重置密码｜唐人日报</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,460px);background:#fff;border:1px solid #e4e7ec;border-radius:20px;padding:28px;box-shadow:0 12px 36px #10182812}h1{font-size:30px;margin:0 0 8px}.sub{color:#667085;line-height:1.6;margin:0 0 24px}.field{position:relative;margin-top:14px}.field input{width:100%;height:54px;border:1px solid #d0d5dd;border-radius:12px;padding:0 76px 0 14px;font-size:17px}.field button{position:absolute;right:4px;top:4px;height:46px;border:0;background:transparent;color:#c8211e;font-weight:700;padding:0 14px}.submit{width:100%;height:54px;border:0;border-radius:12px;background:#c8211e;color:#fff;font-size:17px;font-weight:800;margin-top:18px}.submit:disabled{opacity:.55}.msg{display:none;margin-top:16px;padding:14px;border-radius:10px;background:#f2f4f7;line-height:1.5}.msg.error{background:#fff1f0;color:#b42318}.home{display:block;text-align:center;color:#667085;text-decoration:none;font-weight:700;margin-top:20px;padding:10px}
  </style>
</head>
<body><main class="wrap"><section class="card"><h1 id="heading">设置新密码</h1><p class="sub" id="description">请输入两次新密码。密码需要 8–128 位。</p><form id="form"><div id="password-fields"><div class="field"><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="新密码" required><button type="button" data-for="password">显示</button></div><div class="field"><input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="再次输入新密码" required><button type="button" data-for="confirm">显示</button></div></div><button class="submit" id="submit" type="submit">保存新密码</button></form><div class="msg" id="message" role="alert"></div><a class="home" href="/">返回唐人日报</a></section></main>
<script>
  const query=new URLSearchParams(location.search);const mode=query.get('mode')||'reset-password';const params=new URLSearchParams(location.hash.slice(1));const token=params.get('access_token')||'';const callbackError=params.get('error_code')||params.get('error');history.replaceState(null,'',location.pathname+location.search);const form=document.getElementById('form'),message=document.getElementById('message'),submit=document.getElementById('submit'),passwordFields=document.getElementById('password-fields');
  function show(text,error=false){message.textContent=text;message.className='msg'+(error?' error':'');message.style.display='block'}
  document.querySelectorAll('[data-for]').forEach(button=>button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.for);const visible=input.type==='text';input.type=visible?'password':'text';button.textContent=visible?'显示':'隐藏'}));
  if(mode==='bind-email'){document.title='确认找回邮箱｜唐人日报';document.getElementById('heading').textContent='确认找回邮箱';document.getElementById('description').textContent='确认后，这个邮箱可用于找回您的手机号账号密码。';passwordFields.hidden=true;passwordFields.querySelectorAll('input').forEach(input=>input.required=false);submit.textContent='确认这个邮箱'}
  if(callbackError||!token){form.hidden=true;show(mode==='bind-email'?'确认链接无效或已过期，请回到 App 重新发送确认邮件。':'重置链接无效或已过期，请回到 App 重新申请。',true)}
  form.addEventListener('submit',async event=>{event.preventDefault();const bindMode=mode==='bind-email';const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(!bindMode&&(password.length<8||password.length>128))return show('新密码需要 8–128 位。',true);if(!bindMode&&password!==confirm)return show('两次输入的新密码不一致。',true);submit.disabled=true;submit.textContent=bindMode?'正在确认…':'正在保存…';try{const payload=bindMode?{action:'verify_email',access_token:token}:{action:'complete',access_token:token,password};const response=await fetch('/.netlify/functions/unified-account-recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||(bindMode?'确认失败，请重新绑定。':'重置失败，请重新申请链接。'));form.hidden=true;show(bindMode?'找回邮箱已确认。以后忘记密码时，可以用手机号申请找回链接。':'密码已重置。现在可以回到唐人日报 App 使用新密码登录。')}catch(error){show(error.message||(bindMode?'确认失败，请稍后重试。':'重置失败，请稍后重试。'),true)}finally{submit.disabled=false;submit.textContent=bindMode?'确认这个邮箱':'保存新密码'}});
</script></body></html>
