appId: com.tangrenribao.iosapp
name: Current Tang Daily native store screenshots
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: home-language-zh-CN
    timeout: 30000
- tapOn:
    id: home-language-zh-CN
- extendedWaitUntil:
    visible:
      id: home-important-carousel
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 01-home
- scrollUntilVisible:
    element:
      id: home-topics
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: 02-topics
- tapOn:
    id: tab-immigration
- extendedWaitUntil:
    notVisible: 正在打开华人工作网…
    timeout: 60000
- assertNotVisible: 华人工作网暂时无法打开
- waitForAnimationToEnd
- takeScreenshot: 03-jobs
- tapOn:
    id: tab-legal
- extendedWaitUntil:
    visible:
      id: judge-portal-webview
    timeout: 60000
- waitForAnimationToEnd
- assertNotVisible:
    id: judge-portal-link-error
- takeScreenshot: 04-judges
- tapOn:
    id: tab-america
- extendedWaitUntil:
    notVisible: 正在打开唐人社区…
    timeout: 60000
- assertNotVisible: 唐人社区暂时无法打开
- waitForAnimationToEnd
- takeScreenshot: 05-community
